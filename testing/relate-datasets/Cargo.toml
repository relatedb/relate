[package]
name = "relate-datasets"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "Fraud and identity dataset generators for Relate"
publish = false
license.workspace = true

[dependencies]
relate = { workspace = true, features = ["parquet"] }
relate-core = { workspace = true }
relate-storage = { workspace = true, features = ["parquet"] }
# The canonical platform samplers and harness helpers (R4:
# testing/* may depend on any workspace package).
relate-test-support = { workspace = true, features = ["bolt"] }
serde = { workspace = true }
serde_json = { workspace = true }
clap = { workspace = true }
rand = { workspace = true }
chrono = { workspace = true }

[dev-dependencies]
tempfile = "3"
# Same pin as relate-storage (ADR-0268): one proptest version workspace-wide.
proptest = { workspace = true }

# The crate's binaries are auto-discovered from src/bin/*.rs (every name
# matches its file); no [[bin]] table — a partial one would be a second,
# drifting inventory of the same fact.

[features]
# The in-process profiler behind `bulk-loadtest --sample` (ADR-0244):
# forwards to relate-test-support's `profiler` feature (same name here, so
# the switch does not collide with the crate's use of relate-test-support's
# `sampling` module — the platform RSS samplers). A --no-default-features
# build refuses --sample loudly at validation instead of silently lacking
# the profiler. Default on, so the documented invocation just works.
default = ["profiler"]
profiler = ["relate-test-support/profiler"]
