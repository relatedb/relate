[package]
name = "relate-adjacency-payload-lab"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "Measurement harness for the opt-in adjacency checkpoint payload (ADR-0551): the paired payload-on/off A/B per store size, and the threshold verdict — never a shipped surface"
publish = false
license.workspace = true

[dependencies]
# `research` reads the live graph through `Database::sol_graph` — the lab
# checkpoints the in-memory master graph through the storage API.
relate = { workspace = true, features = ["research", "parquet"] }
relate-executor = { workspace = true }
relate-storage = { workspace = true, features = ["parquet"] }
relate-datasets = { workspace = true }
# The one recursive store copy each measurement run starts from.
relate-test-support = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }

[target.'cfg(unix)'.dependencies]
# The quiet-box protocol's 1/5/15-minute load stamp.
libc = { workspace = true }
