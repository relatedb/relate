[workspace]
resolver = "2"
members = ["relate/*", "surfaces/*", "testing/*", "extensions/*"]
# testing/expand-workload is the agent skill (Python tooling, no crate) and
# testing/jepsen is the standalone Clojure Jepsen harness (LABS-650, deps.edn,
# never a cargo package) — the testing/* glob would otherwise try to read
# each as a workspace member and every cargo invocation would fail on the
# missing Cargo.toml.
exclude = ["testing/expand-workload", "testing/jepsen"]
# Deliberately outside the default set (plain `cargo build` / `cargo test`
# skips them): surfaces/relate-python is a pyo3 cdylib linked through
# maturin, testing/xtask backs the `cargo xtask` maintenance command, and
# testing/relate-graph-examples is the Neo4j-docker differential suite
# (ADR-0144). Build any of them explicitly with `-p`.
default-members = [
    "relate/relate-model",
    "relate/relate-parser",
    "relate/relate-error",
    "surfaces/relate-formatter",
    "relate/relate-splitter",
    "relate/relate-names",
    "surfaces/relate-arrow",
    "surfaces/relate-cli",
    "surfaces/relate-load",
    "surfaces/relate-ffi",
    "relate/relate-core",
    "relate/relate-catalog",
    "relate/relate-ir",
    "relate/relate-front",
    "relate/relate-planner",
    "relate/relate-engine-api",
    "relate/relate-executor",
    "relate/relate-ontology",
    "relate/relate-markdown",
    "relate/relate-storage",
    "relate/relate-write-local",
    "relate/relate",
    "surfaces/relate-bolt",
    "surfaces/relate-auth",
    "surfaces/relate-http",
    "surfaces/relate-mcp",
    "surfaces/relate-serve",
    "testing/relate-datasets",
    "testing/relate-test-support",
    "testing/relate-cookbook",
    "testing/relate-query-latency",
    "surfaces/relate-wasm",
    "extensions/relate-wire",
    "extensions/relate-fs-to-graph",
    "extensions/relate-git-to-graph",
    "extensions/relate-dungeon",
]

[workspace.package]
version = "0.16.1"
edition = "2021"
repository = "https://github.com/relatedb/relate"
rust-version = "1.88"
license = "Apache-2.0"

[workspace.dependencies]
# Relate crates
relate-model = { path = "relate/relate-model" }
relate-names = { path = "relate/relate-names" }
relate-markdown = { path = "relate/relate-markdown" }
relate-parser = { path = "relate/relate-parser" }
relate-error = { path = "relate/relate-error" }
relate-formatter = { path = "surfaces/relate-formatter" }
relate-splitter = { path = "relate/relate-splitter" }
relate-arrow = { path = "surfaces/relate-arrow" }

# Runtime crates
relate-core = { path = "relate/relate-core" }
relate-catalog = { path = "relate/relate-catalog" }
relate-ir = { path = "relate/relate-ir" }
relate-front = { path = "relate/relate-front" }
relate-planner = { path = "relate/relate-planner" }
relate-engine-api = { path = "relate/relate-engine-api" }
relate-executor = { path = "relate/relate-executor" }
relate-ontology = { path = "relate/relate-ontology" }
relate-storage = { path = "relate/relate-storage", default-features = false }
relate-write-local = { path = "relate/relate-write-local" }
relate = { path = "relate/relate", default-features = false }
relate-load = { path = "surfaces/relate-load" }
relate-auth = { path = "surfaces/relate-auth" }
relate-bolt = { path = "surfaces/relate-bolt" }
relate-http = { path = "surfaces/relate-http" }
relate-mcp = { path = "surfaces/relate-mcp" }
relate-serve = { path = "surfaces/relate-serve" }
relate-datasets = { path = "testing/relate-datasets" }
relate-test-support = { path = "testing/relate-test-support" }
relate-query-latency = { path = "testing/relate-query-latency" }
# First-party extension children (ADR-0431 §11, ADR-0430 §6): the wire
# kit both sides of a mount share (the CLI host consumes it; the
# children link it), the importer children, and the game child — none
# of them links a `Database`; their only power is the MCP calls they
# make.
relate-wire = { path = "extensions/relate-wire" }
relate-fs-to-graph = { path = "extensions/relate-fs-to-graph" }
relate-dungeon = { path = "extensions/relate-dungeon" }
relate-git-to-graph = { path = "extensions/relate-git-to-graph" }

# Property-testing harness (ADR-0268): dev-only, never compiled into the
# library or the released artifact; one version workspace-wide.
proptest = "1.11"

# Data types
chrono = { version = "0.4", default-features = false, features = ["clock", "std", "serde", "wasmbind"] }
chrono-tz = "0.10"
indexmap = { version = "2", features = ["serde"] }
unicode-normalization = "0.1"
regex = "1"
thiserror = "2"

# Spatial
geo = "0.29"
wkt = { version = "0.11", features = ["geo-types"] }
geojson = { version = "0.24", features = ["geo-types"] }

# Serialization
serde = { version = "1", features = ["derive", "rc"] }
serde_json = { version = "1", features = ["float_roundtrip"] }
quick-xml = "0.37"
# YAML 1.2 for the ontology document format (ADR-0227 §5, the R6 record).
# Pure safe Rust, no build script, small tree; `encoding` (non-UTF-8 input
# decoding) is unused — documents arrive as UTF-8 text.
saphyr = { version = "0.2", default-features = false }
# The event-stream parser saphyr builds on (same crate release): used
# directly for the ontology depth screen.
saphyr-parser = { version = "0.2", default-features = false }

# REPL
rustyline = "14"
crossterm = "0.28"

# Python bindings
pyo3 = { version = "0.23", features = ["extension-module"] }

# Arrow (Relate). Match MemoryDB Cloud / iggy chrono (Arrow 54).
arrow = { version = "54", features = ["json"] }
arrow-array = "54"
arrow-schema = "54"
arrow-ipc = "54"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "io-util", "sync", "time", "signal"] }
base64 = "0.22"
# HTTP/1.1 request-head parsing for the HTTP surfaces (ADR-0234). Pure
# byte-slice parser, zero transitive deps.
httparse = "1.10"
# gzip response compression on the HTTP Query API (ADR-0385). The pure-Rust
# miniz_oxide backend is the one ureq's default `gzip` feature already
# compiles: no C toolchain, no libz-sys, no new lockfile package.
flate2 = { version = "1.1", default-features = false, features = ["rust_backend"] }
ureq = "3.4"
sha2 = "0.10"
# SSHSIG verification for release `SHA256SUMS` (ADR-0115). Pure Rust, no
# native build; `alloc` is needed for `PublicKey::verify`/`SshSig`.
ssh-key = { version = "0.6", default-features = false, features = ["alloc", "ed25519"] }

# Relate storage / Bolt / CLI
parquet = { version = "54", default-features = false, features = ["arrow", "snap"] }
clap = { version = "4", features = ["derive", "env"] }
# Bolt TLS (ADR-0109/ADR-0226): sync rustls over the peeked TcpStream. Keep
# rustls on the pure-Rust `ring` provider: the tree already resolves
# rustls/ring, and enabling default features would pull in the C/cmake
# `aws-lc-rs` build.
rustls = { version = "0.23", default-features = false, features = ["std", "logging", "tls12", "ring"] }
rustls-pemfile = "2"
# Bolt over WebSocket (ADR-0266/ADR-0226). Server-side accept only
# ("handshake" is the RFC 6455 handshake machinery); TLS is already
# terminated by rustls (ADR-0109), so no tungstenite TLS feature.
tungstenite = { version = "0.28", default-features = false, features = ["handshake"] }
# SIGINT/SIGTERM handling without a runtime (ADR-0264/ADR-0226).
signal-hook = "0.3"
libc = "0.2"
bytes = "1"
url = "2"
walkdir = "2"
rand = "0.9"
crc32fast = "1"
dashmap = "6"
rustc-hash = "2"
# Advisory file locks: relate-storage's bundle locks and the
# query-latency per-dataset ensure lock (single pin for both consumers).
fs4 = "=0.8.4"
# Native uses std::time::Instant; wasm32 has no monotonic clock in std. `web-time`
# is a drop-in that maps to `performance.now()` on wasm32 (ADR-0085).
web-time = "1"

# Testing
criterion = { version = "0.5", features = ["html_reports"] }
tempfile = "3"

# Every released native artifact (the CLI binary, the FFI cdylib behind the
# Java/JS jars, the bolt/http/mcp servers) inherits this. Thin LTO + one
# codegen unit shrink every artifact with no behavior change and no measured
# perf cost (fat LTO gains nothing further); the query-latency ratchet
# (ADR-0245) and the loadtest gates watch perf.
# `strip = "debuginfo"` is cargo's own implicit release default, made
# explicit. The former `"none"` (the macOS dyld workaround, LABS-876) also
# disabled the default DWARF strip on every platform: the FFI cdylib
# shipped 3.2 MB of debug info no earlier release ever carried.
# `"symbols"` stays off: rustc's `-C strip=symbols` runs llvm-objcopy,
# which leaves the Mach-O __LINKEDIT string table 4-byte aligned; macOS 26+
# dyld demands 8 and refuses to load the dylibs (rust-lang/rust#157750,
# fixed in LLVM 23 — the 1.88 pin predates it). Debuginfo-only stripping
# never shrinks the symbol table, so dylibs stay loadable (verified on the
# 1.88 pin: stroff mod 8 = 0, dlopen OK — and every pre-recipe release
# shipped this way via the implicit default). ELF symbol tables and the
# staticlib members' embedded thin-LTO bitcode are dropped at packaging
# time in release.yml instead.
[profile.release]
strip = "debuginfo"
lto = "thin"
codegen-units = 1

# Only the genuine wasm deltas — strip/codegen-units/debug/incremental are
# inherited from the release recipe instead of restated, so the wasm
# artifact tracks every future release-profile size tweak by construction.
[profile.release-wasm]
inherits = "release"
opt-level = "z"
lto = "fat"
panic = "abort"
overflow-checks = false

# ADR-0212: corpus profile for the cookbook recipes and the query-latency
# suite — release without the opt-level 3 passes: compiles noticeably
# faster, runs within ~1-5% of release, no debug info.
[profile.corpus]
inherits = "release"
opt-level = 2
debug = false
# Keep ADR-0212's compile speed and its backtraces: no cross-crate LTO
# pass, default codegen units, symbols kept — the corpus profile exists
# to compile and run corpora quickly locally and in CI, and the release
# profile's size recipe (strip + thin LTO) would slow the builds and
# strip the test binaries for no size benefit.
lto = false
codegen-units = 16
strip = "none"

# ADR-0253: exec-heavy unit/integration suites (relate, executor,
# storage, datasets) run 3-15x faster at opt-level 1 while debug assertions
# and overflow checks stay on; cheap suites pay seconds of extra compile.
# The suite x profile matrix behind this knob lives in
# docs/testing/runtime.md. The corpus family keeps its own corpus profile
# (ADR-0212, ADR-0252).
[profile.test]
opt-level = 1

# ADR-0244: release code with line tables, so a sampling profiler
# (`query-latency profile`, samply, perf) shows symbolized frames and source
# lines. Diagnostic builds only; released artifacts never use it.
[profile.profiling]
inherits = "release"
debug = "line-tables-only"
strip = "none"
