# Dependabot keeps every dependency ecosystem the repo ships fresh: the
# Cargo workspace and the Actions workflows at the top level, plus the
# JavaScript, Python, Java and Go client surfaces. Each directory is the
# manifest root named for its ecosystem; CI-only installs that have no
# manifest to read (the spec harness's ad-hoc pip installs of behave and
# maturin, ci.yml's pytest/maturin, the pinned neo4j driver in
# release.yml and background-cadences.yml) are not inventable here and
# stay out.
version: 2
updates:
  - package-ecosystem: cargo
    directory: "/"
    schedule:
      interval: weekly
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
  - package-ecosystem: npm
    directory: "/clients/javascript"
    schedule:
      interval: weekly
  - package-ecosystem: pip
    directory: "/surfaces/relate-python"
    schedule:
      interval: weekly
  - package-ecosystem: maven
    directory: "/clients/java"
    schedule:
      interval: weekly
  - package-ecosystem: gomod
    directory: "/clients/go"
    schedule:
      interval: weekly
