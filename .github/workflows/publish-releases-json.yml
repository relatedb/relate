name: Publish releases.json

# Backfill for ADR-0250's release-discovery document, post-gh-pages
# (ADR-0546): regenerates releases.json from the live release list and
# attaches it to the latest stable core release's assets (together with
# install.sh and install.ps1), then pokes relate-web with a repository_dispatch — the same
# handoff release.yml's publish-releases-json job performs after a release.
# The website lives in the separate relate-web repository and pulls these
# files from the release assets; this repo never commits into it.
#
# Trigger: workflow_dispatch only (manual backfill). The release pipeline
# carries its own inline publish-releases-json job; this workflow exists
# for the transitions the pipeline cannot reach — a release published
# outside the pipeline, or a relate-web that came into existence after the
# latest release ran with the poke skipped.
#
# The document is a full snapshot recomputed from the live release list on
# every run (ADR-0250 §6), so a re-run is idempotent apart from
# `generated_at`.

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Shared with release.yml's inline job: both rewrite the same release
    # asset, a conflict neither resolves.
    concurrency:
      group: publish-releases-json
      cancel-in-progress: false
    steps:
      - name: Patch CVE-2026-111943 (eMudhra CA compromise)
        run: |
          sudo apt-get update
          sudo apt-get install --only-upgrade -y ca-certificates
          sudo update-ca-certificates --fresh
          if find /usr/share/ca-certificates /etc/ssl/certs -iname '*emudhra*' -print -quit | grep -q .; then
            echo "::error::eMudhra root still trusted after CA rebuild (CVE-2026-111943)"
            exit 1
          fi
      # The generator from `main` (a backfill runs from main), plus
      # distribution for install.sh and install.ps1.
      - uses: actions/checkout@v4
        with:
          ref: main
          sparse-checkout: |
            .github/scripts
            distribution

      - name: Generate releases.json
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: .github/scripts/publish-releases-json.sh "$RUNNER_TEMP/releases.json"

      # The document belongs to the newest stable core release (vX.Y.Z —
      # the ADR-0250 stable shape; extension-channel releases never carry
      # the core document).
      - name: Attach releases.json and the installers to the latest stable release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          tag="$(gh release list --limit 100 \
            --json tagName,isDraft,isPrerelease,publishedAt \
            -q '[.[] | select((.isDraft|not) and (.isPrerelease|not) and (.tagName|test("^v[0-9]+\\.[0-9]+\\.[0-9]+$")))] | sort_by(.publishedAt) | reverse | .[0].tagName')"
          if [ -z "$tag" ]; then
            echo "::error::no stable core release exists to attach releases.json to"
            exit 1
          fi
          gh release upload "$tag" \
            "$RUNNER_TEMP/releases.json" distribution/install.sh distribution/install.ps1 --clobber
          echo "attached releases.json, install.sh and install.ps1 to $tag"

      # Same poke contract as release.yml: 404 is a stated skip until
      # relate-web exists; any other non-204 fails the run.
      - name: Poke relate-web (repository_dispatch)
        env:
          DISPATCH_TOKEN: ${{ secrets.RELATE_WEB_DISPATCH_TOKEN }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${DISPATCH_TOKEN:-}" ]; then
            echo "::notice::RELATE_WEB_DISPATCH_TOKEN is not set — skipping the relate-web poke."
            exit 0
          fi
          tag="$(gh release list --limit 100 \
            --json tagName,isDraft,isPrerelease,publishedAt \
            -q '[.[] | select((.isDraft|not) and (.isPrerelease|not) and (.tagName|test("^v[0-9]+\\.[0-9]+\\.[0-9]+$")))] | sort_by(.publishedAt) | reverse | .[0].tagName')"
          status="$(curl -sS -o "$RUNNER_TEMP/dispatch-body" -w '%{http_code}' \
            -X POST \
            -H "Authorization: Bearer $DISPATCH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            https://api.github.com/repos/relatedb/relate-web/dispatches \
            -d "{\"event_type\":\"relate-release\",\"client_payload\":{\"kind\":\"cli\",\"tag\":\"$tag\"}}")"
          case "$status" in
            204) echo "relate-web notified: kind=cli tag=$tag" ;;
            404) echo "::notice::relatedb/relate-web is not reachable (not created yet, or the token cannot see it) — skipping the poke." ;;
            *) echo "::error::repository_dispatch to relatedb/relate-web failed with HTTP $status"; cat "$RUNNER_TEMP/dispatch-body"; exit 1 ;;
          esac
