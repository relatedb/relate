name: LABS-1653 pokec shortest seek (scratch)
on:
  pull_request:
    paths: ['.github/workflows/tmp-labs-1653-perf.yml', '.rca/**']
env:
  DO_NOT_TRACK: "1"
  RELATE_TELEMETRY: "off"
jobs:
  rca:
    runs-on: linux-4-core-x86
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v7
        with: { path: relate, fetch-depth: 0, persist-credentials: false }
      - uses: actions/checkout@v7
        with:
          repository: relatedb/relate-benchmarks-private
          token: ${{ secrets.BENCHMARKS_READ_TOKEN }}
          path: relate-benchmarks-private
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@1.88.0
      - uses: astral-sh/setup-uv@v6
      - name: Machine
        run: |
          nproc; free -g | head -2; df -h . | tail -1
          sudo apt-get update -qq; sudo apt-get install -y linux-tools-common linux-tools-generic linux-tools-azure gdb 2>&1 | tail -2 || true; uname -r
          sudo sysctl kernel.perf_event_paranoid=-1 kernel.kptr_restrict=0 || true
          ls /usr/lib/linux-tools*/perf 2>/dev/null | head -2 || true
      - uses: actions/cache@v4
        id: cache
        with:
          path: |
            relate-benchmarks-private/.cache/engines
            relate-benchmarks-private/.cache/bench-env
            relate-benchmarks-private/.cache/pkc/stores
          key: rca1632-v1-6eb21b93
      - name: Fetch, build engine, load
        working-directory: relate-benchmarks-private/benchmarks/pokec
        env:
          RELATE_SRC: ${{ github.workspace }}/relate
          CARGO_PROFILE_RELEASE_DEBUG: line-tables-only
          CARGO_PROFILE_RELEASE_STRIP: none
          RUSTFLAGS: -C force-frame-pointers=yes
        run: |
          if [ "${{ steps.cache.outputs.cache-hit }}" != true ]; then ./run.sh fetch; fi
          ./run.sh env --relate-src "$RELATE_SRC" --relate-rev ${{ github.event.pull_request.head.sha }} || true
          ./run.sh load --relate-src "$RELATE_SRC" --relate-rev ${{ github.event.pull_request.head.sha }} 2>&1 | grep -v -i "token" | tail -5
      - name: Build main baseline engine
        run: |
          git -C relate worktree add ../relate-base ${{ github.event.pull_request.base.sha }}
          cd relate-base && cargo build --release -p relate-cli 2>&1 | tail -2
          ls -la target/release/relate
      - name: Measure after vs main
        env:
          RCA_QIDS: '30,31,16,17,18,19,20,23,24,25,26,27,29,21,22'
          RCA_TIMEOUT: '300'
          RCA_BASE_QIDS: '16,17,18,23,24,25,26,27,29'
        run: |
          B=relate-benchmarks-private
          CLI=$(ls $B/.cache/engines/*/relate | head -1)
          STORE=$(ls -d $B/.cache/pkc/stores/relate-*-pokec/graph.rl | head -1)
          mkdir -p rca-out
          RCA_BASE_CLI="$(realpath relate-base/target/release/relate)" python3 -I relate/.rca/measure.py "$(realpath $CLI)" "$(realpath $STORE)" "$(realpath $B/benchmarks/pokec/queries)" "$(realpath rca-out)" 2>&1 | tail -60
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: labs1653
          path: |
            rca-out/*.json
            rca-out/*.cmp
          retention-days: 7
