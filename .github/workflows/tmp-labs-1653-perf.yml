name: LABS-1653 per-rev (scratch)
on:
  pull_request:
    paths: ['.github/workflows/tmp-labs-1653-perf.yml', '.rca/**']
env:
  DO_NOT_TRACK: "1"
  RELATE_TELEMETRY: "off"
jobs:
  rca:
    strategy:
      fail-fast: false
      matrix:
        which: [base, head]
    name: rev-${{ matrix.which }}
    runs-on: linux-4-core-x86
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v7
        with: { path: relate, fetch-depth: 0, persist-credentials: false }
      - uses: actions/checkout@v7
        with:
          repository: relatedb/relate-benchmarks-private
          token: ${{ secrets.BENCHMARKS_READ_TOKEN }}
          path: relate-benchmarks-private
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@1.88.0
      - uses: astral-sh/setup-uv@v6
      - name: Machine
        run: |
          nproc; free -g | head -2; df -h . | tail -1
          sudo apt-get update -qq; sudo apt-get install -y linux-tools-common linux-tools-generic linux-tools-azure gdb 2>&1 | tail -2 || true; uname -r
          sudo sysctl kernel.perf_event_paranoid=-1 kernel.kptr_restrict=0 || true
          ls /usr/lib/linux-tools*/perf 2>/dev/null | head -2 || true
      - uses: actions/cache@v4
        id: cache
        with:
          path: |
            relate-benchmarks-private/.cache/engines
            relate-benchmarks-private/.cache/bench-env
            relate-benchmarks-private/.cache/pkc/stores
          key: rca1632-v1-6eb21b93
      - name: Fetch, build engine, load
        working-directory: relate-benchmarks-private/benchmarks/pokec
        env:
          RELATE_SRC: ${{ github.workspace }}/relate
          CARGO_PROFILE_RELEASE_DEBUG: line-tables-only
          CARGO_PROFILE_RELEASE_STRIP: none
          RUSTFLAGS: -C force-frame-pointers=yes
        run: |
          if [ "${{ steps.cache.outputs.cache-hit }}" != true ]; then ./run.sh fetch; fi
          ./run.sh env --relate-src "$RELATE_SRC" --relate-rev ${{ matrix.which == 'head' && github.event.pull_request.head.sha || github.event.pull_request.base.sha }} || true
          ./run.sh load --relate-src "$RELATE_SRC" --relate-rev ${{ matrix.which == 'head' && github.event.pull_request.head.sha || github.event.pull_request.base.sha }} 2>&1 | grep -v -i "token" | tail -5
      - name: Measure (one rev, fresh process per query)
        env:
          RCA_QIDS: '31,30'
          RCA_TIMEOUT: '700'
        run: |
          B=relate-benchmarks-private
          CLI=$(ls $B/.cache/engines/*/relate | head -1)
          STORE=$(ls -d $B/.cache/pkc/stores/relate-*-pokec/graph.rl | head -1)
          sha256sum "$CLI" | cut -c1-16
          mkdir -p rca-out q
          for n in 30 31; do grep -v '^//' $B/benchmarks/pokec/queries/q$n.cypher > q/q$n.cypher; done
          python3 -I relate/.rca/measure.py "$(realpath $CLI)" "$(realpath $STORE)" "$(realpath q)" "$(realpath rca-out)" 2>&1 | tail -20
          grep -h "^Time:" rca-out/q3*.out 2>/dev/null || grep -h -o '"Time[^}]*' rca-out/q3*.out | head
