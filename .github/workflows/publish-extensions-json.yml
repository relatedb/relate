name: Publish extensions.json

# Publishes the signed extension channel index consumed by
# `relate extension install` (the default source) and
# `extension list --available` (ADR-0431 §1): the pair extensions.json +
# extensions.json.sig, post-gh-pages (ADR-0546) attached to the extension
# release's own assets. The website lives in the separate relate-web
# repository; its publish workflow pulls the pair from there and serves
# them at the canonical https://relatedb.ai/extensions.json URL — the
# assets are the transport, never the canonical URL. Both files are
# written by this workflow only.
#
# The document is a full snapshot of the channel's package releases
# (tags `relate-extensions-<name>-<X.Y.Z>` and their per-platform
# tarballs), regenerated and re-signed on every run — the ADR-0250 §6
# publisher contract carried over — and it is SIGNED: the one release
# signing key (ADR-0115, the same key that signs SHA256SUMS) under the
# `relate-release` SSHSIG namespace. Signing stays in this repository:
# the key lives only here, never in relate-web. An unsigned index is not
# a publishable artifact; the script refuses without the key.
#
# Trigger:
#   - `workflow_call` — chained from release-extensions.yml's
#     `publish-extensions-json` job, which runs after `create-release`
#     (the asset list is complete). Chained explicitly because
#     release-extensions.yml publishes via softprops/action-gh-release
#     with the default GITHUB_TOKEN, and GitHub suppresses downstream
#     workflow runs for GITHUB_TOKEN-triggered events (ADR-0265) — a
#     `release: published` trigger here would never fire.
#   - `workflow_dispatch` — manual run: a BACKFILL that regenerates the
#     index from the existing releases without cutting one (the
#     publish-releases-json backfill shape) and re-pokes relate-web.
#
# Idempotent apart from `generated_at`: the document is recomputed from
# the live release list, so a re-run for the same releases is safe.

on:
  workflow_call:
    inputs:
      tag:
        description: "Extension release tag this publish belongs to (the assets land there; empty on a manual backfill = newest extension release)"
        required: false
        type: string
        default: ""
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Serialize publishes: two runs would both rewrite the same release
    # assets, a conflict neither resolves. Job-level (not workflow-level)
    # so it holds for both entry paths.
    concurrency:
      group: publish-extensions-json
      cancel-in-progress: false

    steps:
      - name: Patch CVE-2026-111943 (eMudhra CA compromise)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --only-upgrade -y ca-certificates
          sudo update-ca-certificates --fresh
          # Post-condition (remediation assurance): the compromised root
          # must be absent from the rebuilt store -- an on-path attacker
          # replaying validly-signed metadata could otherwise make the
          # upgrade a silent no-op behind a green check. A fixed runner
          # image satisfies this too, so it never false-fails the lane.
          if find /usr/share/ca-certificates /etc/ssl/certs -iname '*emudhra*' -print -quit | grep -q .; then
            echo "::error::eMudhra root still trusted after CA rebuild (CVE-2026-111943)"
            exit 1
          fi
          dpkg-query -W -f='ca-certificates ${Version}' ca-certificates
      # The generator reads the live release list; `main` carries the
      # current script (a backfill dispatch runs from main as well), and
      # only the script directory is needed.
      - name: Checkout main (generator)
        uses: actions/checkout@v4
        with:
          ref: main
          sparse-checkout: |
            .github/scripts

      # RELEASE_SIGNING_PRIVATE_KEY rides the inherited secrets
      # (release-extensions.yml calls with `secrets: inherit`) — the
      # script writes it to a 0600 temp file and removes it, the
      # create-release SHA256SUMS signing shape.
      - name: Generate and sign extensions.json
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          RELEASE_SIGNING_PRIVATE_KEY: ${{ secrets.RELEASE_SIGNING_PRIVATE_KEY }}
        run: .github/scripts/publish-extensions-json.sh "$RUNNER_TEMP/extensions.json" "$RUNNER_TEMP/extensions.json.sig"

      # Resolve the release the pair lands on: the caller's tag, or the
      # newest extension release on a manual backfill.
      - name: Resolve target release
        id: target
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          tag="$INPUT_TAG"
          if [ -z "$tag" ]; then
            tag="$(gh release list --limit 100 \
              --json tagName,isDraft,isPrerelease,publishedAt \
              -q '[.[] | select((.isDraft|not) and (.isPrerelease|not) and (.tagName|test("^relate-extensions-")))] | sort_by(.publishedAt) | reverse | .[0].tagName')"
          fi
          if [ -z "$tag" ]; then
            echo "::error::no extension release exists to attach extensions.json to"
            exit 1
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - name: Attach the signed index to the extension release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          gh release upload "${{ steps.target.outputs.tag }}" \
            "$RUNNER_TEMP/extensions.json" "$RUNNER_TEMP/extensions.json.sig" --clobber

      # Same poke contract as release.yml's publish-releases-json job
      # (ADR-0546), with kind=extension: 404 is a stated skip until
      # relate-web exists; any other non-204 fails the run.
      - name: Poke relate-web (repository_dispatch)
        env:
          DISPATCH_TOKEN: ${{ secrets.RELATE_WEB_DISPATCH_TOKEN }}
          RELEASE_TAG: ${{ steps.target.outputs.tag }}
        run: |
          set -euo pipefail
          if [ -z "${DISPATCH_TOKEN:-}" ]; then
            echo "::notice::RELATE_WEB_DISPATCH_TOKEN is not set — skipping the relate-web poke."
            exit 0
          fi
          status="$(curl -sS -o "$RUNNER_TEMP/dispatch-body" -w '%{http_code}' \
            -X POST \
            -H "Authorization: Bearer $DISPATCH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            https://api.github.com/repos/relatedb/relate-web/dispatches \
            -d "{\"event_type\":\"relate-release\",\"client_payload\":{\"kind\":\"extension\",\"tag\":\"$RELEASE_TAG\"}}")"
          case "$status" in
            204) echo "relate-web notified: kind=extension tag=$RELEASE_TAG" ;;
            404) echo "::notice::relatedb/relate-web is not reachable (not created yet, or the token cannot see it) — skipping the poke." ;;
            *) echo "::error::repository_dispatch to relatedb/relate-web failed with HTTP $status"; cat "$RUNNER_TEMP/dispatch-body"; exit 1 ;;
          esac
