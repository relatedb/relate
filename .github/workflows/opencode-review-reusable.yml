name: OpenCode Review — Reusable

# Shared body for the three per-skill review checks (ADR-0258). Each kind
# keeps its own caller workflow (opencode-review-{stellar,rust,security}.yml),
# so GitHub still reports three separate checks with independent re-runs;
# this file exists only so the shared steps live in exactly one place.
# Trigger, draft/same-repo if-guard, concurrency, and permissions all live in
# the callers: a workflow_call workflow has no pull_request event of its own,
# and a called workflow can never exceed the caller job's permissions.
#
# Every lane runs the model step without any GitHub token and with its
# $GITHUB_ENV/$GITHUB_PATH publish channels blanked; all posting is
# scripted in post steps that restore the workspace first — sourcing
# the restore choreography from the PR head's committed copy, never the
# model-writable worktree (ADR-0603).
#
# The blanking stops the model's own file-command writes, not every
# publication channel: the runner's env file for a later step lives
# under RUNNER_TEMP at a path a model shell can write directly. Each
# token-bearing post step therefore pins its process-start environment
# in its step env block: every env channel the ELF loader and the
# runner's interpreters document for loading code at process start —
# the loader's LD_PRELOAD, LD_LIBRARY_PATH and LD_AUDIT (ld.so(8));
# the shell startup files BASH_ENV (bash(1)) and ENV (POSIX sh);
# python's PYTHONSTARTUP, PYTHONPATH and PYTHONHOME (python(1));
# node's NODE_OPTIONS and NODE_PATH (node(1)); perl's PERL5OPT,
# PERL5LIB and PERLLIB (perlrun(1)); ruby's RUBYOPT and RUBYLIB
# (ruby(1)); RubyGems' GEM_HOME and GEM_PATH (gem(1)) — each pinned
# to the empty string, PATH to the fixed system list
# review-restore.sh also pins. An empty value is inert for every one
# of them (an empty list has no entries; an empty startup-file name
# opens nothing), so the pins change no step behavior — they only
# hold the channels closed from process start. A step env entry
# is the most specific Actions env scope and so overrides anything
# published into the job (workflow-syntax docs,
# jobs.<job_id>.steps.env), and the runner applies it before the
# step's first process starts — where the restore script's in-script
# PATH pin is already too late for shell/loader startup.
#
# The same step env pins git's configuration file sources (the round-5
# finding: the model shell can write .git/config, the worktree-scoped
# config and the shared HOME gitconfig, and every git command the post
# steps run parses them): GIT_CONFIG_GLOBAL and GIT_CONFIG_SYSTEM
# point at /dev/null, GIT_CONFIG_NOSYSTEM skips the system file
# outright, and GIT_CONFIG_COUNT=0 zeroes the env-numbered config
# channel — GIT_CONFIG_KEY_n/GIT_CONFIG_VALUE_n pairs are git
# configuration too, plantable through the same RUNNER_TEMP env file.
# The zero is the posture of every git call but the authenticated
# fetches: lib/review-endpoints.sh's git_authed (the one authenticated
# git invocation every fetch in these steps routes through) raises the
# count to exactly 1 through command-scoped assignments of a fixed key
# and the step's assembled credential, for the fetch command alone —
# the GitHub token reaches git through that env-numbered channel,
# never the command line, where a surviving model-spawned process
# would read it through ps (the round-9 Medium); the two spellings
# cannot conflict, and a model-published pair stays inert everywhere
# else.
# What survives is the repository's own .git/config, and that file the
# restore choreography replaces outright — before its first git
# invocation — with the minimal trusted configuration the checkout
# genuinely needs (nothing sourced from model-writable state; the
# round-6 finding: a model-written core.worktree redirects the reset
# to a decoy directory, filter.<driver>.smudge plus core.attributesFile
# executes during reset --hard, and url.*.insteadOf rewrites the fetch
# URL to an ext:: command). Until the replacement lands, every git
# call in these steps — the staging git show, the helper's reset,
# clean and ls-files, the prep fetches — pins the same knobs off per
# invocation: -c core.fsmonitor= -c core.pager=cat -c core.worktree=.
# -c protocol.ext.allow=never -c core.attributesFile=.
# -c core.hooksPath=/dev/null — the last pin restoring the hooks
# guarantee the round-7 GIT_CONFIG_GLOBAL=/dev/null pin had masked
# (the round-9 High: the model shell can write the default .git/hooks
# directory, and probed on git 2.43/2.54 an undefended reset --hard
# executes a model-crafted .git/hooks/reference-transaction — so the
# minimal replacement .git/config itself carries
# core.hooksPath = /dev/null and every invocation pins the same: each
# hook lookup lands on /dev/null, where none is found).
#
# Round 8 closes the three channels that survived all of the above.
# Replace objects are off — GIT_NO_REPLACE_OBJECTS=1 pinned in every
# token-bearing post step's env, plus --no-replace-objects on the
# staging git shows and the helper's reset — so a model-created
# refs/replace/<SHA> entry cannot steer the staged helper bytes or
# the reset target onto attacker-crafted objects. .git/info/attributes
# — the one attribute source no pin or replacement covered — is
# deleted by the restore choreography alongside the config
# replacement; the worktree .gitattributes the reset restores is then
# the only attribute source left, with core.attributesFile pinned
# empty. And the facts-recomputation diffs (facts.py's four reads and
# incremental.py's anchoring patch, recomputed here after the model
# step) carry --no-ext-diff --no-textconv, so a model-written
# diff.external or diff.<driver>.command — planted during the model
# step or re-added to .git/config by a persistent model-spawned child
# between git calls — cannot execute during facts recomputation.

on:
  workflow_call:
    inputs:
      review_kind:
        description: 'Exact review-kind marker string (e.g. "Rust review"). Passed to the verdict gate as REVIEW_KIND and used in prompt step names.'
        required: true
        type: string
      prompt_header:
        description: 'Per-kind prompt header file name under .github/prompts/ (e.g. opencode-review-rust.md), concatenated with opencode-review-protocol.md. Unused by the scripted pipeline — its header ships with the stellar-review plugin (ADR-0623).'
        required: false
        type: string
        default: ''
      job_name:
        description: 'Lowercase kind label used in step names (e.g. "rust"). The check name itself comes from the caller workflow name and job id.'
        required: true
        type: string
      pipeline:
        description: '"scripted" runs the ADR-0271 stellar pipeline (facts/scope/brief before, post.py after); "kind" (default) runs the per-kind pipeline (ADR-0603): scripted inputs and the no-op gate before, opencode-review-post.py after. Both run the model without a GitHub token — its only output is .stellar/findings.json.'
        required: false
        type: string
        default: 'kind'
      review_timeout_minutes:
        description: 'The model run is capped at this many minutes of wall clock, of which the last three are shutdown headroom (SIGINT grace, kill-after, the timeout marker write) — the model itself gets the rest. A timed-out run never passes: the stellar poster posts whichever findings document survived as a forced-fail partial round, the per-kind poster fails closed without trusting the document of a killed run, and with no document either poster reports a distinct timeout reason; the next push or re-run starts a fresh round. Per-kind override knob (LABS-635).'
        required: false
        type: number
        default: 15
    secrets:
      FIREWORKS_API_KEY:
        description: 'Fireworks API key for the review model (ADR-0258; model override per ADR-0302). Must be passed explicitly by each caller.'
        required: true
      # Model overrides (ADR-0302) are declared explicitly instead of
      # `secrets: inherit`: a called workflow sees only these knobs, never
      # every repo secret (least privilege).
      OPENCODE_REVIEW_MODEL:
        description: 'Model override for the review run (ADR-0302). Optional; empty = repo variable, then the built-in default.'
        required: false
      STELLAR_MODEL_STRUCTURE:
        description: 'Stellar structure pass model (ADR-0302); empty = no override.'
        required: false
      STELLAR_MODEL_BRANCHING:
        description: 'Stellar branching pass model (ADR-0302); empty = no override.'
        required: false
      STELLAR_MODEL_BOUNDARIES:
        description: 'Stellar boundaries pass model (ADR-0302); empty = no override.'
        required: false
      STELLAR_MODEL_COMPARISON:
        description: 'Stellar comparison pass model (ADR-0302); empty = no override.'
        required: false

# CI is not a user session: the CLI's anonymous usage metrics
# (ADR-0079) are opted out on every relate spawn a lane of this
# workflow can reach — including any the review agents run on the
# runner while reading the diff. Workflow-level — the ADR-0255
# single-source placement, so every lane inherits the identical value —
# and DO_NOT_TRACK is not a CARGO* var, so the Swatinem/rust-cache
# environment hash is untouched.
env:
  DO_NOT_TRACK: "1"
  # The stellar-review plugin (ADR-0623) — npm opencode-stellar-review —
  # owns the review pipeline this workflow drives. Pinned exact; bump
  # deliberately and in lockstep with every workflow that installs it
  # (scripts/tests/test_stellar_plugin_wiring.py asserts they agree).
  STELLAR_REVIEW_VERSION: "0.1.2"

jobs:
  review:
    runs-on: ubuntu-latest
    steps:
      - name: Patch CVE-2026-111943 (eMudhra CA compromise)
        if: runner.os == 'Linux'
        run: |
          set -euo pipefail
          # Transient apt/repository flakes killed review rounds silently
          # (the eMudhra lane on #523/#524) — three attempts before this
          # lane gives up (LABS-615).
          for attempt in 1 2 3; do
            if sudo apt-get update && sudo apt-get install --only-upgrade -y ca-certificates; then
              break
            fi
            echo "apt attempt $attempt failed; retrying"
            if [ "$attempt" -eq 3 ]; then
              echo "::error::ca-certificates upgrade failed after 3 attempts"
              exit 1
            fi
            sleep $((attempt * 10))
          done
          sudo update-ca-certificates --fresh
          # Post-condition (remediation assurance): the compromised root
          # must be absent from the rebuilt store -- an on-path attacker
          # replaying validly-signed metadata could otherwise make the
          # upgrade a silent no-op behind a green check. A fixed runner
          # image satisfies this too, so it never false-fails the lane.
          if find /usr/share/ca-certificates /etc/ssl/certs -iname '*emudhra*' -print -quit | grep -q .; then
            echo "::error::eMudhra root still trusted after CA rebuild (CVE-2026-111943)"
            exit 1
          fi
          dpkg-query -W -f='ca-certificates ${Version}' ca-certificates
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          # No pipeline path persists the checkout token into .git/config
          # (ADR-0603): the model runs with shell access and would read a
          # persisted token, so every later git operation authenticates
          # per command with its own step's token.
          persist-credentials: false

      - name: Install opencode
        # Pinned install (version + sha256, ADR-0258) lives in the script —
        # the single source shared with release-notes.yml.
        run: .github/scripts/install-opencode.sh

      # The stellar-review plugin (ADR-0623): the pipeline scripts, pass
      # briefs and posting core live in the npm package, no longer in
      # this repository. Two installs of the same pinned version, each
      # for one consumer: the npm prefix gives the shell steps a stable
      # tools path — STELLAR_ROOT, published as a fixed runner-authored
      # value the PRE-MODEL steps may read (the post steps never trust
      # it: they pin the same path from runner.temp in their step env,
      # the round-22 finding class) — and `opencode plugin add` pre-seeds
      # the CLI's plugin cache so the model step's `opencode run` loads
      # the skill immediately instead of racing a background install.
      # Both lanes need it: scripted runs the stellar pipeline, the
      # per-kind lanes import the plugin's facts.py/post.py core.
      - name: Install the stellar-review plugin (pinned)
        run: |
          set -euo pipefail
          npm install --prefix "$RUNNER_TEMP/stellar-review" \
            "opencode-stellar-review@${STELLAR_REVIEW_VERSION}"
          STELLAR_ROOT="$RUNNER_TEMP/stellar-review/node_modules/opencode-stellar-review"
          test -x "$STELLAR_ROOT/scripts/stellar-prep.sh"
          test -f "$STELLAR_ROOT/skills/stellar-review/tools/post.py"
          echo "STELLAR_ROOT=$STELLAR_ROOT" >> "$GITHUB_ENV"
          opencode plugin add "opencode-stellar-review@${STELLAR_REVIEW_VERSION}"

      # Scripted pipeline (stellar, ADR-0271): deterministic facts, ledger
      # and briefs BEFORE the model runs, so the model only judges. The
      # docs-only gate posts the no-op verdict without spending tokens.
      - name: Review facts and scope (scripted)
        if: inputs.pipeline == 'scripted'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          "$STELLAR_ROOT/scripts/stellar-prep.sh" model
          if [ "$(jq -r .has_code_changes .stellar/facts.json)" = "false" ]; then
            python3 "$STELLAR_ROOT/skills/stellar-review/tools/post.py" noop --repo "$REPO" --pr "$PR_NUMBER"
          fi

      # Per-kind pipeline (rust, security — ADR-0603): the stellar
      # scripted pipeline's shape, for whole-diff judgment instead of
      # per-unit briefs. The pre-step fetches the endpoints, computes
      # the merge-based diff artifact the model reads (never gh) and
      # the kind's no-op gate — deterministically, not by the model:
      # rust runs only on *.rs / Cargo.toml / Cargo.lock changes,
      # security on any code change and always on the CI-control paths.
      - name: Review inputs (${{ inputs.job_name }})
        if: inputs.pipeline != 'scripted'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          REVIEW_KIND: ${{ inputs.review_kind }}
        run: .github/scripts/opencode-review-prep.sh model

      # The runtime prompt is the per-kind header followed by the shared
      # protocol; concatenated they are equivalent to the pre-split
      # single-file prompts. The stellar scripted pipeline carries its
      # own standalone prompt instead (the skill owns its dispatch shape,
      # and the protocol's findings-document contract does not apply
      # there).
      #
      # The prompt bytes are PR-controlled (the header and the protocol
      # are read from the PR's own checkout), so they must never transit
      # $GITHUB_ENV: the pre-fix heredoc write could be terminated early
      # by a planted PROMPT_EOF line inside a prompt file, and every line
      # after it would become an arbitrary NAME=VALUE environment write
      # for all later steps — the token-bearing post steps included. The
      # concatenated prompt lands in a file under RUNNER_TEMP instead
      # (the timeout marker's channel), and only its fixed,
      # runner-controlled path crosses the step boundary.
      - name: Build ${{ inputs.job_name }} prompt file
        run: |
          PROMPT_FILE="$RUNNER_TEMP/review-prompt.md"
          {
            echo "REPO: ${{ github.repository }}"
            echo "PR NUMBER: ${{ github.event.pull_request.number }}"
            echo "HEAD SHA: ${{ github.event.pull_request.head.sha }}"
            echo
            if [ "${{ inputs.pipeline }}" = "scripted" ]; then
              # The stellar lane's header ships with the plugin (ADR-0623)
              # — one spelling, no repo-side copy to drift from.
              cat "$STELLAR_ROOT/templates/ci/opencode-review-stellar.md"
            else
              cat ".github/prompts/${{ inputs.prompt_header }}"
              echo
              cat .github/prompts/opencode-review-protocol.md
            fi
          } > "$PROMPT_FILE"
          # The workflow's only $GITHUB_ENV write, and a fixed value: a
          # planted PROMPT_EOF line in a prompt file is inert file
          # content now — no prompt byte reaches any step's environment.
          echo "PROMPT_FILE=$PROMPT_FILE" >> "$GITHUB_ENV"

      - name: Run OpenCode (${{ inputs.job_name }} review)
        # The pre-steps skip the model when the deterministic gate already
        # decided (a docs-only or kind-irrelevant diff).
        if: env.SCRIPTED_NOOP != 'true'
        env:
          # FIREWORKS_API_KEY must be provisioned as a repo secret (ADR-0258).
          # The model is overridable since ADR-0302: OPENCODE_REVIEW_MODEL
          # resolves secret → repo variable → default. The default is the
          # models.dev catalog router glm-fast-latest, which tracks GLM fast
          # releases; for a reproducible gate, set the override to a pinned
          # catalog model ID (e.g. accounts/fireworks/models/glm-5p3).
          FIREWORKS_API_KEY: ${{ secrets.FIREWORKS_API_KEY }}
          # The inner timeout cap, as a number the shell can do
          # arithmetic on (GitHub expressions cannot): the run block
          # subtracts the shutdown headroom from it.
          REVIEW_TIMEOUT_MINUTES: ${{ inputs.review_timeout_minutes }}
          OPENCODE_REVIEW_MODEL: ${{ secrets.OPENCODE_REVIEW_MODEL || vars.OPENCODE_REVIEW_MODEL || 'fireworks-ai/accounts/fireworks/routers/glm-fast-latest' }}
          # Per-pass model overrides (ADR-0302, the ADR-0623 arm): the
          # plugin's skill reads STELLAR_MODEL_<PASS> per dispatch (its
          # SKILL.md Step 2) — the generated per-agent config writer is
          # gone with the vendored copy. Unset or empty = no override;
          # the pass inherits the run-level model above.
          STELLAR_MODEL_STRUCTURE: ${{ secrets.STELLAR_MODEL_STRUCTURE || vars.STELLAR_MODEL_STRUCTURE }}
          STELLAR_MODEL_BRANCHING: ${{ secrets.STELLAR_MODEL_BRANCHING || vars.STELLAR_MODEL_BRANCHING }}
          STELLAR_MODEL_BOUNDARIES: ${{ secrets.STELLAR_MODEL_BOUNDARIES || vars.STELLAR_MODEL_BOUNDARIES }}
          STELLAR_MODEL_COMPARISON: ${{ secrets.STELLAR_MODEL_COMPARISON || vars.STELLAR_MODEL_COMPARISON }}
          # No pipeline path hands the model a real token (ADR-0603): the
          # literal string "none" is an invalid token, so any gh call
          # fails loudly — the model reads its inputs from the scripted
          # artifacts and posting belongs to the post steps.
          GH_TOKEN: none
          # The model shell must not publish environment variables or
          # PATH entries into later steps (ADR-0603): the empty-string
          # entries below replace the runner's $GITHUB_ENV/$GITHUB_PATH
          # file paths with the empty string, so every write the model
          # attempts against either fails — a BASH_ENV-style payload it
          # plants this way is never live in the post steps. PROMPT_FILE,
          # published by the fixed-value step above, still arrives here
          # as a normal env var: blanking the channel stops new writes,
          # it does not unset already-published values.
          GITHUB_ENV: ''
          GITHUB_PATH: ''
          # Explicit deny rules for --auto (the round-6 finding): the
          # flag auto-approves only what no deny rule blocks, so the
          # classes the rest of the sandbox boundary cannot absorb are
          # refused loudly instead — passwordless sudo and docker (the
          # runner-root tamper channel; docker is sudo's root-equivalent
          # on the hosted runners), the network-client shell commands
          # and git's network verbs plus bash's /dev/tcp redirections
          # (the provider-key exfil channel; FIREWORKS_API_KEY is
          # necessarily in this step's environment), and tool writes to
          # absolute paths outside the workspace and RUNNER_TEMP (the
          # ordered _temp allow after the edit deny is the one
          # carve-out — the runner's scratch space). Delivered as
          # experimental.policies through OPENCODE_CONFIG_CONTENT, a
          # virtual config layer the runner authors: the policy hook
          # forces its deny AFTER rule evaluation, so a PR's own
          # project config (an opencode.json in the reviewed tree — the
          # last config layer, whose rules would otherwise win) cannot
          # re-allow what this layer denies. A denied call fails the
          # tool call, not the run — the model sees the refusal and
          # continues, so the round-4 permission-abort class (a
          # declined cleanup killing the lane) stays solved; a residual
          # remains: the model can still read its process environment
          # and echo values into its findings document, so a dedicated
          # spend-capped review key is the ops follow-up.
          OPENCODE_CONFIG_CONTENT: |-
            {
              "experimental": {
                "policies": [
                  {"action": "permission", "resource": "shell:sudo *", "effect": "deny"},
                  {"action": "permission", "resource": "shell:docker *", "effect": "deny"},
                  {"action": "permission", "resource": "shell:curl *", "effect": "deny"},
                  {"action": "permission", "resource": "shell:wget *", "effect": "deny"},
                  {"action": "permission", "resource": "shell:nc *", "effect": "deny"},
                  {"action": "permission", "resource": "shell:ncat *", "effect": "deny"},
                  {"action": "permission", "resource": "shell:socat *", "effect": "deny"},
                  {"action": "permission", "resource": "shell:ssh *", "effect": "deny"},
                  {"action": "permission", "resource": "shell:scp *", "effect": "deny"},
                  {"action": "permission", "resource": "shell:sftp *", "effect": "deny"},
                  {"action": "permission", "resource": "shell:ftp *", "effect": "deny"},
                  {"action": "permission", "resource": "shell:telnet *", "effect": "deny"},
                  {"action": "permission", "resource": "shell:rsync *", "effect": "deny"},
                  {"action": "permission", "resource": "shell:git clone *", "effect": "deny"},
                  {"action": "permission", "resource": "shell:git fetch *", "effect": "deny"},
                  {"action": "permission", "resource": "shell:git pull *", "effect": "deny"},
                  {"action": "permission", "resource": "shell:git push *", "effect": "deny"},
                  {"action": "permission", "resource": "shell:git ls-remote *", "effect": "deny"},
                  {"action": "permission", "resource": "shell:git submodule *", "effect": "deny"},
                  {"action": "permission", "resource": "shell:*> /dev/tcp/*", "effect": "deny"},
                  {"action": "permission", "resource": "shell:*<>/dev/tcp/*", "effect": "deny"},
                  {"action": "permission", "resource": "edit:/*", "effect": "deny"},
                  {"action": "permission", "resource": "edit:/home/runner/work/_temp/*", "effect": "allow"},
                  # The model's own network-capable TOOLS are denied
                  # outright (the round-12 finding): the shell rules
                  # above name literal shell clients, but webfetch and
                  # websearch are separate tools the model can call
                  # without a shell — and the review lanes never need
                  # them (the prompts already forbid fetching external
                  # URLs). The interpreter-socket residual (python/node
                  # opening sockets despite the shell rules) remains the
                  # adjudicated accepted risk bounded by the
                  # spend-limited review key (LABS-1689).
                  {"action": "permission", "resource": "webfetch", "effect": "deny"},
                  {"action": "permission", "resource": "websearch", "effect": "deny"},
                  # The absolute-path and env-wrapper spellings of the
                  # denied tools (the round-16 finding): prefix patterns
                  # match only the literal command names, so
                  # /usr/bin/sudo, env sudo, /usr/bin/docker and the
                  # -C form of git's network verbs slip past them. These
                  # close the named vectors; the pattern-vs-sandbox
                  # class itself (anything not named can still run) is
                  # the adjudicated residual — the bounds are the
                  # container-topology redesign and the spend-limited
                  # review key (LABS-1689).
                  {"action": "permission", "resource": "shell:/usr/bin/sudo *", "effect": "deny"},
                  {"action": "permission", "resource": "shell:/usr/bin/docker *", "effect": "deny"},
                  {"action": "permission", "resource": "shell:/usr/bin/curl *", "effect": "deny"},
                  {"action": "permission", "resource": "shell:/usr/bin/wget *", "effect": "deny"},
                  {"action": "permission", "resource": "shell:env sudo*", "effect": "deny"},
                  {"action": "permission", "resource": "shell:env docker*", "effect": "deny"},
                  {"action": "permission", "resource": "shell:env curl*", "effect": "deny"},
                  {"action": "permission", "resource": "shell:git -C * fetch*", "effect": "deny"},
                  {"action": "permission", "resource": "shell:git -C * clone*", "effect": "deny"},
                  {"action": "permission", "resource": "shell:git -C * pull*", "effect": "deny"},
                  {"action": "permission", "resource": "shell:git -C * push*", "effect": "deny"}
                ]
              }
            }
        # The cap (LABS-635): a wedged model must not hold the lane
        # hostage. SIGINT first (a graceful stop can still flush a
        # findings document), kill 60s later; a timed-out run leaves no
        # findings.json and the poster says "timed out", not the generic
        # missing-file reason. The next push or re-run starts fresh.
        #
        # The timeout fact travels as a wrapper-authored marker file in
        # RUNNER_TEMP, never $GITHUB_ENV: the model has shell access and
        # could forge an env var to steer the poster onto the
        # partial-salvage path. The wrapper writes the marker's FINAL
        # state only after the model process has exited, so a forged
        # marker the model dropped mid-run is always clobbered by the
        # authoritative write (OPLANE_REQ-00333784).
        #
        # The inner coreutils cap sits three minutes under the step's
        # own backstop (which shares the input's value — GitHub
        # expressions have no arithmetic, so the headroom is computed
        # here, in the shell that supports it): at equal values
        # GitHub's cancellation races the wrapper's
        # SIGINT-then-kill-then-marker-write sequence and can kill the
        # step first, so the salvage path and the distinct timeout
        # reason never fire (still fail-closed, but always the generic
        # reason). Three minutes cover the SIGINT grace, the 60s
        # kill-after, and the authoritative marker write.
        timeout-minutes: ${{ inputs.review_timeout_minutes }}
        run: |
          # The prompt itself never travels through the environment: the
          # build step above left the full text in $PROMPT_FILE, and it
          # is read straight into the invocation's argv here.
          MARKER="$RUNNER_TEMP/review_timed_out"
          set +e
          # --auto — auto-approve permission requests that no deny rule
          # blocks (the flag's own contract). The runner sandbox is the
          # permission boundary: the step carries no GitHub token
          # (GH_TOKEN is the invalid literal "none"), its env-publish
          # channels are blanked, and the post steps trust nothing the
          # model left behind — so an approved shell call grants nothing
          # the model could not already do, and every trust decision
          # stays scripted in the posts. Without it, a non-interactive
          # run auto-rejects whatever the permission classifier does not
          # pre-allow: in run 43635101612 the security model's
