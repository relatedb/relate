          # against its name.
          if [ ! -d .git ]; then
            echo "post: .git is not a directory (gitdir: redirect?) — refusing to stage" >&2
            exit 1
          fi
          rm -f .git/objects/info/alternates
          # A model-planted .git/commondir file redirects the object
          # store (and refs/config resolution) to a directory of the
          # model's choosing — sidestepping the alternates deletion and
          # the fsck below, which both operate on .git itself (the
          # round-19 finding). The runner's checkout has no commondir
          # file (.git IS the common dir), so any present one is
          # planted and removed.
          rm -f .git/commondir
          # fsck itself reads the repository config — still the
          # model-written .git/config at this point, where
          # fsck.badObjectSha1=ignore would suppress exactly the
          # content-against-name check this guard exists to run (the
          # round-19 finding). The pins force the check to error level
          # regardless of what the config says, and neutralize
          # fsck.skipList (the round-20 finding — the config could
          # exempt chosen objects from the check): the empty string is
          # NOT a valid unset here (git tries to open an object-name
          # list at the empty path and dies: "could not open object
          # name list"), so the list is pinned to /dev/null — an
          # always-empty list on a root-owned device node the runner
          # user can neither replace nor write.
          git -c fsck.badObjectSha1=error -c fsck.skipList=/dev/null fsck --full --no-progress >/dev/null
          RESTORE="$(mktemp)"
          git --no-replace-objects -c core.fsmonitor= -c core.pager=cat -c core.worktree=. -c protocol.ext.allow=never -c core.attributesFile= -c core.hooksPath=/dev/null show "$HEAD_SHA:.github/scripts/review-restore.sh" > "$RESTORE"
          # shellcheck disable=SC1090
          . "$RESTORE" .stellar/findings.json
          # Facts and the diff are recomputed from git — never from the
          # .stellar documents the model step could have rewritten.
          P=.github/scripts/opencode-review-post.py
          # The no-op gate is the prep's last stdout line — the freshly
          # computed facts piped straight into the gate — never a
          # re-read of model-writable .stellar/facts.json between the
          # trusted write and this decision.
          GATE=$(.github/scripts/opencode-review-prep.sh post | tail -n 1)
          if [ "$GATE" = "true" ]; then
            python3 "$P" noop --kind "$REVIEW_KIND" --repo "$REPO" --pr "$PR_NUMBER"
            exit 0
          fi
          # The findings-document gate is the poster's check subcommand —
          # one implementation for the decision and the diagnosis, so a
          # no-findings round names its cause.
          VALID_MSG=$(python3 "$P" check --findings .stellar/findings.json 2>&1) && VALID=true || VALID=false
          if [ "$TIMED_OUT" = "1" ]; then
            # A killed run never greens the check: a single-shot review's
            # completeness cannot be verified, so its findings document is
            # not trusted for a verdict — the next push or re-run starts
            # a fresh round.
            python3 "$P" fail --kind "$REVIEW_KIND" --repo "$REPO" --pr "$PR_NUMBER" \
              --reason "review timed out after ${{ inputs.review_timeout_minutes }} minutes — a killed run's findings document is not trusted for a verdict; the next push or re-run starts a fresh round"
          elif [ "$VALID" = "true" ]; then
            python3 "$P" post --kind "$REVIEW_KIND" --repo "$REPO" --pr "$PR_NUMBER" \
              --head-sha "$HEAD_SHA" --findings .stellar/findings.json
          else
            python3 "$P" fail --kind "$REVIEW_KIND" --repo "$REPO" --pr "$PR_NUMBER" \
              --reason "model run produced no valid .stellar/findings.json — $VALID_MSG"
          fi
            ;;
            *)
              /usr/bin/env -i \
                PATH=/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin \
                LANG=C.UTF-8 \
                HOME="$HOME" RUNNER_TEMP="$RUNNER_TEMP" TMPDIR="$TMPDIR" \
                GH_TOKEN="$GH_TOKEN" GH_HOST=github.com \
                GH_ENTERPRISE_TOKEN= GITHUB_REPOSITORY="$GITHUB_REPOSITORY" \
              BASE_SHA="$BASE_SHA" HEAD_SHA="$HEAD_SHA" REPO="$REPO" \
              PR_NUMBER="$PR_NUMBER" REVIEW_KIND="$REVIEW_KIND" \
              RESTORE_SHA="$RESTORE_SHA" STELLAR_ROOT="$STELLAR_ROOT" \
                GITHUB_ENV=/dev/null \
                BASH_ENV= ENV= LD_PRELOAD= LD_LIBRARY_PATH= LD_AUDIT= \
                PYTHONSTARTUP= PYTHONPATH= PYTHONHOME= \
                NODE_OPTIONS= NODE_PATH= PERL5OPT= PERL5LIB= PERLLIB= \
                RUBYOPT= RUBYLIB= GEM_HOME= GEM_PATH= \
                GIT_CONFIG_GLOBAL=/dev/null GIT_CONFIG_SYSTEM=/dev/null \
                GIT_CONFIG_NOSYSTEM=1 GIT_CONFIG_COUNT=0 \
                GIT_NO_REPLACE_OBJECTS=1 GIT_GRAFT_FILE=/dev/null \
                /usr/bin/bash --noprofile --norc -eo pipefail "$0" __clean_reexec
            ;;
          esac

      - name: Enforce verdict
        # Runs even if the review step fails: a failed review leaves no
        # verdict file and no summary comment, so the gate fails closed
        # instead of skipping green on a dead runner. Every pipeline ran
        # a shell-capable model step, so the workspace is re-entered
        # through the shared review-restore.sh first (pinned PATH,
        # model-written git configuration neutralized, hooks off, reset
        # to the event-payload merge SHA) —
        # staged from trusted content like the two posts — with
        # --no-clean: the verdict file is untracked and must survive.
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REVIEW_KIND: ${{ inputs.review_kind }}
          VERDICT_FILE: ./.opencode-verdict.txt
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          # The trusted owner/name review-restore.sh rebuilds the minimal
          # replacement .git/config's origin URL from (the same
          # workflow-expression value the two post steps pass) — the
          # config the model shell could have written is never read back.
          REPO: ${{ github.repository }}
          # The trusted reset target the helper requires: the merge SHA
          # from the event payload, the commit this checkout started
          # from — never local HEAD, which the model step could have
          # moved with a commit.
          RESTORE_SHA: ${{ github.sha }}
          # gh's target host and the enforce gate's repo variable are
          # pinned too (the round-22 finding): the model can append to
          # the runner's env command file under RUNNER_TEMP (blanking
          # GITHUB_ENV does not remove that file), and an unpinned
          # GH_HOST sends this step's GH_TOKEN to a host of the model's
          # choosing on every gh api call; an unpinned
          # GITHUB_REPOSITORY points the enforce gate's verdict-comment
          # read at any public repository holding a forged pass
          # verdict. The enterprise token is blanked alongside
          # (github.com auth comes from GH_TOKEN alone).
          GH_HOST: github.com
          GH_ENTERPRISE_TOKEN: ''
          GITHUB_REPOSITORY: ${{ github.repository }}
          # Process-start pinning (see the header note): these fixed
          # literals are the most specific Actions env scope, so they
          # override anything the model shell published into the job —
          # and they hold from process start, where review-restore.sh's
          # in-script PATH pin (kept as defense-in-depth) is already
          # too late for shell/loader startup.
          BASH_ENV: ''
          ENV: ''
          # Bash startup-option and trace-prompt pins: bash applies the
          # options named in SHELLOPTS (and BASHOPTS) from the
          # environment at startup, and xtrace expands PS4 — with
          # command substitution — for every traced command, so a
          # model-published SHELLOPTS=xtrace plus PS4='$(…)' executes
          # in this step's very first shell command, inside the shell
          # that holds GH_TOKEN and before the env -i re-exec runs (the
          # round-26 finding). The empty pins hold from process start;
          # the re-exec's rebuilt environment never carries these names
          # at all.
          SHELLOPTS: ''
          BASHOPTS: ''
          PS4: ''
          LD_PRELOAD: ''
          LD_LIBRARY_PATH: ''
          LD_AUDIT: ''
          PYTHONSTARTUP: ''
          PYTHONPATH: ''
          PYTHONHOME: ''
          NODE_OPTIONS: ''
          NODE_PATH: ''
          PERL5OPT: ''
          PERL5LIB: ''
          PERLLIB: ''
          RUBYOPT: ''
          RUBYLIB: ''
          GEM_HOME: ''
          GEM_PATH: ''
          PATH: /usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
          # Git configuration source pins (see the header note): the
          # model step can write the shared HOME gitconfig and plant
          # env-numbered config pairs through the runner env file —
          # pinning every file source (global, system, env-numbered)
          # makes model-written configuration inert from process
          # start, before the staging git show below runs;
          # review-restore.sh re-exports the same pins
          # (defense-in-depth), replaces the repository's own .git/config
          # with the minimal trusted configuration before its first git
          # invocation, and pins its remaining knobs per git invocation.
          GIT_CONFIG_GLOBAL: /dev/null
          GIT_CONFIG_SYSTEM: /dev/null
          GIT_CONFIG_NOSYSTEM: '1'
          GIT_CONFIG_COUNT: '0'
          # Replace objects are off from process start (the round-8
          # finding): the model step can create refs/replace/<SHA>
          # entries, and git resolves every SHA through them by
          # default — the staging show below would stage
          # attacker-crafted helper bytes and the reset would land on
          # an attacker-crafted tree. The shows and the reset also
          # carry --no-replace-objects per invocation; this env pin
          # covers every other git call the step runs (the prep
          # fetches, merge-base resolutions, facts recomputation).
          GIT_NO_REPLACE_OBJECTS: '1'
          # Grafts are pinned off from process start (the round-11
          # finding): .git/info/grafts is model-writable and a graft
          # parenting the base onto the head silently empties the
          # merge-base the facts recomputation resolves. /dev/null is
          # a fixed non-empty value git accepts as "no grafts".
          GIT_GRAFT_FILE: /dev/null
          # The timeout marker's channel is pinned to the runner's real
          # temp directory (the round-19 finding): a model-published
          # RUNNER_TEMP or TMPDIR would redirect both the wrapper's
          # authoritative marker write and the restore's read to a
          # model-chosen location. These are runner-provided values
          # (never PR-controlled) and the step-env pin beats anything
          # published through the runner env file.
          RUNNER_TEMP: ${{ runner.temp }}
          TMPDIR: ${{ runner.temp }}
        run: |
          # Bash imports exported functions (BASH_FUNC_<name>%%
          # environment variables) at startup — including anything the
          # model step published through the runner's env command file
          # (blanking GITHUB_ENV in the model step does not remove that
          # file) — and an imported function shadows every command this
          # step runs by name: PATH-resolved binaries and regular builtins
          # alike (printf, jq, git), so the PATH pin and every per-name
          # unset below cannot reach it (the round-23 finding). The
          # runner's environment therefore never reaches the shell that
          # holds the token: this script re-execs into a fresh bash under
          # a rebuilt environment (env -i plus the pass-through list
          # below) that carries no BASH_FUNC_ entry, no env-file residue,
          # and the same fixed-value pins the step env spells. Every
          # construct the unclean outer shell evaluates is one an imported
          # function cannot intercept: case/esac are reserved words (bash
          # rejects a function definition named for one), and /usr/bin/env
          # and /usr/bin/bash contain a slash (bash bypasses function and
          # builtin lookup for names with a slash). The clean shell is this
          # same script ($0, the runner's temp file) with __clean_reexec as
          # $1 — an argv position the env-file channel cannot forge; the
          # body below runs only there.
          case "${1:-}" in
            __clean_reexec)
          # Trusted-source the choreography (ADR-0603): the worktree
          # copy is model-writable, so the committed PR-head copy — git
          # show of the head SHA from the event payload, the reviewed
          # PR tree (the prep step fetched the endpoints, so it
          # resolves; a missing object fails this step closed) — is
          # staged into a fresh mktemp file and sourced from there.
          # The staging show carries the full per-invocation pin set —
          # --no-replace-objects (a model-created refs/replace entry
          # cannot steer which object the show reads) plus the config
          # knobs: the step env pins the config file sources, but the
          # repository's own .git/config still parses until the sourced
          # choreography replaces it, and its worktree/filter/transport
          # and fsmonitor/pager knobs are redirection or code execution.
          # Env-channel hardening (round-11): the model step can write
          # the runner env file, so git's location/transport variables
          # and the proxy/CA channels are unset before this step's
          # first git or gh use — unset (not an empty pin: git treats
          # an empty GIT_DIR as a fatal error) and the hosted runners
          # need no proxy. Covers the staging show below and everything
          # the sourced choreography and the poster run in this shell.
          unset GIT_WORK_TREE GIT_DIR GIT_INDEX_FILE GIT_EXEC_PATH \
            GIT_CONFIG_PARAMETERS GIT_OBJECT_DIRECTORY \
            GIT_ALTERNATE_OBJECT_DIRECTORIES \
            GIT_COMMON_DIR GIT_NAMESPACE GIT_SHALLOW_FILE GIT_REPLACE_REF_BASE \
            HTTPS_PROXY HTTP_PROXY ALL_PROXY NO_PROXY \
            https_proxy http_proxy all_proxy no_proxy \
            SSL_CERT_FILE CURL_CA_BUNDLE \
            GIT_SSL_NO_VERIFY GIT_SSL_CAINFO
          # The staging show below reads the worktree's object store,
          # which the model step could have subverted (the round-14
          # finding): a gitdir: redirect file in .git's place serving a
          # fake store, an injected alternates file adding an object
          # source, or loose objects rewritten under a target's name —
          # git does not content-verify loose objects on read. Three
          # checks close the channel before anything is staged and
          # sourced: .git must be a real directory, no alternates file
          # may remain, and fsck verifies every object's content
          # against its name.
          if [ ! -d .git ]; then
            echo "post: .git is not a directory (gitdir: redirect?) — refusing to stage" >&2
            exit 1
          fi
          rm -f .git/objects/info/alternates
          # A model-planted .git/commondir file redirects the object
          # store (and refs/config resolution) to a directory of the
          # model's choosing — sidestepping the alternates deletion and
          # the fsck below, which both operate on .git itself (the
          # round-19 finding). The runner's checkout has no commondir
          # file (.git IS the common dir), so any present one is
          # planted and removed.
          rm -f .git/commondir
          # fsck itself reads the repository config — still the
          # model-written .git/config at this point, where
          # fsck.badObjectSha1=ignore would suppress exactly the
          # content-against-name check this guard exists to run (the
          # round-19 finding). The pins force the check to error level
          # regardless of what the config says, and neutralize
          # fsck.skipList (the round-20 finding — the config could
          # exempt chosen objects from the check): the empty string is
          # NOT a valid unset here (git tries to open an object-name
          # list at the empty path and dies: "could not open object
          # name list"), so the list is pinned to /dev/null — an
          # always-empty list on a root-owned device node the runner
          # user can neither replace nor write.
          git -c fsck.badObjectSha1=error -c fsck.skipList=/dev/null fsck --full --no-progress >/dev/null
          RESTORE="$(mktemp)"
          git --no-replace-objects -c core.fsmonitor= -c core.pager=cat -c core.worktree=. -c protocol.ext.allow=never -c core.attributesFile= -c core.hooksPath=/dev/null show "$HEAD_SHA:.github/scripts/review-restore.sh" > "$RESTORE"
          # shellcheck disable=SC1090
          . "$RESTORE" --no-clean
          .github/scripts/enforce-opencode-verdict.sh
            ;;
            *)
              /usr/bin/env -i \
                PATH=/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin \
                LANG=C.UTF-8 \
                HOME="$HOME" RUNNER_TEMP="$RUNNER_TEMP" TMPDIR="$TMPDIR" \
                GH_TOKEN="$GH_TOKEN" GH_HOST=github.com \
                GH_ENTERPRISE_TOKEN= GITHUB_REPOSITORY="$GITHUB_REPOSITORY" \
              PR_NUMBER="$PR_NUMBER" REVIEW_KIND="$REVIEW_KIND" \
              VERDICT_FILE="$VERDICT_FILE" HEAD_SHA="$HEAD_SHA" REPO="$REPO" \
              RESTORE_SHA="$RESTORE_SHA" \
                GITHUB_ENV=/dev/null \
                BASH_ENV= ENV= LD_PRELOAD= LD_LIBRARY_PATH= LD_AUDIT= \
                PYTHONSTARTUP= PYTHONPATH= PYTHONHOME= \
                NODE_OPTIONS= NODE_PATH= PERL5OPT= PERL5LIB= PERLLIB= \
                RUBYOPT= RUBYLIB= GEM_HOME= GEM_PATH= \
                GIT_CONFIG_GLOBAL=/dev/null GIT_CONFIG_SYSTEM=/dev/null \
                GIT_CONFIG_NOSYSTEM=1 GIT_CONFIG_COUNT=0 \
                GIT_NO_REPLACE_OBJECTS=1 GIT_GRAFT_FILE=/dev/null \
                /usr/bin/bash --noprofile --norc -eo pipefail "$0" __clean_reexec
            ;;
          esac

      # LABS-615/582: every round's raw documents survive the run even
      # when the posting path dies — the findings documents (full and
      # partial; the per-kind lanes write only the full document) and
      # the verdict file. A verdict-only or no-findings failure is then
      # diagnosable from the run page instead of guessing from a red X.
      - name: Preserve review outputs (artifact)
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: review-outputs-${{ inputs.job_name }}
          path: |
            .stellar/findings.json
            .stellar/findings.partial.json
            .opencode-verdict.txt
          if-no-files-found: ignore
          retention-days: 14
