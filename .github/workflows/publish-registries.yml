name: Publish registries

# One publisher for every package registry (ADR-0560, ADR-0278), kept out
# of release.yml so it can also run by hand: a manual dispatch re-publishes
# (or dry-runs) any subset of registries against an existing tag, and
# release.yml chains it after the GitHub release exists for the legs whose
# registries accept the chained OIDC identity — everything except PyPI,
# whose Trusted Publishing does not support reusable workflows and
# publishes inline in release.yml instead (ADR-0710).
#
# Artifacts always come from the GitHub release's assets — never from
# workflow artifacts — so the chained run and a manual re-publish a week
# later share one code path. Registries are append-only: a partial
# publish (say, crate 9 of 17 hits index lag) is recovered by
# re-dispatching with only that registry enabled; already-published
# versions are skipped by the registry itself.
#
# Dry runs: pypi-target=testpypi exercises the OIDC trusted publisher end
# to end; npm-dry-run and crates-io-dry-run validate packaging only (npm
# and crates.io have no staging registry); maven-dry-run runs the publish
# profile's enforcer, packaging and GPG signing against main, stopping
# short of the Central upload.
on:
  workflow_call:
    inputs:
      tag:
        description: "Release tag to publish from, e.g. v0.14.1"
        required: true
        type: string
      npm:
        required: false
        type: boolean
        default: true
      # Off by default on this path: PyPI's Trusted Publishing does not
      # support reusable workflows, so a chained call's OIDC token names
      # the caller (release.yml) and no PyPI registration can accept it.
      # Release cuts publish PyPI inline (ADR-0710); this leg is the
      # direct-dispatch recovery arm.
      pypi:
        required: false
        type: boolean
        default: false
      crates-io:
        required: false
        type: boolean
        default: true
      pypi-target:
        required: false
        type: string
        default: "pypi"
      npm-dry-run:
        required: false
        type: boolean
        default: false
      crates-io-dry-run:
        required: false
        type: boolean
        default: false
      chocolatey:
        required: false
        type: boolean
        default: true
      chocolatey-dry-run:
        required: false
        type: boolean
        default: false
      # Off by default on this path so the OIDC chain call above never
      # deploys the jars a second time: the release publishes Maven from
      # its own call (publish-maven-central), which sets the flag.
      maven:
        required: false
        type: boolean
        default: false
      # Off by default on this path too, for a harder reason: the nuget.org
      # policy names this workflow file, and a chained call's OIDC token
      # names release.yml instead (the mismatch the PyPI leg documents
      # above) — a chained NuGet publish fails the policy check. The NuGet
      # leg is a direct dispatch (docs/PUBLISHING.md).
      nuget:
        required: false
        type: boolean
        default: false
      # Validate the policy match without publishing: the job exchanges the
      # OIDC token for a short-lived key and stops before the push.
      nuget-dry-run:
        required: false
        type: boolean
        default: false
    # The Maven Central credentials are repository secrets (ADR-0630):
    # a called workflow's `secrets` context carries only what its caller
    # forwards — repository secrets included; the v1.2.0 cut's call
    # forwarded nothing and the job imported an empty signing key (run
    # 44705331863). The release's maven call therefore passes all four.
    # Optional: the OIDC-only chain call runs no maven job and passes
    # none. A direct dispatch ignores this block — its jobs read the
    # repository secrets ambiently.
    secrets:
      MAVEN_GPG_KEY:
        description: "base64-encoded GPG secret key that signs the jars"
        required: false
      MAVEN_GPG_PASSPHRASE:
        description: "Passphrase of the signing key"
        required: false
      MAVEN_CENTRAL_USERNAME:
        description: "Central Portal user-token username"
        required: false
      MAVEN_CENTRAL_TOKEN:
        description: "Central Portal user-token password"
        required: false
      # The repository signing key for the APT and RPM channels — the
      # public half is committed as distribution/repo-signing-key.asc, the
      # private half only ever exists as this secret (ADR-0630; see
      # RELEASING.md, "Repository signing key"). The apt/rpm publish lanes
      # read it through their signing step; a direct dispatch reads the
      # repository secret ambiently.
      REPO_GPG_KEY:
        description: "base64-encoded GPG secret key that signs the APT and RPM repository metadata"
        required: false
      # The Chocolatey community repository API key (ADR-0659); the push
      # step warns and skips while it is unset, and fails closed once set.
      CHOCOLATEY_API_KEY:
        description: "API key that pushes the relate package to the Chocolatey community repository"
        required: false
      # The nuget.org profile name of the trusted-publishing policy's owner.
      # A chained call forwards nothing and the NuGet leg does not run on
      # that path (its policy names this workflow, not release.yml), so no
      # caller passes it today; declaring it keeps the direct dispatch's
      # requirement visible.
      NUGET_USER:
        description: "nuget.org profile name that owns the trusted-publishing policy"
        required: false
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to publish from, e.g. v0.14.1"
        required: true
        type: string
      npm:
        description: "Publish the seven @relate/* packages"
        required: false
        type: boolean
        default: true
      pypi:
        description: "Publish the relate-db wheels and sdist"
        required: false
        type: boolean
        default: true
      crates-io:
        description: "Publish the 17-crate facade closure"
        required: false
        type: boolean
        default: true
      maven:
        description: "Publish the Java client jars to Maven Central"
        required: false
        type: boolean
        default: true
      maven-dry-run:
        description: "mvn verify -Pcentral-publish against main: run the publish profile's enforcer, packaging and GPG signing without uploading"
        required: false
        type: boolean
        default: false
      repo-signing-dry-run:
        description: "sign the fixture repository metadata with the REPO_GPG_KEY secret against main, proving the secret matches the committed public key without publishing"
        required: false
        type: boolean
        default: false
      # Off by default because only releases cut after the NuGet leg landed
      # carry a Relate.Net package: a re-publish of an older tag would fail
      # the asset download. Turn it on for a release cut with the leg.
      nuget:
        description: "Publish the .NET client's Relate.Net package to nuget.org"
        required: false
        type: boolean
        default: false
      nuget-dry-run:
        description: "Exchange the OIDC token for a short-lived key (validates the nuget.org trusted-publishing policy) without pushing"
        required: false
        type: boolean
        default: false
      pypi-target:
        description: "PyPI for a real publish, TestPyPI for an auth/packaging dry run"
        required: false
        type: choice
        default: "pypi"
        options:
          - pypi
          - testpypi
      npm-dry-run:
        description: "npm publish --dry-run: validate the tarballs without publishing"
        required: false
        type: boolean
        default: false
      crates-io-dry-run:
        description: "cargo publish --dry-run: validate packaging without publishing"
        required: false
        type: boolean
        default: false
      chocolatey:
        description: "Pack, install-verify and push the Windows Chocolatey package"
        required: false
        type: boolean
        default: true
      chocolatey-dry-run:
        description: "pack and install the package from a local source on Windows, then stop before the choco push"
        required: false
        type: boolean
        default: false

permissions:
  contents: read

env:
  DO_NOT_TRACK: "1"
  GITHUB_TOKEN: ${{ github.token }}

jobs:
  registry-owner:
    name: Canonical registry owner
    runs-on: ubuntu-latest
    outputs:
      sha: ${{ steps.resolve.outputs.sha }}
    steps:
      - name: Reject registry publishes outside the canonical repository
        if: github.repository != 'relatedb/relate'
        run: |
          echo "Official Relate registry publishes are owned by relatedb/relate; refusing ${GITHUB_REPOSITORY}." >&2
          exit 1

      # Validate the tag before any job checks it out as a ref or feeds it
      # to gh: every publish job needs this one, so a bad tag stops the
      # workflow before the ref or the release lookup is touched.
      - name: Validate the tag shape
        env:
          TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "tag '$TAG' is not vX.Y.Z" >&2; exit 1; }

      # Shape is not provenance: a write-access collaborator could push
      # their own vX.Y.Z tag with their own release assets and dispatch
      # from main. release.yml only ever tags release commits (the Swift
      # stamp commit, ADR-0572) on main, so the tag's commit must be an
      # ancestor of origin/main.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Require the tag to be on main
        env:
          TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          git fetch --quiet origin main "refs/tags/$TAG:refs/tags/$TAG"
          git merge-base --is-ancestor "$TAG^{commit}" origin/main \
            || { echo "tag '$TAG' is not on main — refusing to publish from it" >&2; exit 1; }

      # Resolve the tag to its commit exactly once: downstream jobs check
      # out this SHA, so a tag force-push between the gate and a publish
      # job cannot swap the tree an id-token: write job runs.
      - name: Resolve the tag's commit
        id: resolve
        env:
          TAG: ${{ inputs.tag }}
        run: echo "sha=$(git rev-parse "$TAG^{commit}")" >> "$GITHUB_OUTPUT"

  # PyPI (ADR-0560, ADR-0710): trusted publishing, id-token: write, no
  # API token anywhere. Direct dispatch only: the trusted publisher for
  # relate-db on PyPI — and on TestPyPI for dry runs — points at this
  # workflow, and a direct dispatch's OIDC token names it (the v1.3.0
  # and v1.4.0 recoveries proved the arm). A chained call's token names
  # release.yml instead, which PyPI structurally rejects — release cuts
  # publish through release.yml's inline publish-pypi job. Publishes the
  # exact wheels and sdist attached to the release: five wheels plus one
  # sdist.
  pypi:
    name: Publish relate-db to PyPI
    needs: registry-owner
    # Publishing only ever runs from main: the `release` environment's
    # branch rule is repository config, this ref guard is the in-code half
    # (chained release runs and post-merge manual dispatches both run on
    # main; a branch dispatch stops here even before the environment).
    if: github.ref == 'refs/heads/main' && inputs.pypi
    runs-on: ubuntu-latest
    # Publishes run in the `release` environment: its deployment branch
    # rule (main only) stops a write-access collaborator from publishing
    # with the registry's trust from a dispatched branch. No required
    # reviewers — the chained release call must not block.
    environment: release
    permissions:
      id-token: write
      contents: read
      attestations: read
    steps:
      - name: Patch CVE-2026-111943 (eMudhra CA compromise)
        run: |
          sudo apt-get update
          sudo apt-get install --only-upgrade -y ca-certificates
          sudo update-ca-certificates --fresh
          if find /usr/share/ca-certificates /etc/ssl/certs -iname '*emudhra*' -print -quit | grep -q .; then
            echo "::error::eMudhra root still trusted after CA rebuild (CVE-2026-111943)"
            exit 1
          fi
          dpkg-query -W -f='ca-certificates ${Version}' ca-certificates

      - name: Download the release's wheels and sdist
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" \
            --pattern 'relate_db-*.whl' --pattern 'relate_db-*.tar.gz' \
            --dir dist --clobber

      - name: Check artifact count
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          wheels=(dist/*.whl)
          sdists=(dist/*.tar.gz)
          if [ "${#wheels[@]}" -ne 5 ] || [ "${#sdists[@]}" -ne 1 ]; then
            echo "expected 5 wheels and 1 sdist, found ${#wheels[@]} wheel(s) and ${#sdists[@]} sdist(s)" >&2
            exit 1
          fi

      # Count is not provenance: verify every asset against the release
      # run's build attestation, so bytes attached to the release after
      # the fact cannot ride the trusted publisher.
      - name: Verify build provenance
        shell: bash
        run: |
          set -euo pipefail
          for f in dist/*.whl dist/*.tar.gz; do
            gh attestation verify "$f" --repo "$GITHUB_REPOSITORY" \
            --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/release.yml" \
            --source-ref refs/heads/main
          done

      - name: Publish to PyPI
        if: inputs.pypi-target == 'pypi'
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # release/v1
        with:
          packages-dir: dist/

      - name: Publish to TestPyPI (dry run)
        if: inputs.pypi-target == 'testpypi'
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # release/v1
        with:
          packages-dir: dist/
          repository-url: https://test.pypi.org/legacy/

  # npm (ADR-0278): trusted publishing (OIDC), no NODE_AUTH_TOKEN.
  # Live: the manual first publishes and the npmjs.com trusted-publishing
  # setup in docs/PUBLISHING.md are done. Platform packages and the
  # wasm bundle go first; the main package publishes last so its
  # optionalDependencies already exist on the registry.
  npm-platform-wasm:
    name: Publish platform + wasm packages to npm
    needs: registry-owner
    # Main-only like every publish job (see pypi).
    if: github.ref == 'refs/heads/main' && inputs.npm
    runs-on: ubuntu-latest
    # Publishes run in the `release` environment: its deployment branch
    # rule (main only) stops a write-access collaborator from publishing
    # with the registry's trust from a dispatched branch. No required
    # reviewers — the chained release call must not block.
    environment: release
    permissions:
      id-token: write
      contents: read
      attestations: read
    steps:
      - name: Patch CVE-2026-111943 (eMudhra CA compromise)
        run: |
          sudo apt-get update
          sudo apt-get install --only-upgrade -y ca-certificates
          sudo update-ca-certificates --fresh
          if find /usr/share/ca-certificates /etc/ssl/certs -iname '*emudhra*' -print -quit | grep -q .; then
            echo "::error::eMudhra root still trusted after CA rebuild (CVE-2026-111943)"
            exit 1
          fi
          dpkg-query -W -f='ca-certificates ${Version}' ca-certificates

      # Local composite actions resolve from the checkout, so it must
      # provide the action from the same tree the workflow file itself
      # runs on (github.sha: the dispatch ref on manual runs, the
      # caller's ref on chained ones). A tag-pinned checkout would
      # freeze the publish machinery at the release tag — a fix landed
      # after the tag could never run for that tag's dispatches (found
      # by run 43020568298 re-failing on the pre-fix action). The
      # artifacts still come from the tag: the release's assets,
      # attestation-verified below.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}

      - name: Download the release's npm tarballs
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" \
            --pattern '*.tgz' --dir dist --clobber
          # Provenance before publish: every tarball must verify against
          # the release run's build attestation (see the pypi job).
          for f in dist/*.tgz; do
            gh attestation verify "$f" --repo "$GITHUB_REPOSITORY" \
            --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/release.yml" \
            --source-ref refs/heads/main
          done

      # Everything except the main package: the five platform packages
      # plus the wasm bundle.
      - uses: ./.github/actions/npm-publish
        with:
          dir: dist
          # The main package's tarball is relate-relate-<version>.tgz —
          # the one tgz whose middle segment is not a platform or "wasm".
          exclude: '^relate-relate-[0-9]'
          expected-count: 6
          dry-run: ${{ inputs.npm-dry-run }}

  npm-main:
    name: Publish @relate/relate to npm
    needs: [registry-owner, npm-platform-wasm]
    # Main-only like every publish job (see pypi).
    if: github.ref == 'refs/heads/main' && inputs.npm
    runs-on: ubuntu-latest
    # Publishes run in the `release` environment: its deployment branch
    # rule (main only) stops a write-access collaborator from publishing
    # with the registry's trust from a dispatched branch. No required
    # reviewers — the chained release call must not block.
    environment: release
    permissions:
      id-token: write
      contents: read
      attestations: read
    steps:
      - name: Patch CVE-2026-111943 (eMudhra CA compromise)
        run: |
          sudo apt-get update
          sudo apt-get install --only-upgrade -y ca-certificates
          sudo update-ca-certificates --fresh
          if find /usr/share/ca-certificates /etc/ssl/certs -iname '*emudhra*' -print -quit | grep -q .; then
            echo "::error::eMudhra root still trusted after CA rebuild (CVE-2026-111943)"
            exit 1
          fi
          dpkg-query -W -f='ca-certificates ${Version}' ca-certificates

      # Action from the dispatch ref like npm-platform-wasm above; the
      # artifacts still come from the tag's release assets.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}

      - name: Download the release's npm tarballs
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" \
            --pattern '*.tgz' --dir dist --clobber
          # Provenance before publish: every tarball must verify against
          # the release run's build attestation (see the pypi job).
          for f in dist/*.tgz; do
            gh attestation verify "$f" --repo "$GITHUB_REPOSITORY" \
            --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/release.yml" \
            --source-ref refs/heads/main
          done

      - uses: ./.github/actions/npm-publish
        with:
          dir: dist
          include: '^relate-relate-[0-9]'
          expected-count: 1
          dry-run: ${{ inputs.npm-dry-run }}

  # crates.io (ADR-0560): the facade's 17-crate workspace closure, in
  # topological dependency order, with a settle delay between crates
  # because the registry index lags a fresh publish. Trusted publishing
  # (OIDC) once each crate exists; the one-time manual bootstrap (token
  # publishes, then per-crate trusted-publisher setup) is the runbook in
  # docs/PUBLISHING.md. Publishing is not building: the job installs a
  # current stable cargo regardless of the MSRV pin in
  # rust-toolchain.toml. Cargo has no OIDC credential provider of its
  # own (rust-lang/cargo#15743) — the crates-io-auth step below performs
  # the trusted-publishing token exchange.
  crates-io:
    name: Publish the facade closure to crates.io
    needs: registry-owner
    # Main-only like every publish job (see pypi). Publishes the tag's
    # source closure via OIDC trusted publishing: it fails closed at
    # authentication until every crate's trusted publisher is configured
    # on crates.io (the crates.io section of docs/PUBLISHING.md), and
    # the publish loop skips crates whose versions are already on the
    # registry, so an interrupted run can be re-dispatched to finish.
    if: github.ref == 'refs/heads/main' && inputs.crates-io
    runs-on: ubuntu-latest
    # Publishes run in the `release` environment: its deployment branch
    # rule (main only) stops a write-access collaborator from publishing
    # with the registry's trust from a dispatched branch. No required
    # reviewers — the chained release call must not block.
    environment: release
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Patch CVE-2026-111943 (eMudhra CA compromise)
        run: |
          sudo apt-get update
          sudo apt-get install --only-upgrade -y ca-certificates
          sudo update-ca-certificates --fresh
          if find /usr/share/ca-certificates /etc/ssl/certs -iname '*emudhra*' -print -quit | grep -q .; then
            echo "::error::eMudhra root still trusted after CA rebuild (CVE-2026-111943)"
            exit 1
          fi
          dpkg-query -W -f='ca-certificates ${Version}' ca-certificates

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.registry-owner.outputs.sha }}

      - name: Install stable cargo for publishing
        run: rustup toolchain install stable --profile minimal

      # Trusted publishing's token exchange (RFC 3691): cargo cannot do
      # it itself (rust-lang/cargo#15743), so the action — the same one
      # rust-lang/cargo's release workflow uses — swaps the job's OIDC
      # token for a 30-minute registry token. Skipped on dry runs: they
      # validate packaging only and authenticate against nothing.
      - uses: rust-lang/crates-io-auth-action@3268eb413133e2960fa4ae0e963ca76380c54cd9 # v1.0.6
        id: crates-io-auth
        if: ${{ !inputs.crates-io-dry-run }}

      - name: Publish in topological order
        shell: bash
        env:
          DRY_RUN: ${{ inputs.crates-io-dry-run }}
          # Empty when the auth step was skipped; exported below only
          # when set, so a dry run behaves exactly as before.
          CRATES_IO_TOKEN: ${{ steps.crates-io-auth.outputs.token }}
        run: |
          set -euo pipefail
          if [ -n "$CRATES_IO_TOKEN" ]; then
            export CARGO_REGISTRY_TOKEN="$CRATES_IO_TOKEN"
          elif [ "$DRY_RUN" != "true" ]; then
            echo "::error::crates-io-auth produced no token and this is not a dry run" >&2
            exit 1
          fi
          crates=(
            relate-model relate-names relate-splitter relate-core
            relate-parser relate-catalog relate-error relate-ir
            relate-markdown relate-ontology relate-front relate-planner
            relate-engine-api relate-executor relate-storage
            relate-write-local relate
          )
          args=()
          if [ "$DRY_RUN" = "true" ]; then
            args+=(--dry-run)
          fi
          for c in "${crates[@]}"; do
            # A re-dispatch after an interrupted run must be able to
            # finish the loop: a crate whose version already landed in
            # the earlier attempt is done, not a failure — skip it
            # instead of burning the retries and exiting.
            for attempt in 1 2 3; do
              if out=$(rustup run stable cargo publish -p "$c" "${args[@]}" 2>&1); then
                printf '%s\n' "$out"
                break
              fi
              if printf '%s\n' "$out" | grep -qiE 'already (uploaded|exists)'; then
                echo "$c: version already on the registry — skipping"
                break
              fi
              if [ "$attempt" = 3 ]; then
                printf '%s\n' "$out" >&2
                echo "cargo publish -p $c failed after 3 attempts" >&2
                exit 1
              fi
              printf '%s\n' "$out" | tail -5 >&2
              echo "cargo publish -p $c failed (attempt $attempt); waiting for the index"
              sleep 30
            done
            sleep 30
          done

  # NuGet (ADR-0652). Trusted publishing: the job's OIDC token is exchanged
  # for a short-lived API key — no stored credential exists. The nuget.org
  # policy (owner `relate`, repository relatedb/relate, workflow
  # publish-registries.yml, environment `release`, glob Relate.Net) is
  # registered per docs/PUBLISHING.md; the environment field is what makes
  # a token minted outside `release` unusable. Direct dispatch only: a
  # chained call's OIDC token names release.yml, which the policy does not
  # name, so the exchange fails closed.
  nuget:
    name: Publish Relate.Net to NuGet
    needs: registry-owner
    # Main-only like every publish job (see pypi).
    if: github.ref == 'refs/heads/main' && inputs.nuget
    runs-on: ubuntu-latest
    # Publishes run in the `release` environment: its deployment branch
    # rule (main only) stops a write-access collaborator from publishing
    # with the registry's trust from a dispatched branch. No required
    # reviewers. The policy's environment field is the registry-side half
    # of the same binding.
    environment: release
    permissions:
      id-token: write
      contents: read
      attestations: read
    steps:
      - name: Patch CVE-2026-111943 (eMudhra CA compromise)
        run: |
          sudo apt-get update
          sudo apt-get install --only-upgrade -y ca-certificates
          sudo update-ca-certificates --fresh
          if find /usr/share/ca-certificates /etc/ssl/certs -iname '*emudhra*' -print -quit | grep -q .; then
            echo "::error::eMudhra root still trusted after CA rebuild (CVE-2026-111943)"
            exit 1
          fi
          dpkg-query -W -f='ca-certificates ${Version}' ca-certificates

      # dotnet nuget push is the whole toolchain here; the package is built
      # and checked by the release's dotnet-nupkg job.
      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          dotnet-version: '8.0.x'

      - name: Download the release's NuGet package
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" \
            --pattern 'Relate.Net.*.nupkg' --pattern 'Relate.Net.*.snupkg' \
            --dir dist --clobber

      - name: Check the package set
        shell: bash
        env:
          TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          packages=(dist/*.nupkg)
          symbols=(dist/*.snupkg)
          if [ "${#packages[@]}" -ne 1 ] || [ "${#symbols[@]}" -ne 1 ]; then
            echo "expected one .nupkg and one .snupkg, found ${#packages[@]} and ${#symbols[@]}" >&2
            exit 1
          fi
          # The published version must be the release: a package named for a
          # stale csproj version would publish a version no one asked for.
          expected="Relate.Net.${TAG#v}.nupkg"
          if [ "${packages[0]}" != "dist/$expected" ]; then
            echo "expected dist/$expected, found ${packages[0]}" >&2
            exit 1
          fi

      # Count is not provenance: verify both files against the release run's
      # build attestation, so bytes attached to the release after the fact
      # cannot ride the trusted publisher.
      - name: Verify build provenance
        shell: bash
        run: |
          set -euo pipefail
          for f in dist/*.nupkg dist/*.snupkg; do
            gh attestation verify "$f" --repo "$GITHUB_REPOSITORY" \
              --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/release.yml" \
              --source-ref refs/heads/main
          done

      # The exchange itself: nuget.org validates this run's OIDC token
      # against the trusted-publishing policy and returns a one-hour key.
      # It is the step that fails when the policy, the workflow file, or the
      # environment do not match, so nuget-dry-run stops right after it.
      - name: NuGet login (OIDC → short-lived API key)
        id: login
        uses: NuGet/login@8d196754b4036150537f80ac539e15c2f1028841 # v1
        with:
          user: ${{ secrets.NUGET_USER }}

      - name: Publish to NuGet
        if: ${{ !inputs.nuget-dry-run }}
        shell: bash
        env:
          NUGET_API_KEY: ${{ steps.login.outputs.NUGET_API_KEY }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          packages=(dist/*.nupkg)
          symbols=(dist/*.snupkg)
          # The symbols package rides the same key; nuget.org links it to the
          # package the push just published.
          dotnet nuget push "${packages[0]}" --api-key "$NUGET_API_KEY" \
            --source https://api.nuget.org/v3/index.json
          dotnet nuget push "${symbols[0]}" --api-key "$NUGET_API_KEY" \
            --source https://api.nuget.org/v3/index.json

      - name: Dry run
        if: ${{ inputs.nuget-dry-run }}
        run: 'echo "nuget-dry-run: the OIDC exchange succeeded; nothing was pushed"'

  # Maven Central. On for direct dispatches (maven=true, the dispatch
  # input's default) and for the release's `registries` call (which sets
  # the flag), off on release.yml's OIDC chain call — so a release with
  # `registries` on deploys the jars exactly once. Unlike the OIDC
  # registries, Central never checks the run's identity: the static
  # token does, so no registry-side registration precedes the chain. The
  # four credentials are repository secrets (ADR-0630) — ambient on a
  # dispatch, forwarded by the release's call on the chained path: a
  # called workflow sees only caller-passed secrets, repository ones
  # included — the v1.2.0 lesson (run 44705331863). This job's own
  # `environment: release` binding stays for its main-only branch
  # policy. The pom's `central-publish`
  # profile does the real work (sources, javadoc, GPG, upload) and
  # publishes the deployment once Central validates it (autoPublish=true,
  # ADR-0630) — a failed validation fails this job; see
  # clients/java/README.md, "Publishing to Maven Central".
  #
  # maven-dry-run rehearses the profile without uploading: the checkout
  # is main rather than the tag, so the run validates the config the next
  # release will carry — the profile is otherwise never exercised, and a
  # broken one is discovered at release time (a `requireProperty` rule
  # enforcer 3.7.0 no longer accepts reached the v1.1.0 publish this way).
  maven-central:
    name: Publish the Java client to Maven Central
    needs: registry-owner
    if: github.ref == 'refs/heads/main' && inputs.maven
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: read
      attestations: read
    steps:
      - name: Patch CVE-2026-111943 (eMudhra CA compromise)
        run: |
          sudo apt-get update
          sudo apt-get install --only-upgrade -y ca-certificates
          sudo update-ca-certificates --fresh
          if find /usr/share/ca-certificates /etc/ssl/certs -iname '*emudhra*' -print -quit | grep -q .; then
            echo "::error::eMudhra root still trusted after CA rebuild (CVE-2026-111943)"
            exit 1
          fi
          dpkg-query -W -f='ca-certificates ${Version}' ca-certificates

      # The tag's tree: mvn builds and deploys from the same source the
      # release shipped. In release.yml this job consumed the ffi job's
      # workflow artifacts; a separate workflow run cannot see those, so
      # the natives come from the release's own assets — the same five
      # FFI archives the release attached. A dry run takes main instead:
      # it validates the config the next release will carry, and nothing
      # is signed into a registry, so the tag's tree is not the subject.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.maven-dry-run && 'main' || needs.registry-owner.outputs.sha }}

      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: "17"

      - name: Download the release's FFI archives
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          mkdir -p ffi
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" \
            --pattern 'relate-ffi-*.tar.gz' --dir ffi --clobber
          # Provenance before publish: every archive must verify against
          # the release run's build attestation (see the pypi job) —
          # bytes swapped onto the release after the fact cannot ride
          # this job into Maven Central.
          for f in ffi/relate-ffi-*.tar.gz; do
            gh attestation verify "$f" --repo "$GITHUB_REPOSITORY" \
            --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/release.yml" \
            --source-ref refs/heads/main
          done

      - name: Stage natives, import the signing key, run the publish profile
        env:
          MAVEN_GPG_KEY: ${{ secrets.MAVEN_GPG_KEY }}
          MAVEN_GPG_PASSPHRASE: ${{ secrets.MAVEN_GPG_PASSPHRASE }}
          MAVEN_CENTRAL_USERNAME: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          MAVEN_CENTRAL_TOKEN: ${{ secrets.MAVEN_CENTRAL_TOKEN }}
        run: |
          set -euo pipefail
          mkdir -p natives
          for triple in \
            "relate-ffi-aarch64-apple-darwin.tar.gz:darwin-arm64:librelate_ffi.dylib" \
            "relate-ffi-x86_64-apple-darwin.tar.gz:darwin-x64:librelate_ffi.dylib" \
            "relate-ffi-aarch64-unknown-linux-gnu.tar.gz:linux-arm64:librelate_ffi.so" \
            "relate-ffi-x86_64-unknown-linux-gnu.tar.gz:linux-x64:librelate_ffi.so" \
            "relate-ffi-x86_64-pc-windows-msvc.tar.gz:win32-x64:relate_ffi.dll"; do
            IFS=: read -r asset key lib <<< "$triple"
            mkdir -p "ffi/$key" "natives/$key"
            tar xzf "ffi/$asset" -C "ffi/$key"
            cp "ffi/$key/$lib" "natives/$key/$lib"
            test -s "natives/$key/$lib"
          done
          # The Central Portal credentials ride a settings.xml server entry
          # (the pom's publishingServerId is `central`); Maven reads the
          # environment through ${env.NAME}, not a bare ${NAME}. The GPG key is
          # imported into the runner's keyring for maven-gpg-plugin.
          mkdir -p ~/.m2
          cat > ~/.m2/settings.xml <<SETTINGS
          <settings>
            <servers>
              <server>
                <id>central</id>
                <username>\${env.MAVEN_CENTRAL_USERNAME}</username>
                <password>\${env.MAVEN_CENTRAL_TOKEN}</password>
              </server>
            </servers>
          </settings>
          SETTINGS
          # Fail loud before the GPG import when the credentials never
          # arrived: on a chained call the release must forward the four
          # repository secrets (publish-maven-central in release.yml,
          # ADR-0630); on a dispatch they are repository secrets read
          # ambiently. The v1.2.0 chained run died at the cryptic
          # `gpg: no valid OpenPGP data found` instead (run 44705331863).
          if [ -z "${MAVEN_GPG_KEY}" ] || [ -z "${MAVEN_CENTRAL_TOKEN}" ] \
            || [ -z "${MAVEN_CENTRAL_USERNAME}" ] \
            || [ -z "${MAVEN_GPG_PASSPHRASE}" ]; then
            echo "::error::the Maven Central credentials are empty — store the four MAVEN_* repository secrets (docs/PUBLISHING.md, Maven Central; ADR-0630)" >&2
            exit 1
          fi
          echo "$MAVEN_GPG_KEY" | base64 --decode | gpg --batch --import
          # The Central upload binds to `deploy`; `verify` stops after the
          # GPG signature, so a dry run exercises the profile end to end
          # without reaching the registry.
          if [ "${{ inputs.maven-dry-run }}" = "true" ]; then
            mvn -B -f clients/java/pom.xml verify -Pcentral-publish \
              -Drelate.natives.dir="$PWD/natives"
          else
            mvn -B -f clients/java/pom.xml deploy -Pcentral-publish \
              -Drelate.natives.dir="$PWD/natives"
          fi

  # A rehearsal for the APT/RPM signing lanes before they exist as
  # publish jobs: nothing is signed into a registry, so the tag's tree is
  # not the subject — the dry run takes main, like the maven dry run, and
  # proves the one thing that cannot be proven anywhere else: the
  # REPO_GPG_KEY secret holds the private half of the committed public
  # key (the v1.2.0 maven cut imported an empty key instead and died at
  # the cryptic `gpg: no valid OpenPGP data found`, ADR-0630).
  repo-signing-dry-run:
    name: Prove the REPO_GPG_KEY secret against the committed public key
    needs: registry-owner
    # Main-only like every secret-using publish job: the dry run still reads
    # REPO_GPG_KEY, so it declares the same ref gate and environment binding.
    if: github.ref == 'refs/heads/main' && inputs.repo-signing-dry-run
    runs-on: ubuntu-latest
    environment: release
    steps:
      - name: Patch CVE-2026-111943 (eMudhra CA compromise)
        run: |
          sudo apt-get update
          sudo apt-get install --only-upgrade -y ca-certificates
          sudo update-ca-certificates --fresh
          if find /usr/share/ca-certificates /etc/ssl/certs -iname '*emudhra*' -print -quit | grep -q .; then
            echo "::error::eMudhra root still trusted after CA rebuild (CVE-2026-111943)"
            exit 1
          fi
          dpkg-query -W -f='ca-certificates ${Version}' ca-certificates

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main

      # The signing step the APT and RPM lanes will run: the secret key,
      # the committed fingerprint and the committed public key must agree
      # before any metadata is signed. The fixture Release is the same
      # bytes the scripts/tests suite signs and verifies offline.
      - name: Sign the fixture repository metadata with the repository signing key
        env:
          REPO_GPG_KEY: ${{ secrets.REPO_GPG_KEY }}
        run: |
          set -euo pipefail
          scripts/sign-repo-metadata.sh \
            scripts/tests/fixtures/repo-signing/Release \
            "$RUNNER_TEMP/Release.gpg"

  # Chocolatey (ADR-0659): the Windows CLI as a Chocolatey package. The
  # package is one template (distribution/chocolatey) with no baked
  # checksum — its install script verifies the release's SSHSIG-signed
  # SHA256SUMS and gates the download on that entry, and refuses a binary
  # not signed by the pinned Authenticode certificate — so the same nuspec
  # serves every version. The job packs it from the dispatched tree (the
  # machinery, not the frozen tag: see the npm job's checkout note), installs
  # the packed package from a local source on Windows and asserts the
  # installed binary reports the release version; only then does the push
  # run. The push reads CHOCOLATEY_API_KEY, and a dry run stops before it.
  chocolatey:
    name: Pack, install and push the Chocolatey package
    needs: registry-owner
    # Main-only like every publish job (see pypi). A dry run is a publish
    # job too: it packs and installs the same package, and only the push
    # is skipped.
    if: github.ref == 'refs/heads/main' && inputs.chocolatey
    runs-on: windows-latest
    environment: release
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}

      # The package version is the release tag without its `v` — the only
      # input the template needs; the install script derives the release
      # URL from it, so a mismatch would fetch the wrong release. The
      # Authenticode signer thumbprint the install refuses anything else
      # against is the same variable the release's windows-sign action pins
      # (ADR-0594): the pack step writes it into the package's tools so a
      # package packed without it never installs.
      - name: Pack the package at the release version
        shell: pwsh
        env:
          TAG: ${{ inputs.tag }}
          WINDOWS_SIGN_CERT_FINGERPRINT: ${{ vars.WINDOWS_SIGN_CERT_FINGERPRINT }}
        run: |
          $ErrorActionPreference = 'Stop'
          if ($env:TAG -match '^v(\d+\.\d+\.\d+)$') { $version = $Matches[1] }
          else { throw "tag '$env:TAG' is not vX.Y.Z" }
          if (-not $env:WINDOWS_SIGN_CERT_FINGERPRINT) {
            throw 'WINDOWS_SIGN_CERT_FINGERPRINT is not set; the Chocolatey package pins the Authenticode signer thumbprint (ADR-0594)'
          }
          $nupkg = "dist/relate.$version.nupkg"
          # GITHUB_ENV writes apply to later steps, so they carry what the
          # install and push steps need.
          "VERSION=$version" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "NUPKG=$nupkg" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          Set-Content -LiteralPath distribution/chocolatey/tools/signer-thumbprint.txt -Value $env:WINDOWS_SIGN_CERT_FINGERPRINT -NoNewline -Encoding ascii
          choco pack distribution/chocolatey/relate.nuspec --version $version --output-directory dist
          if ($LASTEXITCODE -ne 0) { throw 'choco pack failed' }
          if (-not (Test-Path -LiteralPath $nupkg)) { throw "$nupkg was not packed" }

      # The install the acceptance names: the nupkg from a local source
      # (never a public feed), so the package's own install path runs — the
      # manifest fetch, the sha256 gate, the provenance marker and the
      # shim — and the resulting `relate --version` must report the release
      # version.
      - name: Install the packed package from a local source
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          choco install relate --source (Join-Path $PWD 'dist') --version $env:VERSION -y --no-progress
          if ($LASTEXITCODE -ne 0) { throw 'choco install failed' }
          $shim = Join-Path $env:ChocolateyInstall 'bin\relate.exe'
          $resolved = (Get-Command relate -CommandType Application | Select-Object -First 1).Path
          if ($resolved -ne $shim) { throw "relate resolves to '$resolved', not the Chocolatey shim $shim" }
          $printed = relate --version | Out-String
          if ($LASTEXITCODE -ne 0 -or -not $printed.Contains("v$env:VERSION")) { throw "--version: $printed" }
          # Install provenance (ADR-0659): the marker sits beside the real
          # binary, not the shim, so `relate upgrade` defers to choco.
          $markerPath = Join-Path $env:ChocolateyInstall 'lib\relate\tools\.relate-package-managed'
          if (-not (Test-Path -LiteralPath $markerPath)) { throw "no provenance marker at $markerPath" }
          $marker = Get-Content -LiteralPath $markerPath -Raw | ConvertFrom-Json
          if ($marker.manager -ne 'chocolatey' -or -not $marker.upgrade) { throw "provenance marker: $marker" }

      - name: Dry run — stop before the push
        if: inputs.chocolatey-dry-run
        shell: pwsh
        run: |
          Write-Host "dry run: packed and installed $env:NUPKG; stopping before choco push"

      # Skip-open, then fail closed (the windows-sign precedent): while the
      # API key secret is unset the push warns and stands down, and a push
      # that does run must succeed.
      - name: Push to the Chocolatey community repository
        if: ${{ !inputs.chocolatey-dry-run }}
        shell: pwsh
        env:
          CHOCOLATEY_API_KEY: ${{ secrets.CHOCOLATEY_API_KEY }}
        run: |
          $ErrorActionPreference = 'Stop'
          if (-not $env:CHOCOLATEY_API_KEY) {
            Write-Host '::warning::CHOCOLATEY_API_KEY is not set - skipping the Chocolatey push (ADR-0659).'
            exit 0
          }
          choco push $env:NUPKG --source https://push.chocolatey.org/ --api-key $env:CHOCOLATEY_API_KEY
          if ($LASTEXITCODE -ne 0) { throw 'choco push failed' }
