name: Release

# Manual dispatch only: tags are created mid-run, AFTER green builds, so a
# failed build never publishes a tag or a release.
on:
  workflow_dispatch:
    inputs:
      bump:
        description: "Version bump to apply"
        required: true
        default: "patch"
        type: choice
        options:
          - patch
          - minor
          - major
      offline:
        description: "GitHub-only release: build, tag, and publish the GitHub release with every asset and the generated notes — skip the relate-web poke, the Slack announcement, the self-update canary, and the registry publish"
        required: false
        default: false
        type: boolean
      registries:
        description: "Chain the registry publish (npm/PyPI/crates.io via publish-registries.yml) after the GitHub release — off by default: the chained run's OIDC identity is release.yml's, which the registries' trusted publishers do not accept, so publishes run by direct dispatch of publish-registries.yml against the tag (docs/PUBLISHING.md)"
        required: false
        default: false
        type: boolean

permissions:
  contents: read

# Two dispatches must not race the version bump / tag creation.
concurrency:
  group: release
  cancel-in-progress: false

# CI is not a user session: the CLI's anonymous usage metrics
# (ADR-0079) are opted out on every relate spawn a lane of this
# workflow can reach. Workflow-level — the ADR-0255 single-source
# placement, so every lane inherits the identical value — and
# DO_NOT_TRACK is not a CARGO* var, so the Swatinem/rust-cache
# environment hash is untouched.
env:
  DO_NOT_TRACK: "1"
  # wasm-bindgen and binaryen install scripts. The job token has to be
  # in the environment or those downloads stay anonymous.
  GITHUB_TOKEN: ${{ github.token }}

jobs:
  release-owner:
    name: Canonical release owner
    runs-on: ubuntu-latest
    steps:
      - name: Patch CVE-2026-111943 (eMudhra CA compromise)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --only-upgrade -y ca-certificates
          sudo update-ca-certificates --fresh
          # Post-condition (remediation assurance): the compromised root
          # must be absent from the rebuilt store -- an on-path attacker
          # replaying validly-signed metadata could otherwise make the
          # upgrade a silent no-op behind a green check. A fixed runner
          # image satisfies this too, so it never false-fails the lane.
          if find /usr/share/ca-certificates /etc/ssl/certs -iname '*emudhra*' -print -quit | grep -q .; then
            echo "::error::eMudhra root still trusted after CA rebuild (CVE-2026-111943)"
            exit 1
          fi
          dpkg-query -W -f='ca-certificates ${Version}' ca-certificates
      - name: Reject releases outside the canonical repository
        if: github.repository != 'relatedb/relate'
        run: |
          echo "Official Relate tags and releases are owned by relatedb/relate; refusing ${GITHUB_REPOSITORY}." >&2
          exit 1

      - uses: actions/checkout@v4

  version:
    name: Bump version
    needs: release-owner
    # macOS (ADR-0433 §6): this job also builds the Swift XCFramework and
    # stamps its checksum into Package.swift, so the one release commit the
    # `tag` job tags pins exactly the zip attached to the release.
    # scripts/release-bump.sh is BSD-sed safe.
    runs-on: macos-latest
    permissions:
      contents: write
    outputs:
      tag: ${{ steps.version.outputs.tag }}
      version: ${{ steps.version.outputs.version }}
      sha: ${{ steps.commit.outputs.sha }}
    steps:
      - name: Patch CVE-2026-111943 (eMudhra CA compromise)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --only-upgrade -y ca-certificates
          sudo update-ca-certificates --fresh
          # Post-condition (remediation assurance): the compromised root
          # must be absent from the rebuilt store -- an on-path attacker
          # replaying validly-signed metadata could otherwise make the
          # upgrade a silent no-op behind a green check. A fixed runner
          # image satisfies this too, so it never false-fails the lane.
          if find /usr/share/ca-certificates /etc/ssl/certs -iname '*emudhra*' -print -quit | grep -q .; then
            echo "::error::eMudhra root still trusted after CA rebuild (CVE-2026-111943)"
            exit 1
          fi
          dpkg-query -W -f='ca-certificates ${Version}' ca-certificates
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # release-next-version.sh needs full tag history

      - name: Compute next version
        id: version
        run: |
          tag="$(scripts/release-next-version.sh "${{ inputs.bump }}")"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "version=${tag#v}" >> "$GITHUB_OUTPUT"

      # Self-contained step: the script self-checks consistency and restores
      # the files on failure, so a failed bump means no commit ever happens.
      - name: Bump version surfaces
        env:
          NEXT_VERSION: ${{ steps.version.outputs.version }}
        run: scripts/release-bump.sh

      # Keep @rev in sync with rust-toolchain.toml (channel = "1.88.0").
      - uses: dtolnay/rust-toolchain@1.88.0
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin,aarch64-apple-ios,aarch64-apple-ios-sim,x86_64-apple-ios

      # Build, stamp, commit, push — under a fetch + rebase + rebuild retry:
      # a merge landing on main during the XCFramework build rejects the push
      # as non-fast-forward (observed on the v0.1.1 run). The retry rebases
      # and REBUILDS: ADR-0433 §6's contract is that the tagged commit's
      # Package.swift checksum pins a zip built from that exact tree, so a
      # rebase that changes the tree must re-stamp a fresh zip, not reuse a
      # pre-rebase one. A rebase conflict fails loudly (nothing to merge
      # automatically; the release stays untagged).
      - name: Build, stamp, commit and push the version bump
        id: commit
        run: |
          set -euo pipefail
          git config user.name "release-bot"
          git config user.email "actions@github.com"
          committed=0
          for attempt in 1 2 3; do
            bash scripts/build-xcframework.sh --zip
            bash scripts/stamp-swift-package.sh "${{ steps.version.outputs.tag }}" \
              target/apple/RelateFFI.xcframework.zip
            # scripts/release-bump.sh is the single source of truth for
            # which files a bump touches; stage whatever it modified so a
            # new version surface can never be left out of the commit.
            git add -u
            # The bump script is idempotent: a re-dispatch after a
            # fail-before-tag can produce an empty diff; skip the commit but
            # still emit HEAD. After a rejected push the rebase already
            # carries the bump commit, so a re-stamp's diff (the rebuilt
            # zip's checksum) folds into it with --amend — never stacked as
            # a second "chore(release): <tag>" commit (observed on the
            # v0.1.1 run: the tag's chain carried two of them).
            if git diff --cached --quiet; then
              echo "No version changes to commit; reusing HEAD."
            elif [ "$committed" = 1 ]; then
              git commit --amend --no-edit
            else
              git commit -m "chore(release): ${{ steps.version.outputs.tag }}"
              committed=1
            fi
            if git push origin HEAD:main; then
              break
            fi
            if [ "$attempt" = 3 ]; then
              echo "::error::push to main rejected after 3 attempts"
              exit 1
            fi
            echo "push to main rejected (attempt $attempt) — rebasing onto origin/main and rebuilding"
            git fetch origin main
            git rebase origin/main
          done
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      # After the push: the artifact is the FINAL zip (a retried rebase
      # rebuilt it), byte-identical to what the tagged Package.swift pins.
      - uses: actions/upload-artifact@v4
        with:
          name: swift-xcframework
          path: target/apple/RelateFFI.xcframework.zip

  cli:
    name: CLI (${{ matrix.target }})
    needs: [release-owner, version]
    runs-on: ${{ matrix.runner }}
    strategy:
      matrix:
        include:
          - { target: x86_64-unknown-linux-gnu,  runner: ubuntu-latest,  artifact: relate-linux-amd64 }
          - { target: aarch64-unknown-linux-gnu,  runner: ubuntu-latest,  artifact: relate-linux-arm64 }
          - { target: x86_64-apple-darwin,        runner: macos-15-intel, artifact: relate-darwin-amd64 }
          - { target: aarch64-apple-darwin,       runner: macos-latest,   artifact: relate-darwin-arm64 }
          - { target: x86_64-pc-windows-msvc,     runner: windows-latest, artifact: relate-windows-amd64 }
    steps:
      - name: Patch CVE-2026-111943 (eMudhra CA compromise)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --only-upgrade -y ca-certificates
          sudo update-ca-certificates --fresh
          # Post-condition (remediation assurance): the compromised root
          # must be absent from the rebuilt store -- an on-path attacker
          # replaying validly-signed metadata could otherwise make the
          # upgrade a silent no-op behind a green check. A fixed runner
          # image satisfies this too, so it never false-fails the lane.
          if find /usr/share/ca-certificates /etc/ssl/certs -iname '*emudhra*' -print -quit | grep -q .; then
            echo "::error::eMudhra root still trusted after CA rebuild (CVE-2026-111943)"
            exit 1
          fi
          dpkg-query -W -f='ca-certificates ${Version}' ca-certificates
      # Build from the versioned commit so artifacts carry the release version.
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.version.outputs.sha }}

      # Keep @rev in sync with rust-toolchain.toml (channel = "1.88.0"):
      # the action installs the toolchain named by @rev, including any
      # components/targets; @stable would put them on a toolchain nothing
      # uses because cargo resolves rust-toolchain.toml instead.
      - uses: dtolnay/rust-toolchain@1.88.0
        with:
          targets: ${{ matrix.target }}

      - name: Install cross-compilation tools (Linux ARM64)
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu

      - name: Build
        env:
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER: aarch64-linux-gnu-gcc
        run: cargo build -p relate-cli --release --target ${{ matrix.target }}

      - name: Rename binary
        shell: bash
        run: |
          EXT=""
          if [ "${{ matrix.runner }}" = "windows-latest" ]; then EXT=".exe"; fi
          cp "target/${{ matrix.target }}/release/relate${EXT}" "${{ matrix.artifact }}${EXT}"

      # Sign and notarize the darwin binaries with the shared composite action
      # (ADR-0123) so Gatekeeper accepts the downloaded CLI. Runs after the
      # rename and before upload so only signed bytes leave the runner; this
      # step is skipped on the linux and windows legs.
      - name: Sign and notarize (macOS)
        if: runner.os == 'macOS'
        uses: ./.github/actions/macos-notarize
        with:
          binary: ${{ matrix.artifact }}
        env:
          MACOS_SIGN_P12: ${{ secrets.MACOS_SIGN_P12 }}
          MACOS_SIGN_PASSWORD: ${{ secrets.MACOS_SIGN_PASSWORD }}
          MACOS_NOTARY_KEY_ID: ${{ secrets.MACOS_NOTARY_KEY_ID }}
          MACOS_NOTARY_ISSUER_ID: ${{ secrets.MACOS_NOTARY_ISSUER_ID }}
          MACOS_NOTARY_KEY: ${{ secrets.MACOS_NOTARY_KEY }}

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.artifact }}*

  ffi:
    name: FFI (${{ matrix.target }})
    needs: [release-owner, version]
    runs-on: ${{ matrix.runner }}
    strategy:
      matrix:
        include:
          - { target: x86_64-unknown-linux-gnu,  runner: ubuntu-latest }
          - { target: aarch64-unknown-linux-gnu,  runner: ubuntu-latest }
          - { target: x86_64-apple-darwin,        runner: macos-15-intel }
          - { target: aarch64-apple-darwin,       runner: macos-latest }
          - { target: x86_64-pc-windows-msvc,     runner: windows-latest }
    steps:
      - name: Patch CVE-2026-111943 (eMudhra CA compromise)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --only-upgrade -y ca-certificates
          sudo update-ca-certificates --fresh
          # Post-condition (remediation assurance): the compromised root
          # must be absent from the rebuilt store -- an on-path attacker
          # replaying validly-signed metadata could otherwise make the
          # upgrade a silent no-op behind a green check. A fixed runner
          # image satisfies this too, so it never false-fails the lane.
          if find /usr/share/ca-certificates /etc/ssl/certs -iname '*emudhra*' -print -quit | grep -q .; then
            echo "::error::eMudhra root still trusted after CA rebuild (CVE-2026-111943)"
            exit 1
          fi
          dpkg-query -W -f='ca-certificates ${Version}' ca-certificates
      # Build from the versioned commit so artifacts carry the release version.
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.version.outputs.sha }}

      # Keep @rev in sync with rust-toolchain.toml (channel = "1.88.0"):
      # the action installs the toolchain named by @rev, including any
      # components/targets; @stable would put them on a toolchain nothing
      # uses because cargo resolves rust-toolchain.toml instead.
      - uses: dtolnay/rust-toolchain@1.88.0
        with:
          targets: ${{ matrix.target }}

      - name: Install cross-compilation tools (Linux ARM64)
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu

      - name: Build FFI
        env:
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER: aarch64-linux-gnu-gcc
        run: cargo build -p relate-ffi --release --target ${{ matrix.target }}

      - name: Package FFI artifacts
        shell: bash
        run: |
          mkdir -p ffi-package/include
          cp surfaces/relate-ffi/include/relate.h ffi-package/include/
          # Copy staticlib and cdylib
          find target/${{ matrix.target }}/release -maxdepth 1 \
            \( -name "librelate_ffi.*" -o -name "relate_ffi.*" \) \
            ! -name "*.d" ! -name "*.rlib" \
            -exec cp {} ffi-package/ \;
          # Linux legs: trim the ELF artifacts at packaging. The cdylib loses
          # its symbol table (`strip --strip-unneeded`) — the one piece
          # `strip = "debuginfo"` (the macOS-safe level) keeps. The staticlib
          # loses each member's embedded thin-LTO bitcode (.llvmbc, ~104 MB
          # across the archive) — dead weight, since no external consumer
          # LTO-links the .a; plain ld/cc never reads it and the symbol
          # tables stay. Cross binutils for the arm64 ELF (installed with
          # the cross gcc above); never a Mach-O/PE image (the
          # llvm-objcopy __LINKEDIT misalignment).
          if [[ "${{ matrix.target }}" == *unknown-linux-gnu ]]; then
            PREFIX=""
            if [[ "${{ matrix.target }}" == aarch64-unknown-linux-gnu ]]; then
              PREFIX=aarch64-linux-gnu-
            fi
            if [[ -f ffi-package/librelate_ffi.so ]]; then
              "${PREFIX}strip" --strip-unneeded ffi-package/librelate_ffi.so
            fi
            if [[ -f ffi-package/librelate_ffi.a ]]; then
              mkdir -p ffi-package/a-members
              ( cd ffi-package/a-members \
                && ar x ../librelate_ffi.a \
                && for m in *; do
                  "${PREFIX}objcopy" --remove-section .llvmbc \
                    --remove-section .llvm_addrsig "$m"
                 done \
                && rm ../librelate_ffi.a \
                && "${PREFIX}ar" rcs ../librelate_ffi.a * )
              rm -rf ffi-package/a-members
            fi
          fi
          tar czf relate-ffi-${{ matrix.target }}.tar.gz -C ffi-package .

      - uses: actions/upload-artifact@v4
        with:
          name: relate-ffi-${{ matrix.target }}
          path: relate-ffi-${{ matrix.target }}.tar.gz

  # maturin builds the `relate-db` wheel and sdist from
  # surfaces/relate-python/pyproject.toml ([project].name; the import
  # module is `relate`).
  python:
    name: PyPI wheels (relate-db, ${{ matrix.target }})
    needs: [release-owner, version]
    runs-on: ${{ matrix.runner }}
    strategy:
      matrix:
        include:
          - { runner: ubuntu-latest,  target: x86_64, extra: "--sdist" }
          - { runner: ubuntu-latest,  target: aarch64, extra: "" }
          - { runner: macos-15-intel, target: x86_64, extra: "" }
          - { runner: macos-latest,   target: aarch64, extra: "" }
          - { runner: windows-latest, target: x64, extra: "" }
    steps:
      - name: Patch CVE-2026-111943 (eMudhra CA compromise)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --only-upgrade -y ca-certificates
          sudo update-ca-certificates --fresh
          # Post-condition (remediation assurance): the compromised root
          # must be absent from the rebuilt store -- an on-path attacker
          # replaying validly-signed metadata could otherwise make the
          # upgrade a silent no-op behind a green check. A fixed runner
          # image satisfies this too, so it never false-fails the lane.
          if find /usr/share/ca-certificates /etc/ssl/certs -iname '*emudhra*' -print -quit | grep -q .; then
            echo "::error::eMudhra root still trusted after CA rebuild (CVE-2026-111943)"
            exit 1
          fi
          dpkg-query -W -f='ca-certificates ${Version}' ca-certificates
      # Build from the versioned commit so artifacts carry the release version.
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.version.outputs.sha }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build wheels
        uses: PyO3/maturin-action@v1
        with:
          working-directory: surfaces/relate-python
          target: ${{ matrix.target }}
          args: --release --out dist ${{ matrix.extra }}
          manylinux: auto

      - uses: actions/upload-artifact@v4
        with:
          name: python-wheels-${{ matrix.runner }}-${{ matrix.target }}
          path: |
            surfaces/relate-python/dist/*.whl
            surfaces/relate-python/dist/*.tar.gz

  # Assemble the five @relate/relate-<platform>-<arch> packages
  # (ADR-0278) from the ffi job's artifacts: each package is its checked-in
  # package.json plus the target's dynamic library in lib/. Packing needs no
  # target toolchain, so every leg runs on ubuntu-latest.
  java:
    name: Java client jars (fat + the five platform classifiers, ADR-0490)
    needs: [release-owner, version, ffi]
    runs-on: ubuntu-latest
    steps:
      - name: Patch CVE-2026-111943 (eMudhra CA compromise)
        run: |
          sudo apt-get update
          sudo apt-get install --only-upgrade -y ca-certificates
          sudo update-ca-certificates --fresh
          if find /usr/share/ca-certificates /etc/ssl/certs -iname '*emudhra*' -print -quit | grep -q .; then
            echo "::error::eMudhra root still trusted after CA rebuild (CVE-2026-111943)"
            exit 1
          fi
      # Package from the versioned commit so the jars carry the release
      # version stamped by scripts/release-bump.sh (the pom is a sweep
      # surface).
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.version.outputs.sha }}

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - uses: actions/download-artifact@v4
        with:
          name: relate-ffi-aarch64-apple-darwin
          path: ffi/darwin-arm64
      - uses: actions/download-artifact@v4
        with:
          name: relate-ffi-x86_64-apple-darwin
          path: ffi/darwin-x64
      - uses: actions/download-artifact@v4
        with:
          name: relate-ffi-aarch64-unknown-linux-gnu
          path: ffi/linux-arm64
      - uses: actions/download-artifact@v4
        with:
          name: relate-ffi-x86_64-unknown-linux-gnu
          path: ffi/linux-x64
      - uses: actions/download-artifact@v4
        with:
          name: relate-ffi-x86_64-pc-windows-msvc
          path: ffi/win32-x64

      # Stage the five tarballs into ADR-0490's natives layout and package:
      # the fat jar plus one classifier jar per platform, with the client's
      # test suite running against the packaged linux-x64 native (this
      # runner's platform) — a broken client blocks the tag like every
      # other artifact.
      - name: Stage natives and package the jars
        run: |
          set -euo pipefail
          mkdir -p natives
          for pair in \
            "darwin-arm64:librelate_ffi.dylib" \
            "darwin-x64:librelate_ffi.dylib" \
            "linux-arm64:librelate_ffi.so" \
            "linux-x64:librelate_ffi.so" \
            "win32-x64:relate_ffi.dll"; do
            key="${pair%%:*}"; lib="${pair##*:}"
            tar xzf "ffi/$key/relate-ffi-"*.tar.gz -C "ffi/$key"
            mkdir -p "natives/$key"
            cp "ffi/$key/$lib" "natives/$key/$lib"
            test -s "natives/$key/$lib"
          done
          mvn -B -f clients/java/pom.xml package -Drelate.natives.dir="$PWD/natives"
          ls clients/java/target/*.jar

      - uses: actions/upload-artifact@v4
        with:
          name: java-jars
          path: clients/java/target/*.jar

  npm-platform:
    name: npm platform package (${{ matrix.npm_name }})
    needs: [release-owner, version, ffi]
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - { target: x86_64-unknown-linux-gnu, npm_name: linux-x64,    lib: librelate_ffi.so }
          - { target: aarch64-unknown-linux-gnu, npm_name: linux-arm64,  lib: librelate_ffi.so }
          - { target: x86_64-apple-darwin,       npm_name: darwin-x64,   lib: librelate_ffi.dylib }
          - { target: aarch64-apple-darwin,      npm_name: darwin-arm64, lib: librelate_ffi.dylib }
          - { target: x86_64-pc-windows-msvc,    npm_name: win32-x64,    lib: relate_ffi.dll }
    steps:
      - name: Patch CVE-2026-111943 (eMudhra CA compromise)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --only-upgrade -y ca-certificates
          sudo update-ca-certificates --fresh
          # Post-condition (remediation assurance): the compromised root
          # must be absent from the rebuilt store -- an on-path attacker
          # replaying validly-signed metadata could otherwise make the
          # upgrade a silent no-op behind a green check. A fixed runner
          # image satisfies this too, so it never false-fails the lane.
          if find /usr/share/ca-certificates /etc/ssl/certs -iname '*emudhra*' -print -quit | grep -q .; then
            echo "::error::eMudhra root still trusted after CA rebuild (CVE-2026-111943)"
            exit 1
          fi
          dpkg-query -W -f='ca-certificates ${Version}' ca-certificates
      # Pack from the versioned commit so the manifest carries the release
      # version stamped by scripts/release-bump.sh.
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.version.outputs.sha }}

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - uses: actions/download-artifact@v4
        with:
          name: relate-ffi-${{ matrix.target }}
          path: ffi

      - name: Assemble the platform package
        run: |
          set -euo pipefail
          tar xzf ffi/relate-ffi-${{ matrix.target }}.tar.gz -C ffi
          pkg="clients/javascript/platforms/${{ matrix.npm_name }}"
          mkdir -p "$pkg/lib"
          cp "ffi/${{ matrix.lib }}" "$pkg/lib/"
          test -s "$pkg/lib/${{ matrix.lib }}"

      - name: npm pack
        run: |
          mkdir -p dist
          npm pack "./clients/javascript/platforms/${{ matrix.npm_name }}" --pack-destination dist

      - uses: actions/upload-artifact@v4
        with:
          name: npm-platform-${{ matrix.npm_name }}
          path: dist/*.tgz

  # Build and pack @relate/relate-wasm (ADR-0278). build-wasm.sh
  # stamps pkg/package.json from the workspace Cargo.toml, so checking out
  # the versioned commit makes the package version equal the release tag.
  npm-wasm:
    name: npm wasm package
    needs: [release-owner, version]
    runs-on: ubuntu-latest
    steps:
      - name: Patch CVE-2026-111943 (eMudhra CA compromise)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --only-upgrade -y ca-certificates
          sudo update-ca-certificates --fresh
          # Post-condition (remediation assurance): the compromised root
          # must be absent from the rebuilt store -- an on-path attacker
          # replaying validly-signed metadata could otherwise make the
          # upgrade a silent no-op behind a green check. A fixed runner
          # image satisfies this too, so it never false-fails the lane.
          if find /usr/share/ca-certificates /etc/ssl/certs -iname '*emudhra*' -print -quit | grep -q .; then
            echo "::error::eMudhra root still trusted after CA rebuild (CVE-2026-111943)"
            exit 1
          fi
          dpkg-query -W -f='ca-certificates ${Version}' ca-certificates
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.version.outputs.sha }}

      # Keep @rev in sync with rust-toolchain.toml (channel = "1.88.0"):
      # the action installs the toolchain named by @rev, including any
      # components/targets; @stable would put them on a toolchain nothing
      # uses because cargo resolves rust-toolchain.toml instead.
      - uses: dtolnay/rust-toolchain@1.88.0
        with:
          targets: wasm32-unknown-unknown

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install wasm-bindgen-cli (matches Cargo.lock)
        run: bash scripts/install-wasm-bindgen.sh

      # Pinned release, not apt: Ubuntu's binaryen 108 breaks the bundle's
      # externref table (see scripts/install-binaryen.sh).
      - name: Install binaryen (wasm-opt)
        run: bash scripts/install-binaryen.sh "$RUNNER_TEMP/binaryen" >> "$GITHUB_PATH"

      - name: Build the wasm bundle
        run: bash scripts/build-wasm.sh --mode release

      - name: npm pack
        run: |
          mkdir -p dist
          npm pack ./surfaces/relate-wasm/pkg --pack-destination dist

      - uses: actions/upload-artifact@v4
        with:
          name: npm-wasm
          path: dist/*.tgz

  # Pack @relate/relate (pure JS; the five platform packages are its
  # optionalDependencies, so the manifest's pins must already carry the
  # release version — they do, from the versioned commit).
  npm-main:
    name: npm main package
    needs: [release-owner, version]
    runs-on: ubuntu-latest
    steps:
      - name: Patch CVE-2026-111943 (eMudhra CA compromise)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --only-upgrade -y ca-certificates
          sudo update-ca-certificates --fresh
          # Post-condition (remediation assurance): the compromised root
          # must be absent from the rebuilt store -- an on-path attacker
          # replaying validly-signed metadata could otherwise make the
          # upgrade a silent no-op behind a green check. A fixed runner
          # image satisfies this too, so it never false-fails the lane.
          if find /usr/share/ca-certificates /etc/ssl/certs -iname '*emudhra*' -print -quit | grep -q .; then
            echo "::error::eMudhra root still trusted after CA rebuild (CVE-2026-111943)"
            exit 1
          fi
          dpkg-query -W -f='ca-certificates ${Version}' ca-certificates
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.version.outputs.sha }}

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: npm pack
        run: |
          mkdir -p dist
          npm pack ./clients/javascript --pack-destination dist

      - uses: actions/upload-artifact@v4
        with:
          name: npm-main
          path: dist/*.tgz

  tag:
    name: Tag release
    # Tag only after all builds are green so a failed build never leaves a
    # published tag pointing at a release commit. The npm pack jobs are part
    # of the invariant: a broken npm package blocks the tag like every other
    # artifact, so the published npm version always equals the tag.
    needs: [version, cli, ffi, python, java, npm-platform, npm-wasm, npm-main]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Patch CVE-2026-111943 (eMudhra CA compromise)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --only-upgrade -y ca-certificates
          sudo update-ca-certificates --fresh
          # Post-condition (remediation assurance): the compromised root
          # must be absent from the rebuilt store -- an on-path attacker
          # replaying validly-signed metadata could otherwise make the
          # upgrade a silent no-op behind a green check. A fixed runner
          # image satisfies this too, so it never false-fails the lane.
          if find /usr/share/ca-certificates /etc/ssl/certs -iname '*emudhra*' -print -quit | grep -q .; then
            echo "::error::eMudhra root still trusted after CA rebuild (CVE-2026-111943)"
            exit 1
          fi
          dpkg-query -W -f='ca-certificates ${Version}' ca-certificates
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.version.outputs.sha }}

      - name: Create and push annotated tag
        run: |
          git config user.name "release-bot"
          git config user.email "actions@github.com"
          git tag -a "${{ needs.version.outputs.tag }}" \
            -m "Release ${{ needs.version.outputs.tag }}"
          git push origin "${{ needs.version.outputs.tag }}"

  # The server image (Dockerfile) for the tag this run just pushed. Built and
  # smoked in a job with no AWS access, so nothing the build installs or
  # runs can request the OIDC token; publish-image only loads the tarball and
  # pushes it. Offline releases skip both: ECR is outside GitHub.
  build-image:
    name: Build server image
    needs: [version, tag]
    if: ${{ !inputs.offline }}
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: read
    steps:
      - name: Patch CVE-2026-111943 (eMudhra CA compromise)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --only-upgrade -y ca-certificates
          sudo update-ca-certificates --fresh
          # Post-condition (remediation assurance): the compromised root
          # must be absent from the rebuilt store -- an on-path attacker
          # replaying validly-signed metadata could otherwise make the
          # upgrade a silent no-op behind a green check. A fixed runner
          # image satisfies this too, so it never false-fails the lane.
          if find /usr/share/ca-certificates /etc/ssl/certs -iname '*emudhra*' -print -quit | grep -q .; then
            echo "::error::eMudhra root still trusted after CA rebuild (CVE-2026-111943)"
            exit 1
          fi
          dpkg-query -W -f='ca-certificates ${Version}' ca-certificates
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.version.outputs.sha }}

      # docker_smoke.py connects to the running container over Bolt with the
      # official Python driver, so a broken entrypoint, binary or auth setup
      # fails here instead of reaching ECR. 6.x, because the 5.x driver
      # rejects any server agent that doesn't start with Neo4j/.
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install neo4j==6.4.1

      # The build pulls its base images from Docker Hub, which rate-limits
      # anonymous pulls per IP, and hosted runners share IPs (LABS-248).
      - name: Log in to Docker Hub
        if: env.DOCKERHUB_USERNAME != ''
        uses: docker/login-action@v4
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - uses: docker/setup-buildx-action@v4
        id: buildx

      - name: Build the image and smoke it
        env:
          BUILDX_BUILDER: ${{ steps.buildx.outputs.name }}
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          make docker DOCKER_BUILD_FLAGS="--load"
          python3 surfaces/relate-bolt/tests/docker_smoke.py
          docker save "relate-bolt:$VERSION" -o server-image.tar

      # create-release downloads every artifact in the run and attaches
      # relate-* and *.tar.gz files, so the tarball's name must match neither.
      - uses: actions/upload-artifact@v4
        with:
          name: server-image
          path: server-image.tar
          retention-days: 7

  # Version tags are immutable in the repository, so a re-run after the tag
  # landed skips the push and only checks that ECR holds this run's image.
  publish-image:
    name: Publish server image to ECR
    needs: [version, build-image]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      id-token: write
    steps:
      - name: Patch CVE-2026-111943 (eMudhra CA compromise)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --only-upgrade -y ca-certificates
          sudo update-ca-certificates --fresh
          if find /usr/share/ca-certificates /etc/ssl/certs -iname '*emudhra*' -print -quit | grep -q .; then
            echo "::error::eMudhra root still trusted after CA rebuild (CVE-2026-111943)"
            exit 1
          fi
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: server-image

      - name: Load the image
        run: docker load -i server-image.tar

      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ secrets.AWS_ECR_PUSH_ROLE_ARN }}
          aws-region: us-east-1

      - uses: aws-actions/amazon-ecr-login@03f1aad4c6c7ffd436567f42f9384779290529bd # v2.1.7
        id: ecr

      # The image is identified by its config digest: it survives save/load
      # and push unchanged, while the manifest digest and `docker inspect`'s
      # Id differ by image store. `Config` in the saved manifest.json is
      # `blobs/sha256/<hex>` or `<hex>.json` depending on the Docker version.
      - name: Push to ECR
        env:
          REGISTRY: ${{ steps.ecr.outputs.registry }}
          ECR_REPOSITORY: ${{ secrets.AWS_ECR_REPOSITORY }}
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          set -euo pipefail
          want="sha256:$(tar -xOf server-image.tar manifest.json | jq -r '.[0].Config' | sed -E 's|^.*/||; s|\.json$||')"
          ecr_config_digest() {
            aws ecr batch-get-image --repository-name "$ECR_REPOSITORY" \
              --image-ids imageTag="$VERSION" --output json \
              | jq -r '.images[0].imageManifest // empty | fromjson | .config.digest'
          }
          have="$(ecr_config_digest)"
          if [ -z "$have" ]; then
            docker tag "relate-bolt:$VERSION" "$REGISTRY/$ECR_REPOSITORY:$VERSION"
            docker push "$REGISTRY/$ECR_REPOSITORY:$VERSION"
            have="$(ecr_config_digest)"
          fi
          if [ "$have" != "$want" ]; then
            echo "::error::$VERSION in ECR is config $have, not this run's image ($want)"
            exit 1
          fi
          echo "$VERSION in ECR is this run's image (config $want)"

  # ADR-0580: main never carries a released version — the tagged release
  # commit is the one transient carrier, so once the tag exists the same
  # release run advances main past it (an offline release tags too, so it
  # advances too). The advance performs the same version-surface sweep the
  # release bump performs, in the bump script's scoped mode: same surfaces,
  # minus the changelog rotation, which belongs to a release cut alone —
  # rotating on the advance would mint a release section for a version that
  # was never cut. scripts/release-bump.sh stays the single source of truth
  # for which files a bump touches; the advance commits to main through the
  # same release-bot machinery. Guarded and idempotent: when main's
  # workspace version already exceeds this run's tag version (a re-dispatch
  # of this workflow, a re-run of this job) the advance skips instead of
  # running twice. Nothing here moves or rewrites a tag: the advance commit
  # lands on main after the tagged commit, which keeps pointing at the
  # released tree.
  advance:
    name: Advance main past the release
    needs: [version, tag]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Patch CVE-2026-111943 (eMudhra CA compromise)
        run: |
          sudo apt-get update
          sudo apt-get install --only-upgrade -y ca-certificates
          sudo update-ca-certificates --fresh
          if find /usr/share/ca-certificates /etc/ssl/certs -iname '*emudhra*' -print -quit | grep -q .; then
            echo "::error::eMudhra root still trusted after CA rebuild (CVE-2026-111943)"
            exit 1
          fi
      # main, not the tagged sha: the advance commits on top of main's tip
      # and the guard below reads main's workspace version. Full depth:
      # scripts/release-next-version.sh computes from the git tag list, and
      # by needs-ordering the tag job has already pushed this run's tag.
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0
        with:
          ref: main
          fetch-depth: 0
      # Keep @rev in sync with rust-toolchain.toml (channel = "1.88.0"):
      # scripts/release-bump.sh runs `cargo metadata` to refresh Cargo.lock
      # after the sweep rewrites the workspace version pins.
      - uses: dtolnay/rust-toolchain@360a4e93673de6630fac2478bc9e35244b01a759 # 1.88.0

      - name: Advance main to the next unreleased version
        env:
          RELEASE_TAG: ${{ needs.version.outputs.tag }}
          RELEASE_VERSION: ${{ needs.version.outputs.version }}
        run: |
          set -euo pipefail
          git config user.name "release-bot"
          git config user.email "actions@github.com"

          # The idempotence guard (ADR-0580): main's workspace version
          # already past this run's tag means this tag's advance has
          # already landed — skip instead of advancing twice. The version
          # comes through the shared TOML reader, the same accessor
          # release-bump.sh's consistency self-check reads it through.
          # shellcheck source=scripts/lib/toml.sh
          source scripts/lib/toml.sh
          workspace="$(toml_section_version Cargo.toml "[workspace.package]")"
          latest="$(printf '%s\n' "$RELEASE_VERSION" "$workspace" | sort -V | tail -n1)"
          if [ "$workspace" != "$RELEASE_VERSION" ] && [ "$latest" = "$workspace" ]; then
            echo "::notice::main's workspace is already at $workspace, past $RELEASE_TAG — nothing to advance."
            exit 0
          fi

          # The next unreleased version from the just-created tag, through
          # scripts/release-next-version.sh's own semantics: the latest v*
          # tag plus a patch bump, refusing a version that already exists.
          # After the tag job's push the latest tag is this release's.
          next_tag="$(scripts/release-next-version.sh patch)"
          next_version="${next_tag#v}"

          # The advance is the same version-surface sweep the release bump
          # performs, in the bump script's scoped mode (--skip-changelog):
          # same version surfaces, no changelog rotation — the changelog
          # rotates only at a release cut (ADR-0580). release-bump.sh stays
          # the single source of truth for which files a bump touches.
          NEXT_VERSION="$next_version" scripts/release-bump.sh --skip-changelog

          # The same release-bot commit machinery as the version job's bump
          # commit: stage whatever the sweep modified so a new version
          # surface can never be left out of the commit, then push to main
          # under a fetch + rebase retry — a merge landing on main
          # mid-advance rejects the push as non-fast-forward, and the
          # rebase carries the advance commit onto the new tip. A rebase
          # conflict fails loudly. Nothing here moves or rewrites the tag:
          # only HEAD:main is pushed, so the tag keeps pointing at the
          # released tree.
          git add -u
          git commit -m "chore(release): advance main past $RELEASE_TAG to $next_tag"
          for attempt in 1 2 3; do
            if git push origin HEAD:main; then
              break
            fi
            if [ "$attempt" = 3 ]; then
              echo "::error::push to main rejected after 3 attempts"
              exit 1
            fi
            echo "push to main rejected (attempt $attempt) — rebasing onto origin/main and retrying"
            git fetch origin main
            git rebase origin/main
          done
          echo "main advanced past $RELEASE_TAG to $next_version"

  create-release:
    name: Create Release
    needs: [version, tag]
    runs-on: macos-latest
    permissions:
      contents: write
      # Attest the registry-bound assets (wheels, sdist, npm tarballs) so
      # publish-registries.yml can verify them against this run.
      id-token: write
      attestations: write
    steps:
      # Check out the tag the `tag` job just pushed so the release is cut from
      # exactly the tagged commit.
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.version.outputs.tag }}

      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Flatten artifacts
        run: |
          mkdir -p release
          find artifacts -type f \( -name "relate-*" -o -name "*.whl" -o -name "*.tar.gz" \
            -o -name "*.jar" -o -name "RelateFFI.xcframework.zip" \) \
            -exec cp {} release/ \;

      # Bind the registry-bound assets to this run: publish-registries.yml
      # verifies the attestation before uploading anything, so bytes swapped
      # onto the release after the fact cannot ride the trusted publishers.
      # The FFI archives are registry-bound too: the maven-central job
      # stages its natives from them.
      - name: Attest registry-bound assets
        uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2
        with:
          subject-path: |
            release/relate_db-*.whl
            release/relate_db-*.tar.gz
            release/relate-*.tgz
            release/relate-ffi-*.tar.gz

      # Publish SHA256 checksums for the downloadable CLI binaries so users can
      # verify downloads against the SHA256SUMS asset referenced from the README.
      # The first line names the release (ADR-0457): it sits inside the bytes
      # the signature covers, so `upgrade` and install.sh can bind the version
      # they requested to the artifact they verify. Write it before the
      # manifest is signed, with the exact published tag.
      - name: Generate SHA256SUMS for CLI binaries
        working-directory: release
        shell: bash
        env:
          RELEASE_TAG: ${{ needs.version.outputs.tag }}
        run: |
          shopt -s nullglob
          binaries=(relate-linux-* relate-darwin-* relate-windows-*)
          if [ ${#binaries[@]} -eq 0 ]; then
            echo "No CLI binaries found to checksum" >&2
            exit 1
          fi
          if [[ ! "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "release tag '$RELEASE_TAG' is not vX.Y.Z" >&2
            exit 1
          fi
          printf '# relate-release-version: %s\n' "$RELEASE_TAG" > SHA256SUMS
          shasum -a 256 "${binaries[@]}" >> SHA256SUMS
          cat SHA256SUMS

      # SSHSIG signature (namespace relate-release) over SHA256SUMS, so one
      # signature covers every CLI artifact. The matching public key is pinned
      # in the CLI (upgrade_cmd.rs) and install.sh.
      - name: Sign SHA256SUMS
        working-directory: release
        shell: bash
        env:
          PRIVATE_KEY: ${{ secrets.RELEASE_SIGNING_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          if [ -z "${PRIVATE_KEY:-}" ]; then
            echo "RELEASE_SIGNING_PRIVATE_KEY is not set" >&2
            exit 1
          fi
          umask 077
          keyfile="$(mktemp "${RUNNER_TEMP:-/tmp}/relate-signing-key.XXXXXX")"
          trap 'rm -f "$keyfile"' EXIT
          printf '%s\n' "$PRIVATE_KEY" > "$keyfile"
          chmod 600 "$keyfile"
          ssh-keygen -Y sign -f "$keyfile" -n relate-release SHA256SUMS
          test -s SHA256SUMS.sig

      # tag_name is explicit: on workflow_dispatch there is no tag context for
      # action-gh-release to infer, so we pass the tag created by the tag job.
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.version.outputs.tag }}
          files: release/*
          generate_release_notes: true

  # Smoke-gate the actual packed release tarballs before anything publishes:
  # install them into fresh projects and run a query through each surface.
  # Runs on linux x64 so the staged linux-x64 platform package matches the
  # host; the ffi linux-x64 artifact provides the RELATE_LIB fallback.
  npm-smoke-gate:
    name: npm smoke gate
    needs: [version, npm-platform, npm-wasm, npm-main]
    runs-on: ubuntu-latest
    steps:
      - name: Patch CVE-2026-111943 (eMudhra CA compromise)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --only-upgrade -y ca-certificates
          sudo update-ca-certificates --fresh
          # Post-condition (remediation assurance): the compromised root
          # must be absent from the rebuilt store -- an on-path attacker
          # replaying validly-signed metadata could otherwise make the
          # upgrade a silent no-op behind a green check. A fixed runner
          # image satisfies this too, so it never false-fails the lane.
          if find /usr/share/ca-certificates /etc/ssl/certs -iname '*emudhra*' -print -quit | grep -q .; then
            echo "::error::eMudhra root still trusted after CA rebuild (CVE-2026-111943)"
            exit 1
          fi
          dpkg-query -W -f='ca-certificates ${Version}' ca-certificates
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.version.outputs.sha }}

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - uses: actions/download-artifact@v4
        with:
          name: npm-main
          path: smoke/main

      - uses: actions/download-artifact@v4
        with:
          name: npm-wasm
          path: smoke/wasm

      - uses: actions/download-artifact@v4
        with:
          name: npm-platform-linux-x64
          path: smoke/platform

      - uses: actions/download-artifact@v4
        with:
          name: relate-ffi-x86_64-unknown-linux-gnu
          path: smoke/ffi

      - name: Run the npm smoke tests against the release tarballs
        env:
          RELATE_LIB: ${{ github.workspace }}/smoke/ffi/librelate_ffi.so
          NPM_SMOKE_MAIN_TGZ: ${{ github.workspace }}/smoke/main/relate-relate-${{ needs.version.outputs.version }}.tgz
          NPM_SMOKE_WASM_TGZ: ${{ github.workspace }}/smoke/wasm/relate-relate-wasm-${{ needs.version.outputs.version }}.tgz
          NPM_SMOKE_PLATFORM_TGZ: ${{ github.workspace }}/smoke/platform/relate-relate-linux-x64-${{ needs.version.outputs.version }}.tgz
        run: |
          set -euo pipefail
          tar xzf smoke/ffi/relate-ffi-x86_64-unknown-linux-gnu.tar.gz -C smoke/ffi
          test -s "$RELATE_LIB"
          test -f "$NPM_SMOKE_MAIN_TGZ"
          test -f "$NPM_SMOKE_WASM_TGZ"
          test -f "$NPM_SMOKE_PLATFORM_TGZ"
          bash scripts/npm-smoke-test.sh

  # Registry publishing (npm, PyPI, crates.io) lives in its own workflow
  # (ADR-0560, ADR-0278): dispatchable by hand with a tag plus per-registry
  # toggles for dry runs and partial-failure recovery, and callable here
  # once the GitHub release and its assets exist. The call defaults OFF:
  # the chained run's OIDC token names release.yml, and the registries'
  # trusted publishers register publish-registries.yml — the v1.0.0 PyPI
  # leg failed on exactly this mismatch (run 43065962701). Publish by
  # direct dispatch against the tag; opt in with registries=true only
  # after registering release.yml on every registry (docs/PUBLISHING.md).
  # An offline release also skips the call; the website, Slack, and
  # canary jobs are unaffected by this input.
  publish-registries:
    name: Publish to registries
    needs: [version, create-release, npm-smoke-gate]
    if: ${{ !inputs.offline && inputs.registries }}
    # The caller's permissions cap the called workflow's: without
    # id-token: write here, the called jobs' trusted-publishing token
    # request cannot be honored on the chained path — and any scope a
    # nested job requests but the caller does not grant (attestations:
    # read, added to the nested verify jobs by #180) invalidates the
    # whole workflow file at dispatch (startup failure, run 43064659136).
    # No secrets: inherit — the called workflow runs on OIDC alone and
    # needs none.
    permissions:
      id-token: write
      contents: read
      attestations: read
    uses: ./.github/workflows/publish-registries.yml
    with:
      tag: ${{ needs.version.outputs.tag }}

  # Chained explicitly because the `release: published` event fired by
  # action-gh-release (GITHUB_TOKEN) never triggers downstream workflows
  # (ADR-0265) — release-notes.yml must be called as a reusable workflow.
  release-notes:
    name: Generate release notes
    needs: [version, create-release]
    permissions:
      contents: write
    uses: ./.github/workflows/release-notes.yml
    with:
      version: ${{ needs.version.outputs.version }}
      publish: true
      # ADR-0465: the generate run posts nothing inline — it uploads
      # slack-payload.json as an artifact and the release run's final
      # slack-announce job posts it after the whole pipeline is green.
      slack: false
    # Reusable workflows receive no secrets unless asked (the v0.9.2 run
    # failed fast on the empty FIREWORKS_API_KEY check).
    secrets: inherit
  # ADR-0129's update-website chain is gone: the website lives in the
  # separate relate-web repository (ADR-0546), which pulls what it needs —
  # this repo never pushes content into it. The only handoff is the
  # repository_dispatch poke in the publish-releases-json job below.

  # ADR-0250's release-discovery document, post-gh-pages: releases.json is
  # generated from the live release list and attached to this release's
  # assets together with install.sh (the documented install entry point);
  # relate-web's publish workflow pulls both from there — the assets are
  # the transport, https://relatedb.ai/... stays the canonical URL the CLI
  # pins. Gated on `release-notes` so the narrative notes are already
  # prepended to the release body when the generator copies it, and on
  # `create-release` so the asset list is complete. The repository_dispatch
  # poke is best-effort while relate-web is stood up: without the
  # RELATE_WEB_DISPATCH_TOKEN secret, or before the repository exists, it
  # logs a skip and the release stays green.
  publish-releases-json:
    name: Publish releases.json + notify relate-web
    needs: [version, create-release, release-notes]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    # Shared with the manual backfill (publish-releases-json.yml): both
    # rewrite the same release asset, a conflict neither resolves.
    concurrency:
      group: publish-releases-json
      cancel-in-progress: false
    steps:
      - name: Patch CVE-2026-111943 (eMudhra CA compromise)
        run: |
          sudo apt-get update
          sudo apt-get install --only-upgrade -y ca-certificates
          sudo update-ca-certificates --fresh
          if find /usr/share/ca-certificates /etc/ssl/certs -iname '*emudhra*' -print -quit | grep -q .; then
            echo "::error::eMudhra root still trusted after CA rebuild (CVE-2026-111943)"
            exit 1
          fi
      # The generator at the versioned commit (the release publishes with
      # the script it shipped with); distribution carries install.sh.
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.version.outputs.sha }}
          sparse-checkout: |
            .github/scripts
            distribution

      - name: Generate releases.json
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: .github/scripts/publish-releases-json.sh "$RUNNER_TEMP/releases.json"

      - name: Attach releases.json and install.sh to the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          gh release upload "${{ needs.version.outputs.tag }}" \
            "$RUNNER_TEMP/releases.json" distribution/install.sh --clobber

      # One poke per release (ADR-0546): relate-web's publish workflow
      # pulls releases.json, install.sh and the release assets it needs;
      # this repo never commits into it. 404 = the repository does not
      # exist yet (or the token cannot see it) — a stated skip, not a
      # failure, until relate-web is stood up. Offline releases never
      # poke: the files are on the release for a later backfill.
      - name: Poke relate-web (repository_dispatch)
        if: ${{ !inputs.offline }}
        env:
          DISPATCH_TOKEN: ${{ secrets.RELATE_WEB_DISPATCH_TOKEN }}
          RELEASE_TAG: ${{ needs.version.outputs.tag }}
        run: |
          set -euo pipefail
          if [ -z "${DISPATCH_TOKEN:-}" ]; then
            echo "::notice::RELATE_WEB_DISPATCH_TOKEN is not set — skipping the relate-web poke; run the Publish releases.json workflow once relate-web is ready."
            exit 0
          fi
          status="$(curl -sS -o "$RUNNER_TEMP/dispatch-body" -w '%{http_code}' \
            -X POST \
            -H "Authorization: Bearer $DISPATCH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            https://api.github.com/repos/relatedb/relate-web/dispatches \
            -d "{\"event_type\":\"relate-release\",\"client_payload\":{\"kind\":\"cli\",\"tag\":\"$RELEASE_TAG\"}}")"
          case "$status" in
            204) echo "relate-web notified: kind=cli tag=$RELEASE_TAG" ;;
            404) echo "::notice::relatedb/relate-web is not reachable (not created yet, or the token cannot see it) — skipping the poke." ;;
            *) echo "::error::repository_dispatch to relatedb/relate-web failed with HTTP $status"; cat "$RUNNER_TEMP/dispatch-body"; exit 1 ;;
          esac

  # Canary the user-facing self-update path (ADR-0358): download the
  # previous stable release's linux-amd64 binary, run `relate upgrade`
  # on that isolated copy, and assert it reports this release's version.
  # Needs create-release because the inner upgrade downloads the new
  # release's assets (the probe-then-fallback route, ADR-0358 §3), so
  # the assets must already exist. It used to be chained after the Pages
  # deploy because the inner upgrade reads the live website releases.json
  # (ADR-0250), which must already list the new version as latest; Pages
  # deploys are paused (2026-11-05), so the smoke now checks that
  # currency itself before downloading anything and skips with a stated
  # reason while the live site lags the release list
  # (self-update-smoke.sh, the live-site currency gate).
  # contents: read covers every read the smoke makes: the release list,
  # the previous release's asset, and the inner upgrade's authenticated API
  # asset route (ADR-0358 §3, required while the repository is internal).
  # A previous release below the v0.12.6 floor (the first release carrying
  # the API-fallback route) cannot self-update while the repository is
  # internal; the script skips that case with a stated reason and exits 0.
  # Offline releases skip the canary entirely: it exists to prove the live
  # website path, which an offline release deliberately does not touch.
  self-update-smoke:
    name: Self-update smoke
    needs: [version, create-release]
    if: ${{ !inputs.offline }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Patch CVE-2026-111943 (eMudhra CA compromise)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --only-upgrade -y ca-certificates
          sudo update-ca-certificates --fresh
          # Post-condition (remediation assurance): the compromised root
          # must be absent from the rebuilt store -- an on-path attacker
          # replaying validly-signed metadata could otherwise make the
          # upgrade a silent no-op behind a green check. A fixed runner
          # image satisfies this too, so it never false-fails the lane.
          if find /usr/share/ca-certificates /etc/ssl/certs -iname '*emudhra*' -print -quit | grep -q .; then
            echo "::error::eMudhra root still trusted after CA rebuild (CVE-2026-111943)"
            exit 1
          fi
          dpkg-query -W -f='ca-certificates ${Version}' ca-certificates
      # The smoke script at the versioned commit (the release verifies the
      # script it shipped with), plus scripts/lib: the script
      # unconditionally sources the shared TOML reader for the
      # EXPECTED_VERSION default.
      - name: Checkout the smoke script (sparse)
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.version.outputs.sha }}
          sparse-checkout: |
            .github/scripts
            scripts/lib
      # ASSET pins the linux-amd64 release asset -- what the ubuntu-latest
      # x86_64 host maps to by default -- so the canary's target is part of
      # the wiring; PREV_TAG stays unset and resolves live to the newest
      # stable CORE tag (vX.Y.Z -- extension-channel releases are never
      # candidates) that is not the expected version.
      - name: Run the self-update smoke
        env:
          GITHUB_TOKEN: ${{ github.token }}
          EXPECTED_VERSION: ${{ needs.version.outputs.version }}
          ASSET: relate-linux-amd64
        run: bash .github/scripts/self-update-smoke.sh

  # ADR-0465: the Slack announcement is the release pipeline's final step.
  # The release-notes run generates the payload early — publish-releases-json
  # and the live site need the prepended notes (ADR-0250) — but
  # posts nothing inline (slack: false): it uploads the payload as the
  # release-notes-slack-payload artifact, and this job posts it only after
  # the whole tail, publish-releases-json and the self-update canary
  # (ADR-0358) included, is green — the payload's message is
  # `relate upgrade`, and the canary is what proves that path. The website
  # lives in relate-web (ADR-0546): the announcement can outrun the live
  # site — releases.json rides the release assets, but `relate upgrade`
  # picks the new version up only after relate-web's publish workflow
  # serves it, and the canary skips (self-update-smoke.sh's currency gate)
  # while the site lags. It re-uses the one Slack-leg policy
  # script (ADR-0125 amendment 2) unchanged: graceful skip when
  # SLACK_WEBHOOK_URL is unset, fail-closed payload validation, and the
  # API-key exfiltration scan. The `release-notes-v<tag>` concurrency group —
  # the same string release-notes.yml serializes its posters on — keeps this
  # POST from overlapping an inline-posting standalone run for the same tag;
  # cancel-in-progress: false because a queued announce must never be
  # cancelled. Offline releases never announce: nothing outside GitHub is
  # touched, so there is nothing to announce yet — a later non-offline
  # release-notes dispatch can post for the same tag.
  slack-announce:
    name: Announce release on Slack
    needs: [version, release-notes, publish-releases-json, self-update-smoke]
    if: ${{ !inputs.offline }}
    runs-on: ubuntu-latest
    # The announce leg is a CA patch, a sparse checkout, one artifact
    # download and one curl — minutes at most. The bound exists for the
    # group below: a hung job must not hold the repo-global
    # release-notes-v<tag> group (cancel-in-progress: false) away from an
    # inline-posting standalone run for the same tag.
    timeout-minutes: 10
    concurrency:
      group: release-notes-v${{ needs.version.outputs.version }}
      cancel-in-progress: false
    steps:
      - name: Patch CVE-2026-111943 (eMudhra CA compromise)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --only-upgrade -y ca-certificates
          sudo update-ca-certificates --fresh
          # Post-condition (remediation assurance): the compromised root
          # must be absent from the rebuilt store -- an on-path attacker
          # replaying validly-signed metadata could otherwise make the
          # upgrade a silent no-op behind a green check. A fixed runner
          # image satisfies this too, so it never false-fails the lane.
          if find /usr/share/ca-certificates /etc/ssl/certs -iname '*emudhra*' -print -quit | grep -q .; then
            echo "::error::eMudhra root still trusted after CA rebuild (CVE-2026-111943)"
            exit 1
          fi
          dpkg-query -W -f='ca-certificates ${Version}' ca-certificates
      # The Slack policy script at the versioned commit — the release
      # announces with the script it shipped with (the self-update-smoke
      # precedent). Sparse checkout: release-notes-slack.sh is self-contained.
      - name: Checkout the Slack policy script (sparse)
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.version.outputs.sha }}
          sparse-checkout: |
            .github/scripts
      # The payload artifact the release-notes run uploaded instead of
      # posting. Restored under target/release-notes so the script is
      # invoked on the exact path release-notes.yml uses.
      - name: Download the generated Slack payload
        uses: actions/download-artifact@v4
        with:
          name: release-notes-slack-payload
          path: target/release-notes
      - name: Post the announcement to Slack
        env:
          # The announce leg is the active leg by definition: PUBLISH stays
          # true so only a missing SLACK_WEBHOOK_URL can skip the post.
          PUBLISH: 'true'
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          FIREWORKS_API_KEY: ${{ secrets.FIREWORKS_API_KEY }}
        run: .github/scripts/release-notes-slack.sh target/release-notes/slack-payload.json
