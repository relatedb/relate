name: Release

# Manual dispatch only: tags are created mid-run, AFTER green builds, so a
# failed build never publishes a tag or a release.
on:
  workflow_dispatch:
    inputs:
      bump:
        description: "Version bump to apply"
        required: true
        default: "patch"
        type: choice
        options:
          - patch
          - minor
          - major
      offline:
        description: "GitHub-only release: build, tag, and publish the GitHub release with every asset and the generated notes — skip the relate-web poke, the Slack announcement, the self-update canary, and the registry publish"
        required: false
        default: false
        type: boolean
      registries:
        description: "Publish to the package registries after the GitHub release — off by default. npm, crates.io and Chocolatey ride the publish-registries.yml call (npm and crates.io are registered for this workflow's chained OIDC identity); PyPI publishes through the inline publish-pypi job below, because PyPI's Trusted Publishing does not support reusable workflows — no registration can make the chained call's token acceptable (ADR-0710, docs/PUBLISHING.md). The Maven Central jars publish with every non-offline release through their own call below (ADR-0704), not through this input"
        required: false
        default: false
        type: boolean
      winget_dry_run:
        description: "Generate and validate the winget manifests, then stop before submitting the version bump to microsoft/winget-pkgs"
        required: false
        default: false
        type: boolean

permissions:
  contents: read

# Two dispatches must not race the version bump / tag creation.
concurrency:
  group: release
  cancel-in-progress: false

# CI is not a user session: the CLI's anonymous usage metrics
# (ADR-0079) are opted out on every relate spawn a lane of this
# workflow can reach. Workflow-level — the ADR-0255 single-source
# placement, so every lane inherits the identical value — and
# DO_NOT_TRACK is not a CARGO* var, so the Swatinem/rust-cache
# environment hash is untouched.
env:
  DO_NOT_TRACK: "1"
  # wasm-bindgen and binaryen install scripts. The job token has to be
  # in the environment or those downloads stay anonymous.
  GITHUB_TOKEN: ${{ github.token }}

jobs:
  release-owner:
    name: Canonical release owner
    runs-on: ubuntu-latest
    steps:
      - name: Patch CVE-2026-111943 (eMudhra CA compromise)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --only-upgrade -y ca-certificates
          sudo update-ca-certificates --fresh
          # Post-condition (remediation assurance): the compromised root
          # must be absent from the rebuilt store -- an on-path attacker
          # replaying validly-signed metadata could otherwise make the
          # upgrade a silent no-op behind a green check. A fixed runner
          # image satisfies this too, so it never false-fails the lane.
          if find /usr/share/ca-certificates /etc/ssl/certs -iname '*emudhra*' -print -quit | grep -q .; then
            echo "::error::eMudhra root still trusted after CA rebuild (CVE-2026-111943)"
            exit 1
          fi
          dpkg-query -W -f='ca-certificates ${Version}' ca-certificates
      - name: Reject releases outside the canonical repository
        if: github.repository != 'relatedb/relate'
        run: |
          echo "Official Relate tags and releases are owned by relatedb/relate; refusing ${GITHUB_REPOSITORY}." >&2
          exit 1

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

  # LABS-1690: the license gate for the shipped dependency closure. Early and
  # parallel with the version bump, report-only for now (violations and
  # THIRDPARTY-NOTICES.md drift warn, never fail), and deliberately not in
  # the `tag` job's needs: it cannot hold a release back until enforcement
  # is switched on (third-party-licenses.yml's `enforce` input, then add it
  # to `needs`). Dry-run it alone: `gh workflow run third-party-licenses.yml`.
  licenses:
    name: Third-party licenses
    needs: release-owner
    permissions:
      contents: read
    uses: ./.github/workflows/third-party-licenses.yml

  version:
    name: Bump version
    needs: release-owner
    # ADR-0572: this job pushes the bump commit and builds nothing — the
    # release cut lands minutes after dispatch instead of after the
    # five-target XCFramework build. The XCFramework builds in the
    # xcframework matrix and the stamp job pushes the second release
    # commit (the tag target). scripts/release-bump.sh runs on GNU sed,
    # its designed CI platform.
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      tag: ${{ steps.version.outputs.tag }}
      version: ${{ steps.version.outputs.version }}
      sha: ${{ steps.commit.outputs.sha }}
    steps:
      - name: Patch CVE-2026-111943 (eMudhra CA compromise)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --only-upgrade -y ca-certificates
          sudo update-ca-certificates --fresh
          # Post-condition (remediation assurance): the compromised root
          # must be absent from the rebuilt store -- an on-path attacker
          # replaying validly-signed metadata could otherwise make the
          # upgrade a silent no-op behind a green check. A fixed runner
          # image satisfies this too, so it never false-fails the lane.
          if find /usr/share/ca-certificates /etc/ssl/certs -iname '*emudhra*' -print -quit | grep -q .; then
            echo "::error::eMudhra root still trusted after CA rebuild (CVE-2026-111943)"
            exit 1
          fi
          dpkg-query -W -f='ca-certificates ${Version}' ca-certificates
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # release-next-version.sh needs full tag history

      - name: Compute next version
        id: version
        run: |
          tag="$(scripts/release-next-version.sh "${{ inputs.bump }}")"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "version=${tag#v}" >> "$GITHUB_OUTPUT"

      # Keep @rev in sync with rust-toolchain.toml (channel = "1.99.1"):
      # release-bump.sh runs `cargo metadata` while refreshing Cargo.lock,
      # and the pinned toolchain keeps that off the runner's preinstalled
      # cargo.
      - uses: dtolnay/rust-toolchain@263313d2989f864a2b8613f97277288638e7d8f8 # 1.99.1

      # Self-contained step: the script self-checks consistency and restores
      # the files on failure, so a failed bump means no commit ever happens.
      - name: Bump version surfaces
        env:
          NEXT_VERSION: ${{ steps.version.outputs.version }}
        run: scripts/release-bump.sh

      # Commit and push — under a fetch + rebase retry. A rebase here is
      # safe because nothing has been built yet (ADR-0572: this push is
      # the release cut; every artifact job builds from a commit that
      # descends from it). A rebase conflict fails loudly (the release
      # stays untagged).
      - name: Commit and push the version bump
        id: commit
        run: |
          set -euo pipefail
          git config user.name "release-bot"
          git config user.email "actions@github.com"
          # scripts/release-bump.sh is the single source of truth for
          # which files a bump touches; stage whatever it modified so a
          # new version surface can never be left out of the commit.
          git add -u
          # The bump script is idempotent: a re-dispatch after a
          # fail-before-tag finds the bump commit already on main
          # (empty diff); skip the commit but still emit HEAD.
          if git diff --cached --quiet; then
            echo "No version changes to commit; reusing HEAD."
          else
            git commit -m "chore(release): ${{ steps.version.outputs.tag }}"
          fi
          for attempt in 1 2 3; do
            if git push origin HEAD:main; then
              break
            fi
            if [ "$attempt" = 3 ]; then
              echo "::error::push to main rejected after 3 attempts"
              exit 1
            fi
            echo "push to main rejected (attempt $attempt) — rebasing onto origin/main"
            git fetch origin main
            git rebase origin/main
          done
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  # ADR-0572: the XCFramework's five per-target static libraries build in
  # parallel, each leg checking out the pushed bump commit — the tree every
  # release artifact descends from — so the libraries are correct by
  # construction; the stamp job's later commit only adds Package.swift,
  # which is not compiled into the libraries.
  xcframework:
    name: XCFramework (${{ matrix.target }})
    needs: [release-owner, version]
    runs-on: macos-latest
    strategy:
      matrix:
        target: [aarch64-apple-darwin, x86_64-apple-darwin, aarch64-apple-ios, aarch64-apple-ios-sim, x86_64-apple-ios]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.version.outputs.sha }}

      # Shared Rust preamble (sccache + rust-cache; the preamble's
      # internal dtolnay@rev is the rust-toolchain.toml sync point, and
      # toolchain-targets carries this leg's target). These
      # compile-dominated lanes run sccache on macOS too — the release
      # poles — where a rust-cache restore alone is mtime-invalidated on
      # a fresh checkout (ADR-0331; docs/testing/build-caches.md,
      # "Release workflow lanes").
      - uses: ./.github/actions/setup-rust-ci
        with:
          sccache: "true"
          free-disk: "false"
          mold: "false"
          toolchain-targets: ${{ matrix.target }}

      # --build-target: the one build entry's per-target mode — the
      # script owns the deployment-target envs and the lib path, so the
      # legs never hand-roll a cargo invocation. The printed path is the
      # layout contract (lib_for's derivation); the upload consumes it
      # instead of re-spelling the path.
      - name: Build the static library
        id: build
        run: |
          lib="$(bash scripts/build-xcframework.sh --build-target ${{ matrix.target }})"
          echo "lib=$lib" >> "$GITHUB_OUTPUT"

      # The lane's cache audit record (OPLANE_REQ-00360636): what the
      # shared compile cache served this build. The guard keeps the step
      # honest on the probe's fallback (no active wrapper, nothing to
      # report).
      - name: sccache stats
        run: |
          if [ "${RUSTC_WRAPPER:-}" = "sccache" ]; then
            sccache --show-stats
          else
            echo "sccache not active this run (see the preamble's probe warning)"
          fi

      # OPLANE_REQ-00360635: the library and its SHA-256 ride one
      # artifact, so the stamp job verifies integrity before assembly —
      # a tampered or corrupted handoff fails loudly, never assembles.
      # The sidecar records the bare filename: the stamp job verifies it
      # from the downloaded artifact's own directory, where that name
      # resolves (an absolute build path would not).
      - name: Checksum the library
        run: |
          lib="${{ steps.build.outputs.lib }}"
          ( cd "$(dirname "$lib")" && shasum -a 256 "$(basename "$lib")" > "$(basename "$lib")".sha256 )
          cat "$lib.sha256"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: xcframework-${{ matrix.target }}
          path: |
            ${{ steps.build.outputs.lib }}
            ${{ steps.build.outputs.lib }}.sha256

  # ADR-0572: the second release commit. Assembles the XCFramework from
  # the xcframework legs' libraries (built from the bump commit's tree by
  # construction), computes the zip's checksum, stamps Package.swift, and
  # pushes the stamp commit on top of the bump commit — under the same
  # fetch + rebase + REBUILD retry the bump used to carry: a rebase that
  # changes the tree rebuilds from the rebased tree, never reusing
  # libraries built from the pre-rebase one (ADR-0433 §6's contract: the
  # tagged commit's Package.swift checksum pins a zip built from that
  # exact tree). A rebase conflict fails loudly (the release stays
  # untagged). Every artifact job and the tag build from this job's
  # output sha, so the tagged tree and the built tree cannot diverge.
  swift-stamp:
    name: Stamp Swift package
    needs: [release-owner, version, xcframework]
    runs-on: macos-latest
    permissions:
      contents: write
    outputs:
      sha: ${{ steps.commit.outputs.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.version.outputs.sha }}

      # The xcframework legs' libraries. Only those five artifacts exist
      # in the run at this point; the staging loop below copies exactly
      # the five it names.
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: staging

      # Shared Rust preamble (sccache + rust-cache, all five Apple
      # targets): the common path only assembles, but the rebase-retry
      # path below rebuilds every target from scratch, and it must find
      # the toolchain and the compile cache ready.
      - uses: ./.github/actions/setup-rust-ci
        with:
          sccache: "true"
          free-disk: "false"
          mold: "false"
          toolchain-targets: aarch64-apple-darwin,x86_64-apple-darwin,aarch64-apple-ios,aarch64-apple-ios-sim,x86_64-apple-ios

      - name: Assemble, stamp, commit and push
        id: commit
        env:
          RELEASE_TAG: ${{ needs.version.outputs.tag }}
        run: |
          set -euo pipefail
          git config user.name "release-bot"
          git config user.email "actions@github.com"
          # Stage the xcframework legs' libraries into lib_for's layout —
          # the profile flows through the same env the build entry reads.
          # OPLANE_REQ-00360635: each library is verified against the
          # SHA-256 sidecar its leg published before it is staged — loud
          # on mismatch or a missing sidecar, never a silent partial
          # assembly. The non-empty check stays as the final belt.
          profile="${XCFRAMEWORK_CARGO_PROFILE:-release}"
          for t in aarch64-apple-darwin x86_64-apple-darwin aarch64-apple-ios \
                   aarch64-apple-ios-sim x86_64-apple-ios; do
            ( cd "staging/xcframework-$t" && shasum -a 256 -c librelate_ffi.a.sha256 )
            mkdir -p "target/$t/$profile"
            cp "staging/xcframework-$t/librelate_ffi.a" "target/$t/$profile/librelate_ffi.a"
            test -s "target/$t/$profile/librelate_ffi.a"
          done
          committed=0
          for attempt in 1 2 3; do
            if [ "$attempt" = 1 ]; then
              # The staged libraries were built from this exact tree;
              # assemble from them.
              bash scripts/build-xcframework.sh --assemble-only --zip
            else
              # A rebase changed the tree: the staged libraries are
              # stale. Rebuild everything from the rebased tree.
              bash scripts/build-xcframework.sh --zip
            fi
            bash scripts/stamp-swift-package.sh "$RELEASE_TAG" \
              target/apple/RelateFFI.xcframework.zip
            git add -u
            # Re-dispatch after a fail-before-tag may find the stamp
            # commit already on main: a byte-identical re-assembly
            # produces an empty diff, so skip the commit but still emit
            # HEAD. After a rejected push the rebase already carries the
            # stamp commit, so a re-stamp's diff (the rebuilt zip's
            # checksum) folds into it with --amend — never stacked as a
            # second stamp commit within one run.
            if git diff --cached --quiet; then
              echo "No stamp changes to commit; reusing HEAD."
            elif [ "$committed" = 1 ]; then
              git commit --amend --no-edit
            else
              git commit -m "chore(release): $RELEASE_TAG swift package"
              committed=1
            fi
            if git push origin HEAD:main; then
              break
            fi
            if [ "$attempt" = 3 ]; then
              echo "::error::push to main rejected after 3 attempts"
              exit 1
            fi
            echo "push to main rejected (attempt $attempt) — rebasing onto origin/main and rebuilding"
            git fetch origin main
            git rebase origin/main
          done
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      # The lane's cache audit record (OPLANE_REQ-00360636): what the
      # shared compile cache served this job (the rebase-retry path
      # rebuilds; the common path assembles only).
      - name: sccache stats
        run: |
          if [ "${RUSTC_WRAPPER:-}" = "sccache" ]; then
            sccache --show-stats
          else
            echo "sccache not active this run (see the preamble's probe warning)"
          fi

      # After the push: the artifact is the FINAL zip (a retried rebase
      # rebuilt it), byte-identical to what the tagged Package.swift pins.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: swift-xcframework
          path: target/apple/RelateFFI.xcframework.zip

  # The Linux x86-64 CLI is built in the pinned baseline container, not on
  # the ubuntu-latest runner: the runner's link environment puts x86-64-v2
  # and x86-64-v3 in the binary's ELF GNU property note ("x86 ISA needed"),
  # which refuses older CPUs. rust:1.99-bookworm is the pinned build image
  # every baseline lane uses (Dockerfile.baseline, ADR-0495); its glibc
  # 2.36 caps the artifact's symbol floor. The gate steps derive both
  # properties from the built artifact, fail the release when the ISA level
  # or the glibc floor exceeds the documented promise, and hand the derived
  # floor to the channel builders (docs/api/cli/spec.md, "Platform
  # requirements").
  cli-linux-amd64:
    name: CLI (x86_64-unknown-linux-gnu, baseline ISA)
    needs: [release-owner, version, swift-stamp]
    runs-on: ubuntu-latest
    container: rust:1.99-bookworm
    outputs:
      glibc_floor: ${{ steps.glibc_floor.outputs.floor }}
    steps:
      # The eMudhra CA break (2026-10): crates.io TLS fetches ride this
      # image's CA bundle, so the pre-existing jobs' CA step runs before any
      # cargo network access. The image runs as root, so its `sudo` spelling
      # is dropped.
      - name: Patch CVE-2026-111943 (eMudhra CA compromise)
        run: |
          apt-get update
          apt-get install --only-upgrade -y ca-certificates
          update-ca-certificates --fresh
          # Post-condition (remediation assurance): the compromised root
          # must be absent from the rebuilt store -- an on-path attacker
          # replaying validly-signed metadata could otherwise make the
          # upgrade a silent no-op behind a green check. A fixed runner
          # image satisfies this too, so it never false-fails the lane.
          if find /usr/share/ca-certificates /etc/ssl/certs -iname '*emudhra*' -print -quit | grep -q .; then
            echo "::error::eMudhra root still trusted after CA rebuild (CVE-2026-111943)"
            exit 1
          fi
          dpkg-query -W -f='ca-certificates ${Version}' ca-certificates
      # The installer runs from the default checkout — the workflow's own
      # tree — never the stamped ref, so no repo script executes from a
      # ref-overridden checkout.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Embedded dependency manifests, same as the other CLI legs
      # (RELEASING.md, "Embedded dependency manifests").
      - name: Install cargo-auditable (pinned)
        run: bash scripts/install-cargo-auditable.sh "$RUNNER_TEMP/cargo-auditable" >> "$GITHUB_PATH"

      # Build from the stamped release commit (ADR-0572) — the one tree
      # every artifact and the tag share. The x86-64 baseline target-CPU
      # pin is committed in .cargo/config.toml (reviewed beside the
      # ISA gate's --pinned-toolchain vouch that relies on it); this
      # lane sets no RUSTFLAGS env, because an env would replace the
      # config table.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.swift-stamp.outputs.sha }}

      - name: Build (auditable)
        run: cargo auditable build -p relate-cli --release --target x86_64-unknown-linux-gnu

      - name: Rename binary
        run: cp target/x86_64-unknown-linux-gnu/release/relate relate-linux-amd64

      # The lane's vouch: the pinned container's rustc+gcc link emits no
      # "x86 ISA needed" GNU property note at baseline, so the gate runs
      # with --pinned-toolchain — the one caller that may pass a
      # note-less binary. A note listing x86-64-v2/v3/v4 fails the
      # release with or without the vouch.
      - name: Check the x86-64 baseline ISA
        run: bash scripts/check-linux-isa.sh --pinned-toolchain relate-linux-amd64

      - name: Check the glibc floor
        id: glibc_floor
        run: echo "floor=$(bash scripts/check-glibc-floor.sh relate-linux-amd64)" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: relate-linux-amd64
          path: relate-linux-amd64

  # The Debian/Ubuntu channel (ADR-0659): the .deb and the signed APT
  # repository tree that serves it, built from the release's own binaries
  # and attached as one tarball per architecture for relate-web to serve at
  # /apt. The metadata is signed with the repository key (REPO_GPG_KEY,
  # ADR-0630) and the committed public key rides the tree, so a user's apt
  # trusts exactly that anchor.
  apt-repo:
    name: APT repository (${{ matrix.arch }}, signed)
    needs: [release-owner, version, swift-stamp, cli-linux-amd64, cli]
    # Like every secret-using publish job (ADR-0630): REPO_GPG_KEY is
    # environment-scoped, and the `release` environment's branch policy is
    # what gates a run dispatched from a non-main ref to it.
    environment: release
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - { arch: amd64, asset: relate-linux-amd64 }
          - { arch: arm64, asset: relate-linux-arm64 }
    steps:
      - name: Patch CVE-2026-111943 (eMudhra CA compromise)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --only-upgrade -y ca-certificates
          sudo update-ca-certificates --fresh
          # Post-condition (remediation assurance): the compromised root
          # must be absent from the rebuilt store -- an on-path attacker
          # replaying validly-signed metadata could otherwise make the
          # upgrade a silent no-op behind a green check. A fixed runner
          # image satisfies this too, so it never false-fails the lane.
          if find /usr/share/ca-certificates /etc/ssl/certs -iname '*emudhra*' -print -quit | grep -q .; then
            echo "::error::eMudhra root still trusted after CA rebuild (CVE-2026-111943)"
            exit 1
          fi
          dpkg-query -W -f='ca-certificates ${Version}' ca-certificates

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.swift-stamp.outputs.sha }}

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ${{ matrix.asset }}
          path: artifacts

      - name: Build the .deb and the signed repository tree
        env:
          REPO_GPG_KEY: ${{ secrets.REPO_GPG_KEY }}
        run: |
          set -euo pipefail
          chmod +x "artifacts/${{ matrix.asset }}"
          scripts/build-apt-repo.sh "artifacts/${{ matrix.asset }}" "${{ matrix.arch }}" \
            "${{ needs.version.outputs.version }}" \
            "${{ needs.cli-linux-amd64.outputs.glibc_floor }}" "$RUNNER_TEMP/apt-${{ matrix.arch }}"
          tar -C "$RUNNER_TEMP/apt-${{ matrix.arch }}" \
            -czf "relate-apt-repo-${{ matrix.arch }}.tar.gz" .

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: relate-apt-repo-${{ matrix.arch }}
          path: relate-apt-repo-${{ matrix.arch }}.tar.gz

  # The Fedora/RHEL/openSUSE channel (ADR-0659): the rpm and the signed
  # YUM/DNF repository tree dnf reads, built in the channel's own
  # distribution from the release's baseline-ISA x86-64 binary and attached
  # as one tarball for relate-web to serve at /rpm. The builder writes the
  # metadata with createrepo_c and signs repomd.xml through
  # scripts/sign-repo-metadata.sh with the repository key (REPO_GPG_KEY,
  # ADR-0630); the committed public key rides the tree. The container is a
  # pinned Fedora release: `latest` would move the rpm's build inputs under
  # a released tree, so the tag is bumped deliberately, never by drift.
  rpm-repo:
    name: RPM repository (signed)
    needs: [release-owner, version, swift-stamp, cli-linux-amd64]
    # Same binding as apt-repo above, for the same key.
    environment: release
    runs-on: ubuntu-latest
    container: fedora:43
    steps:
      # The standing posture (CVE-2026-111943): the compromised eMudhra root
      # must be gone before the toolchain install below fetches from the
      # Fedora repositories. This is the Fedora spelling of the pre-existing
      # release jobs' apt step.
      - name: Patch CVE-2026-111943 (eMudhra CA compromise)
        run: dnf upgrade -y ca-certificates && update-ca-trust extract

      # rpmbuild, createrepo_c and gpg are the builder's toolchain; the
      # checkout action and the tar packaging need git, python3 and tar.
      - name: Install the RPM toolchain
        run: dnf install -y git python3 rpm-build createrepo_c gnupg2 tar gzip

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.swift-stamp.outputs.sha }}

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: relate-linux-amd64
          path: artifacts

      - name: Build the rpm and the signed repository tree
        env:
          REPO_GPG_KEY: ${{ secrets.REPO_GPG_KEY }}
        run: |
          set -euo pipefail
          chmod +x artifacts/relate-linux-amd64
          python3 scripts/build_rpm_repo.py --binary artifacts/relate-linux-amd64 \
            --version "${{ needs.version.outputs.version }}" \
            --glibc-floor "${{ needs.cli-linux-amd64.outputs.glibc_floor }}" \
            --output "$RUNNER_TEMP/rpm"
          tar -C "$RUNNER_TEMP/rpm" -czf relate-rpm-repo.tar.gz .

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: relate-rpm-repo
          path: relate-rpm-repo.tar.gz

  cli:
    name: CLI (${{ matrix.target }})
    # `version` for the Windows smoke's expected version (swift-stamp
    # already orders this job after it).
    needs: [release-owner, version, swift-stamp]
    runs-on: ${{ matrix.runner }}
    strategy:
      matrix:
        include:
          - { target: aarch64-unknown-linux-gnu,  runner: ubuntu-latest,  artifact: relate-linux-arm64 }
          - { target: x86_64-apple-darwin,        runner: macos-15-intel, artifact: relate-darwin-amd64 }
          - { target: aarch64-apple-darwin,       runner: macos-latest,   artifact: relate-darwin-arm64 }
          - { target: x86_64-pc-windows-msvc,     runner: windows-latest, artifact: relate-windows-amd64 }
    steps:
      - name: Patch CVE-2026-111943 (eMudhra CA compromise)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --only-upgrade -y ca-certificates
          sudo update-ca-certificates --fresh
          # Post-condition (remediation assurance): the compromised root
          # must be absent from the rebuilt store -- an on-path attacker
          # replaying validly-signed metadata could otherwise make the
          # upgrade a silent no-op behind a green check. A fixed runner
          # image satisfies this too, so it never false-fails the lane.
          if find /usr/share/ca-certificates /etc/ssl/certs -iname '*emudhra*' -print -quit | grep -q .; then
            echo "::error::eMudhra root still trusted after CA rebuild (CVE-2026-111943)"
            exit 1
          fi
          dpkg-query -W -f='ca-certificates ${Version}' ca-certificates
      # The installer runs from the default checkout — the workflow's own
      # tree — never the stamped ref, so no repo script executes from a
      # ref-overridden checkout.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Embedded dependency manifests: the non-Windows legs build through
      # cargo-auditable (pinned install, the install-binaryen.sh pattern), so
      # every shipped `relate` binary carries its crate list in the `.dep-v0`
      # linker section — `cargo audit bin <binary>` reads it (RELEASING.md,
      # "Embedded dependency manifests"). The Windows leg is owned by the
      # windows-authenticode-signing lane and builds exactly as before —
      # plain `cargo build`, same command and env; that lane integrates the
      # manifest on Windows.
      - name: Install cargo-auditable (pinned)
        if: runner.os != 'Windows'
        run: bash scripts/install-cargo-auditable.sh "$RUNNER_TEMP/cargo-auditable" >> "$GITHUB_PATH"

      # Build from the stamped release commit (ADR-0572) — the one tree
      # every artifact and the tag share — so artifacts carry the release
      # version.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.swift-stamp.outputs.sha }}

      # Shared Rust preamble (sccache + rust-cache; the preamble's
      # internal dtolnay@rev is the rust-toolchain.toml sync point, and
      # toolchain-targets carries this leg's target). Every leg
      # cold-compiled the full dependency tree per release before this;
      # sccache makes those compiles content-addressed hits on the
      # macOS/Windows legs too — the release poles — where a rust-cache
      # restore alone is mtime-invalidated on a fresh checkout
      # (ADR-0331; docs/testing/build-caches.md, "Release workflow
      # lanes"). free-disk and mold stay at their defaults (Linux-only
      # effects inside the action).
      - uses: ./.github/actions/setup-rust-ci
        with:
          sccache: "true"
          toolchain-targets: ${{ matrix.target }}

      - name: Install cross-compilation tools (Linux ARM64)
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu

      - name: Build (auditable)
        if: runner.os != 'Windows'
        env:
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER: aarch64-linux-gnu-gcc
        run: cargo auditable build -p relate-cli --release --target ${{ matrix.target }}

      - name: Build
        if: runner.os == 'Windows'
        env:
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER: aarch64-linux-gnu-gcc
        run: cargo build -p relate-cli --release --target ${{ matrix.target }}

      - name: Rename binary
        shell: bash
        run: |
          EXT=""
          if [ "${{ matrix.runner }}" = "windows-latest" ]; then EXT=".exe"; fi
          cp "target/${{ matrix.target }}/release/relate${EXT}" "${{ matrix.artifact }}${EXT}"

      # The Windows binary must start on a host without the Visual C++
      # redistributable (ADR-0587): it imports no dynamic C runtime. dumpbin
      # comes from the runner's Visual Studio, found through vswhere. Then
      # the built .exe runs under PowerShell: --version and a one-shot query.
      - name: Static CRT check and smoke (Windows, PowerShell)
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          EXPECTED_VERSION: ${{ needs.version.outputs.version }}
          ARTIFACT: ${{ matrix.artifact }}
        run: |
          $vswhere = Join-Path ${env:ProgramFiles(x86)} 'Microsoft Visual Studio\Installer\vswhere.exe'
          $dumpbin = & $vswhere -latest -products * -find 'VC\Tools\MSVC\*\bin\Hostx64\x64\dumpbin.exe' | Select-Object -First 1
          if (-not $dumpbin) { throw 'dumpbin.exe not found through vswhere' }
          $exe = Join-Path $PWD "$env:ARTIFACT.exe"
          $imports = & $dumpbin /nologo /dependents $exe | Out-String
          Write-Output $imports
          if ($LASTEXITCODE -ne 0) { throw "dumpbin failed on $exe" }
          if ($imports -match '(?i)vcruntime|msvcp|ucrtbase|api-ms-win-crt') {
            throw 'the CLI imports the dynamic C runtime; +crt-static did not apply (ADR-0587)'
          }
          $version = & $exe --version | Out-String
          if ($LASTEXITCODE -ne 0 -or -not $version.Contains("v$env:EXPECTED_VERSION")) { throw "--version: $version" }
          $out = & $exe --format csv 'RETURN 1 AS ok' | Out-String
          if ($LASTEXITCODE -ne 0 -or ($out -replace "`r", '') -cne "ok`n1`n") { throw "one-shot query: $out" }

      # Sign and notarize the darwin binaries with the shared composite action
      # (ADR-0123) so Gatekeeper accepts the downloaded CLI. Runs after the
      # rename and before upload so only signed bytes leave the runner; this
      # step is skipped on the linux and windows legs.
      - name: Sign and notarize (macOS)
        if: runner.os == 'macOS'
        uses: ./.github/actions/macos-notarize
        with:
          binary: ${{ matrix.artifact }}
        env:
          MACOS_SIGN_P12: ${{ secrets.MACOS_SIGN_P12 }}
          MACOS_SIGN_PASSWORD: ${{ secrets.MACOS_SIGN_PASSWORD }}
          MACOS_NOTARY_KEY_ID: ${{ secrets.MACOS_NOTARY_KEY_ID }}
          MACOS_NOTARY_ISSUER_ID: ${{ secrets.MACOS_NOTARY_ISSUER_ID }}
          MACOS_NOTARY_KEY: ${{ secrets.MACOS_NOTARY_KEY }}

      # Authenticode-sign the windows binary with the shared composite action
      # (ADR-0594) so SmartScreen shows a signed publisher. Same invocation
      # point as the macOS leg — after the rename, before upload — but the
      # signing is remote (DigiCert Software Trust Manager): the action
      # installs the smctl client, authenticates a DigiCert ONE API user
      # from the SM_* step env, and signs with a keypair held in DigiCert's
      # key management, so no code-signing certificate material exists on
      # the runner. The API user's client-authentication certificate — the
      # one credential smctl needs as a file — is decoded here, by the
      # caller, because the action itself never writes certificate material
      # to disk (ADR-0594); this is DigiCert's documented CI pattern of a
      # base64 secret decoded to the runner temp dir. The prepare and sign
      # steps below self-skip with a warning while WINDOWS_SIGN_API_KEY is
      # unset — the cleanup runs either way — and once the key is set the
      # leg fails closed. They are skipped on the linux and darwin legs.
      - name: Prepare the DigiCert client certificate (Windows)
        if: runner.os == 'Windows'
        shell: bash
        env:
          WINDOWS_SIGN_CLIENT_CERT_FILE_B64: ${{ secrets.WINDOWS_SIGN_CLIENT_CERT_FILE_B64 }}
        run: |
          set -euo pipefail
          # Nothing to decode while the DigiCert credentials are unset: the
          # signing action skips on an empty SM_API_KEY (ADR-0594).
          if [ -z "${WINDOWS_SIGN_CLIENT_CERT_FILE_B64:-}" ]; then
            echo "WINDOWS_SIGN_CLIENT_CERT_FILE=" >> "$GITHUB_ENV"
            exit 0
          fi
          # Key material must never be world/group-readable, even
          # transiently (same guard as the SSHSIG step in the
          # create-release job).
          umask 077
          mkdir -p "$RUNNER_TEMP/relate-windows-signing"
          cert="$RUNNER_TEMP/relate-windows-signing/client-auth.p12"
          printf '%s' "$WINDOWS_SIGN_CLIENT_CERT_FILE_B64" | base64 --decode > "$cert"
          echo "WINDOWS_SIGN_CLIENT_CERT_FILE=$cert" >> "$GITHUB_ENV"

      - name: Sign with Authenticode (Windows)
        if: runner.os == 'Windows'
        uses: ./.github/actions/windows-sign
        with:
          binary: ${{ matrix.artifact }}.exe
        env:
          SM_HOST: ${{ vars.WINDOWS_SIGN_SM_HOST }}
          SM_API_KEY: ${{ secrets.WINDOWS_SIGN_API_KEY }}
          SM_CLIENT_CERT_FILE: ${{ env.WINDOWS_SIGN_CLIENT_CERT_FILE }}
          SM_CLIENT_CERT_PASSWORD: ${{ secrets.WINDOWS_SIGN_CLIENT_CERT_PASSWORD }}
          WINDOWS_SIGN_KEYPAIR_ALIAS: ${{ vars.WINDOWS_SIGN_KEYPAIR_ALIAS }}
          WINDOWS_SIGN_CERT_FINGERPRINT: ${{ vars.WINDOWS_SIGN_CERT_FINGERPRINT }}

      - name: Clean up the decoded DigiCert client certificate (Windows)
        if: always() && runner.os == 'Windows'
        shell: bash
        run: |
          # The decoded client-authentication certificate lives only for
          # this leg and is removed even when signing failed (ADR-0594);
          # the literal fallback covers a failure before the path was
          # exported to $GITHUB_ENV.
          cert="${WINDOWS_SIGN_CLIENT_CERT_FILE:-$RUNNER_TEMP/relate-windows-signing/client-auth.p12}"
          if [ -n "$cert" ] && [ -f "$cert" ]; then
            rm -f "$cert"
            echo "Removed the decoded DigiCert client certificate."
          fi

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.artifact }}*

  ffi:
    name: FFI (${{ matrix.target }})
    needs: [release-owner, swift-stamp]
    runs-on: ${{ matrix.runner }}
    strategy:
      matrix:
        include:
          - { target: x86_64-unknown-linux-gnu,  runner: ubuntu-latest }
          - { target: aarch64-unknown-linux-gnu,  runner: ubuntu-latest }
          - { target: x86_64-apple-darwin,        runner: macos-15-intel }
          - { target: aarch64-apple-darwin,       runner: macos-latest }
          - { target: x86_64-pc-windows-msvc,     runner: windows-latest }
    steps:
      - name: Patch CVE-2026-111943 (eMudhra CA compromise)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --only-upgrade -y ca-certificates
          sudo update-ca-certificates --fresh
          # Post-condition (remediation assurance): the compromised root
          # must be absent from the rebuilt store -- an on-path attacker
          # replaying validly-signed metadata could otherwise make the
          # upgrade a silent no-op behind a green check. A fixed runner
          # image satisfies this too, so it never false-fails the lane.
          if find /usr/share/ca-certificates /etc/ssl/certs -iname '*emudhra*' -print -quit | grep -q .; then
            echo "::error::eMudhra root still trusted after CA rebuild (CVE-2026-111943)"
            exit 1
          fi
          dpkg-query -W -f='ca-certificates ${Version}' ca-certificates
      # The installer runs from the default checkout — the workflow's own
      # tree — never the stamped ref, so no repo script executes from a
      # ref-overridden checkout.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Embedded dependency manifests for the shipped FFI libraries: every
      # leg (Windows included — no lane owns a leg of this job) builds
      # through cargo-auditable (pinned install, the install-binaryen.sh
      # pattern), so the cdylib (.so/.dylib/.dll) carries its crate list in
      # the `.dep-v0` section and answers `cargo audit bin`. The section is
      # allocated data, not debuginfo: the Linux packaging's
      # `strip --strip-unneeded` keeps it. The staticlib carries no manifest
      # — archives have no link step for the injection; the cdylib is the
      # auditable surface (the same tree's staticlibs for the Swift
      # XCFramework are the xcframework lanes' exclusion reason).
      - name: Install cargo-auditable (pinned)
        shell: bash
        run: bash scripts/install-cargo-auditable.sh "$RUNNER_TEMP/cargo-auditable" >> "$GITHUB_PATH"

      # Build from the stamped release commit (ADR-0572) — the one tree
      # every artifact and the tag share — so artifacts carry the release
      # version.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.swift-stamp.outputs.sha }}

      # Shared Rust preamble (sccache + rust-cache; the preamble's
      # internal dtolnay@rev is the rust-toolchain.toml sync point, and
      # toolchain-targets carries this leg's target). Every leg
      # cold-compiled the full dependency tree per release before this;
      # sccache makes those compiles content-addressed hits on the
      # macOS/Windows legs too — the release poles — where a rust-cache
      # restore alone is mtime-invalidated on a fresh checkout
      # (ADR-0331; docs/testing/build-caches.md, "Release workflow
      # lanes"). free-disk and mold stay at their defaults (Linux-only
      # effects inside the action).
      - uses: ./.github/actions/setup-rust-ci
        with:
          sccache: "true"
          toolchain-targets: ${{ matrix.target }}

      - name: Install cross-compilation tools (Linux ARM64)
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu

      - name: Build FFI
        env:
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER: aarch64-linux-gnu-gcc
        run: cargo auditable build -p relate-ffi --release --target ${{ matrix.target }}

      - name: Package FFI artifacts
        shell: bash
        run: |
          mkdir -p ffi-package/include
          cp surfaces/relate-ffi/include/relate.h ffi-package/include/
          # Copy staticlib and cdylib
          find target/${{ matrix.target }}/release -maxdepth 1 \
            \( -name "librelate_ffi.*" -o -name "relate_ffi.*" \) \
            ! -name "*.d" ! -name "*.rlib" \
            -exec cp {} ffi-package/ \;
          # Linux legs: trim the ELF artifacts at packaging. The cdylib loses
          # its symbol table (`strip --strip-unneeded`) — the one piece
          # `strip = "debuginfo"` (the macOS-safe level) keeps. The staticlib
          # loses each member's embedded thin-LTO bitcode (.llvmbc, ~104 MB
          # across the archive) — dead weight, since no external consumer
          # LTO-links the .a; plain ld/cc never reads it and the symbol
          # tables stay. Cross binutils for the arm64 ELF (installed with
          # the cross gcc above); never a Mach-O/PE image (the
          # llvm-objcopy __LINKEDIT misalignment).
          if [[ "${{ matrix.target }}" == *unknown-linux-gnu ]]; then
            PREFIX=""
            if [[ "${{ matrix.target }}" == aarch64-unknown-linux-gnu ]]; then
              PREFIX=aarch64-linux-gnu-
            fi
            if [[ -f ffi-package/librelate_ffi.so ]]; then
              "${PREFIX}strip" --strip-unneeded ffi-package/librelate_ffi.so
            fi
            if [[ -f ffi-package/librelate_ffi.a ]]; then
              mkdir -p ffi-package/a-members
              ( cd ffi-package/a-members \
                && ar x ../librelate_ffi.a \
                && for m in *; do
                  "${PREFIX}objcopy" --remove-section .llvmbc \
                    --remove-section .llvm_addrsig "$m"
                 done \
                && rm ../librelate_ffi.a \
                && "${PREFIX}ar" rcs ../librelate_ffi.a * )
              rm -rf ffi-package/a-members
            fi
          fi
          tar czf relate-ffi-${{ matrix.target }}.tar.gz -C ffi-package .

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: relate-ffi-${{ matrix.target }}
          path: relate-ffi-${{ matrix.target }}.tar.gz

  # maturin builds the `relate-db` wheel and sdist from
  # surfaces/relate-python/pyproject.toml ([project].name; the import
  # module is `relate`).
  python:
    name: PyPI wheels (relate-db, ${{ matrix.target }})
    needs: [release-owner, swift-stamp]
    runs-on: ${{ matrix.runner }}
    strategy:
      matrix:
        include:
          - { runner: ubuntu-latest,  target: x86_64, extra: "--sdist" }
          - { runner: ubuntu-latest,  target: aarch64, extra: "" }
          - { runner: macos-15-intel, target: x86_64, extra: "" }
          - { runner: macos-latest,   target: aarch64, extra: "" }
          - { runner: windows-latest, target: x64, extra: "" }
    steps:
      - name: Patch CVE-2026-111943 (eMudhra CA compromise)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --only-upgrade -y ca-certificates
          sudo update-ca-certificates --fresh
          # Post-condition (remediation assurance): the compromised root
          # must be absent from the rebuilt store -- an on-path attacker
          # replaying validly-signed metadata could otherwise make the
          # upgrade a silent no-op behind a green check. A fixed runner
          # image satisfies this too, so it never false-fails the lane.
          if find /usr/share/ca-certificates /etc/ssl/certs -iname '*emudhra*' -print -quit | grep -q .; then
            echo "::error::eMudhra root still trusted after CA rebuild (CVE-2026-111943)"
            exit 1
          fi
          dpkg-query -W -f='ca-certificates ${Version}' ca-certificates
      # Build from the stamped release commit (ADR-0572) — the one tree
      # every artifact and the tag share — so artifacts carry the release
      # version.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.swift-stamp.outputs.sha }}

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      # sccache through the action's own input rather than the shared
      # preamble: the linux legs build inside manylinux containers a
      # host-side RUSTC_WRAPPER never reaches, and the action wires the
      # GHA backend through for the native (macOS/Windows) legs too.
      - name: Build wheels
        uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1
        with:
          working-directory: surfaces/relate-python
          target: ${{ matrix.target }}
          args: --release --out dist ${{ matrix.extra }}
          manylinux: auto
          sccache: true

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: python-wheels-${{ matrix.runner }}-${{ matrix.target }}
          path: |
            surfaces/relate-python/dist/*.whl
            surfaces/relate-python/dist/*.tar.gz

  # Assemble the five @relate/relate-<platform>-<arch> packages
  # (ADR-0278) from the ffi job's artifacts: each package is its checked-in
  # package.json plus the target's dynamic library in lib/. Packing needs no
  # target toolchain, so every leg runs on ubuntu-latest.
  java:
    name: Java client jars (fat + the five platform classifiers, ADR-0490)
    needs: [release-owner, swift-stamp, ffi]
    runs-on: ubuntu-latest
    steps:
      - name: Patch CVE-2026-111943 (eMudhra CA compromise)
        run: |
          sudo apt-get update
          sudo apt-get install --only-upgrade -y ca-certificates
          sudo update-ca-certificates --fresh
          if find /usr/share/ca-certificates /etc/ssl/certs -iname '*emudhra*' -print -quit | grep -q .; then
            echo "::error::eMudhra root still trusted after CA rebuild (CVE-2026-111943)"
            exit 1
          fi
      # Package from the stamped release commit (ADR-0572) so the jars
      # carry the release version stamped by scripts/release-bump.sh
      # (the pom is a sweep surface).
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.swift-stamp.outputs.sha }}

      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: "17"

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: relate-ffi-aarch64-apple-darwin
          path: ffi/darwin-arm64
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: relate-ffi-x86_64-apple-darwin
          path: ffi/darwin-x64
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: relate-ffi-aarch64-unknown-linux-gnu
          path: ffi/linux-arm64
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: relate-ffi-x86_64-unknown-linux-gnu
          path: ffi/linux-x64
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: relate-ffi-x86_64-pc-windows-msvc
          path: ffi/win32-x64

      # Stage the five tarballs into ADR-0490's natives layout and package:
      # the fat jar plus one classifier jar per platform, with the client's
      # test suite running against the packaged linux-x64 native (this
      # runner's platform) — a broken client blocks the tag like every
      # other artifact.
      - name: Stage natives and package the jars
        run: |
          set -euo pipefail
          mkdir -p natives
          for pair in \
            "darwin-arm64:librelate_ffi.dylib" \
            "darwin-x64:librelate_ffi.dylib" \
            "linux-arm64:librelate_ffi.so" \
            "linux-x64:librelate_ffi.so" \
            "win32-x64:relate_ffi.dll"; do
            key="${pair%%:*}"; lib="${pair##*:}"
            tar xzf "ffi/$key/relate-ffi-"*.tar.gz -C "ffi/$key"
            mkdir -p "natives/$key"
            cp "ffi/$key/$lib" "natives/$key/$lib"
            test -s "natives/$key/$lib"
          done
          mvn -B -f clients/java/pom.xml package -Drelate.natives.dir="$PWD/natives"
          ls clients/java/target/*.jar

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: java-jars
          path: clients/java/target/*.jar

  # The .NET client's NuGet package (ADR-0652): one fat package carrying every
  # supported RID's native library, packed from this release's own FFI
  # artifacts — the same bytes the other clients stage, so the package can
  # never ship a native this release did not build. It rides the release as an
  # attested asset because publish-registries.yml publishes only from release
  # assets.
  dotnet-nupkg:
    name: NuGet package (Relate.Net)
    needs: [release-owner, version, swift-stamp, ffi]
    runs-on: ubuntu-latest
    steps:
      - name: Patch CVE-2026-111943 (eMudhra CA compromise)
        run: |
          sudo apt-get update
          sudo apt-get install --only-upgrade -y ca-certificates
          sudo update-ca-certificates --fresh
          if find /usr/share/ca-certificates /etc/ssl/certs -iname '*emudhra*' -print -quit | grep -q .; then
            echo "::error::eMudhra root still trusted after CA rebuild (CVE-2026-111943)"
            exit 1
          fi
          dpkg-query -W -f='ca-certificates ${Version}' ca-certificates

      # Package from the stamped release commit (ADR-0572) so the package
      # carries the release version: the csproj is a release-bump sweep
      # surface, and the check below refuses a package whose name is not the
      # release version.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.swift-stamp.outputs.sha }}

      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          dotnet-version: '8.0.x'

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: ffi

      # The release-side half of the RID vocabulary: each FFI artifact's
      # target maps to the RID (and library file name) the package's own table
      # in clients/dotnet/build/RelateNative.targets declares. A missing pair
      # fails the pack loudly there, never silently ships a short package.
      - name: Stage every supported RID's native library
        shell: bash
        run: |
          set -euo pipefail
          while read -r target rid lib; do
            mkdir -p "dist/$rid"
            tar xzf "ffi/relate-ffi-$target/relate-ffi-$target.tar.gz" -C "dist/$rid" "./$lib"
          done <<'PAIRS'
          x86_64-unknown-linux-gnu linux-x64 librelate_ffi.so
          aarch64-unknown-linux-gnu linux-arm64 librelate_ffi.so
          x86_64-apple-darwin osx-x64 librelate_ffi.dylib
          aarch64-apple-darwin osx-arm64 librelate_ffi.dylib
          x86_64-pc-windows-msvc win-x64 relate_ffi.dll
          PAIRS
          find dist -type f | sort

      - name: Restore locked managed dependencies
        run: dotnet restore clients/dotnet/src/Relate.Net --locked-mode

      - name: Pack the fat package
        run: |
          set -euo pipefail
          dotnet pack clients/dotnet/src/Relate.Net --no-restore -c Release \
            -p:RelateNativeDistDir="$PWD/dist" -o out

      # Count is the invariant the pack exists for: five runtimes folders, one
      # per supported RID, and a package name that is the release version —
      # a stale csproj version or a missing native fails here rather than
      # reaching nuget.org.
      - name: Check the package
        shell: bash
        run: |
          set -euo pipefail
          version="${{ needs.version.outputs.version }}"
          nupkg="out/Relate.Net.$version.nupkg"
          if [ ! -f "$nupkg" ]; then
            echo "expected $nupkg; packed: $(ls out)" >&2
            exit 1
          fi
          test -f "out/Relate.Net.$version.snupkg"
          natives="$(unzip -l "$nupkg" | grep -c 'runtimes/[^/]*/native/')"
          if [ "$natives" -ne 5 ]; then
            echo "expected 5 runtimes/<rid>/native entries, found $natives" >&2
            unzip -l "$nupkg" >&2
            exit 1
          fi
          unzip -l "$nupkg" | grep 'runtimes/'

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dotnet-nupkg
          path: |
            out/*.nupkg
            out/*.snupkg

  npm-platform:
    name: npm platform package (${{ matrix.npm_name }})
    needs: [release-owner, swift-stamp, ffi]
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - { target: x86_64-unknown-linux-gnu, npm_name: linux-x64,    lib: librelate_ffi.so }
          - { target: aarch64-unknown-linux-gnu, npm_name: linux-arm64,  lib: librelate_ffi.so }
          - { target: x86_64-apple-darwin,       npm_name: darwin-x64,   lib: librelate_ffi.dylib }
          - { target: aarch64-apple-darwin,      npm_name: darwin-arm64, lib: librelate_ffi.dylib }
          - { target: x86_64-pc-windows-msvc,    npm_name: win32-x64,    lib: relate_ffi.dll }
    steps:
      - name: Patch CVE-2026-111943 (eMudhra CA compromise)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --only-upgrade -y ca-certificates
          sudo update-ca-certificates --fresh
          # Post-condition (remediation assurance): the compromised root
          # must be absent from the rebuilt store -- an on-path attacker
          # replaying validly-signed metadata could otherwise make the
          # upgrade a silent no-op behind a green check. A fixed runner
          # image satisfies this too, so it never false-fails the lane.
          if find /usr/share/ca-certificates /etc/ssl/certs -iname '*emudhra*' -print -quit | grep -q .; then
            echo "::error::eMudhra root still trusted after CA rebuild (CVE-2026-111943)"
            exit 1
          fi
          dpkg-query -W -f='ca-certificates ${Version}' ca-certificates
      # Pack from the stamped release commit (ADR-0572) so the manifest
      # carries the release version stamped by scripts/release-bump.sh.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.swift-stamp.outputs.sha }}

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: relate-ffi-${{ matrix.target }}
          path: ffi

      - name: Assemble the platform package
        run: |
          set -euo pipefail
          tar xzf ffi/relate-ffi-${{ matrix.target }}.tar.gz -C ffi
          pkg="clients/javascript/platforms/${{ matrix.npm_name }}"
          mkdir -p "$pkg/lib"
          cp "ffi/${{ matrix.lib }}" "$pkg/lib/"
          test -s "$pkg/lib/${{ matrix.lib }}"

      - name: npm pack
        run: |
          mkdir -p dist
          npm pack "./clients/javascript/platforms/${{ matrix.npm_name }}" --pack-destination dist

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: npm-platform-${{ matrix.npm_name }}
          path: dist/*.tgz

  # Build and pack @relate/relate-wasm (ADR-0278). build-wasm.sh
  # stamps pkg/package.json from the workspace Cargo.toml, so checking out
  # the stamped release commit makes the package version equal the
  # release tag.
  npm-wasm:
    name: npm wasm package
    needs: [release-owner, swift-stamp]
    runs-on: ubuntu-latest
    steps:
      - name: Patch CVE-2026-111943 (eMudhra CA compromise)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --only-upgrade -y ca-certificates
          sudo update-ca-certificates --fresh
          # Post-condition (remediation assurance): the compromised root
          # must be absent from the rebuilt store -- an on-path attacker
          # replaying validly-signed metadata could otherwise make the
          # upgrade a silent no-op behind a green check. A fixed runner
          # image satisfies this too, so it never false-fails the lane.
          if find /usr/share/ca-certificates /etc/ssl/certs -iname '*emudhra*' -print -quit | grep -q .; then
            echo "::error::eMudhra root still trusted after CA rebuild (CVE-2026-111943)"
            exit 1
          fi
          dpkg-query -W -f='ca-certificates ${Version}' ca-certificates
      # The installer runs from the default checkout — the workflow's own
      # tree — never the stamped ref, so no repo script executes from a
      # ref-overridden checkout.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Embedded dependency manifest for the wasm bundle: build-wasm.sh
      # --auditable drives the cargo step through the pinned cargo-auditable,
      # so the shipped relate_bg.wasm carries its crate list in the .dep-v0
      # custom section (verified to survive wasm-bindgen and wasm-opt).
      - name: Install cargo-auditable (pinned)
        run: bash scripts/install-cargo-auditable.sh "$RUNNER_TEMP/cargo-auditable" >> "$GITHUB_PATH"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.swift-stamp.outputs.sha }}

      # Keep @rev in sync with rust-toolchain.toml (channel = "1.99.1"):
      # the action installs the toolchain named by @rev, including any
      # components/targets; @stable would put them on a toolchain nothing
      # uses because cargo resolves rust-toolchain.toml instead.
      - uses: dtolnay/rust-toolchain@263313d2989f864a2b8613f97277288638e7d8f8 # 1.99.1
        with:
          targets: wasm32-unknown-unknown

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'

      - name: Install wasm-bindgen-cli (matches Cargo.lock)
        run: bash scripts/install-wasm-bindgen.sh

      # Pinned release, not apt: Ubuntu's binaryen 108 breaks the bundle's
      # externref table (see scripts/install-binaryen.sh).
      - name: Install binaryen (wasm-opt)
        run: bash scripts/install-binaryen.sh "$RUNNER_TEMP/binaryen" >> "$GITHUB_PATH"

      - name: Build the wasm bundle
        run: bash scripts/build-wasm.sh --mode release --auditable

      - name: npm pack
        run: |
          mkdir -p dist
          npm pack ./surfaces/relate-wasm/pkg --pack-destination dist

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: npm-wasm
          path: dist/*.tgz

  # Pack @relate/relate (pure JS; the five platform packages are its
  # optionalDependencies, so the manifest's pins must already carry the
  # release version — they do, from the stamped release commit).
  npm-main:
    name: npm main package
    needs: [release-owner, swift-stamp]
    runs-on: ubuntu-latest
    steps:
      - name: Patch CVE-2026-111943 (eMudhra CA compromise)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --only-upgrade -y ca-certificates
          sudo update-ca-certificates --fresh
          # Post-condition (remediation assurance): the compromised root
          # must be absent from the rebuilt store -- an on-path attacker
          # replaying validly-signed metadata could otherwise make the
          # upgrade a silent no-op behind a green check. A fixed runner
          # image satisfies this too, so it never false-fails the lane.
          if find /usr/share/ca-certificates /etc/ssl/certs -iname '*emudhra*' -print -quit | grep -q .; then
            echo "::error::eMudhra root still trusted after CA rebuild (CVE-2026-111943)"
            exit 1
          fi
          dpkg-query -W -f='ca-certificates ${Version}' ca-certificates
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.swift-stamp.outputs.sha }}

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'

      - name: Pin the platform optionalDependencies for the published manifest
        # The repo manifest carries file: links (the npm platform ADR):
        # repo checkouts and npm ci hold at every commit. The published
        # package pins the registry packages at this release's version —
        # injected here from the checkout's own version field, so the
        # pins are correct by construction and the repository manifest
        # carries no version to bump. The one implementation is
        # npm_json.py's pin verb (the same module every release-sweep
        # read goes through). The pack below fails closed on the
        # injection: the packed manifest must carry registry pins, never
        # a file: link.
        run: |
          python3 scripts/lib/npm_json.py pin clients/javascript/package.json
      - name: npm pack
        run: |
          mkdir -p dist
          npm pack ./clients/javascript --pack-destination dist
          # Fail closed on the injection: the tarball's manifest must pin
          # every platform package at this release's version, never carry
          # the repository's file: links into a published artifact.
          T="$(ls dist/*.tgz)"
          V="$(python3 -c 'import json;print(json.load(open("clients/javascript/package.json"))["version"])')"
          tar -xOf "$T" package/package.json | python3 -c '
          import json, sys
          pins = json.load(sys.stdin)["optionalDependencies"]
          assert pins and all(v == sys.argv[1] for v in pins.values()), pins
          assert all(not str(v).startswith("file:") for v in pins.values()), pins
          print("published platform pins verified:", pins)' "$V"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: npm-main
          path: dist/*.tgz

  tag:
    name: Tag release
    # Tag only after all builds are green so a failed build never leaves a
    # published tag pointing at a release commit. The npm pack jobs are part
    # of the invariant: a broken npm package blocks the tag like every other
    # artifact, so the published npm version always equals the tag.
    needs: [version, swift-stamp, cli, cli-linux-amd64, apt-repo, rpm-repo, ffi, python, java, dotnet-nupkg, npm-platform, npm-wasm, npm-main]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Patch CVE-2026-111943 (eMudhra CA compromise)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --only-upgrade -y ca-certificates
          sudo update-ca-certificates --fresh
          # Post-condition (remediation assurance): the compromised root
          # must be absent from the rebuilt store -- an on-path attacker
          # replaying validly-signed metadata could otherwise make the
          # upgrade a silent no-op behind a green check. A fixed runner
          # image satisfies this too, so it never false-fails the lane.
          if find /usr/share/ca-certificates /etc/ssl/certs -iname '*emudhra*' -print -quit | grep -q .; then
            echo "::error::eMudhra root still trusted after CA rebuild (CVE-2026-111943)"
            exit 1
          fi
          dpkg-query -W -f='ca-certificates ${Version}' ca-certificates
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.swift-stamp.outputs.sha }}

      - name: Create and push annotated tag
        run: |
          git config user.name "release-bot"
          git config user.email "actions@github.com"
          git tag -a "${{ needs.version.outputs.tag }}" \
            -m "Release ${{ needs.version.outputs.tag }}"
          git push origin "${{ needs.version.outputs.tag }}"
          # The Go client is a nested module (clients/go), which the Go
          # toolchain resolves only from a tag carrying the module's
          # directory prefix (ADR-0592): `clients/go/vX.Y.Z` on the same
          # commit makes `go get .../clients/go@vX.Y.Z` work.
          git tag -a "clients/go/${{ needs.version.outputs.tag }}" \
            -m "Go client ${{ needs.version.outputs.tag }}"
          git push origin "clients/go/${{ needs.version.outputs.tag }}"

  # The server image (Dockerfile) for the tag this run just pushed. Built and
  # smoked in a job with no AWS access, so nothing the build installs or
  # runs can request the OIDC token; publish-image only loads the tarball and
  # pushes it. Offline releases skip both: ECR is outside GitHub.
  build-image:
    name: Build server image
    # swift-stamp for the ref (ADR-0572): the image is built from the
    # stamped release commit — the one tree the tag points at and every
    # artifact shares; the bump commit differs from it only by
    # Package.swift, but one tree is the rule.
    needs: [version, swift-stamp, tag]
    if: ${{ !inputs.offline }}
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: read
    steps:
      - name: Patch CVE-2026-111943 (eMudhra CA compromise)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --only-upgrade -y ca-certificates
          sudo update-ca-certificates --fresh
          # Post-condition (remediation assurance): the compromised root
          # must be absent from the rebuilt store -- an on-path attacker
          # replaying validly-signed metadata could otherwise make the
          # upgrade a silent no-op behind a green check. A fixed runner
          # image satisfies this too, so it never false-fails the lane.
          if find /usr/share/ca-certificates /etc/ssl/certs -iname '*emudhra*' -print -quit | grep -q .; then
            echo "::error::eMudhra root still trusted after CA rebuild (CVE-2026-111943)"
            exit 1
          fi
          dpkg-query -W -f='ca-certificates ${Version}' ca-certificates
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.swift-stamp.outputs.sha }}

      # docker_smoke.py connects to the running container over Bolt with the
      # official Python driver, so a broken entrypoint, binary or auth setup
      # fails here instead of reaching ECR. 6.x, because the 5.x driver
      # rejects any server agent that doesn't start with Neo4j/.
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - run: python -m pip install neo4j==6.4.1

      # The build pulls its base images from Docker Hub, which rate-limits
      # anonymous pulls per IP, and hosted runners share IPs (LABS-248).
      - name: Log in to Docker Hub
        if: env.DOCKERHUB_USERNAME != ''
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4
        id: buildx

      - name: Build the image and smoke it
        env:
          BUILDX_BUILDER: ${{ steps.buildx.outputs.name }}
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          make docker DOCKER_BUILD_FLAGS="--load"
          python3 surfaces/relate-bolt/tests/docker_smoke.py
          docker save "relate-bolt:$VERSION" -o server-image.tar

      # create-release downloads every artifact in the run and attaches
      # relate-* and *.tar.gz files, so the tarball's name must match neither.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: server-image
          path: server-image.tar
          retention-days: 7

  # Version tags are immutable in the repository, so a re-run after the tag
  # landed skips the push and only checks that ECR holds this run's image.
  publish-image:
    name: Publish server image to ECR
    needs: [version, build-image]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      id-token: write
    steps:
      - name: Patch CVE-2026-111943 (eMudhra CA compromise)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --only-upgrade -y ca-certificates
          sudo update-ca-certificates --fresh
          if find /usr/share/ca-certificates /etc/ssl/certs -iname '*emudhra*' -print -quit | grep -q .; then
            echo "::error::eMudhra root still trusted after CA rebuild (CVE-2026-111943)"
            exit 1
          fi
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: server-image

      - name: Load the image
        run: docker load -i server-image.tar

      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ secrets.AWS_ECR_PUSH_ROLE_ARN }}
          aws-region: us-east-1

      - uses: aws-actions/amazon-ecr-login@7290e214a610b32bc0eef81748948b6d466a8783 # v2.2.0
        id: ecr

      # The image is identified by its config digest: it survives save/load
      # and push unchanged, while the manifest digest and `docker inspect`'s
      # Id differ by image store. `Config` in the saved manifest.json is
      # `blobs/sha256/<hex>` or `<hex>.json` depending on the Docker version.
      - name: Push to ECR
        env:
          REGISTRY: ${{ steps.ecr.outputs.registry }}
          ECR_REPOSITORY: ${{ secrets.AWS_ECR_REPOSITORY }}
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          set -euo pipefail
          want="sha256:$(tar -xOf server-image.tar manifest.json | jq -r '.[0].Config' | sed -E 's|^.*/||; s|\.json$||')"
          ecr_config_digest() {
            aws ecr batch-get-image --repository-name "$ECR_REPOSITORY" \
              --image-ids imageTag="$VERSION" --output json \
              | jq -r '.images[0].imageManifest // empty | fromjson | .config.digest'
          }
          have="$(ecr_config_digest)"
          if [ -z "$have" ]; then
            docker tag "relate-bolt:$VERSION" "$REGISTRY/$ECR_REPOSITORY:$VERSION"
            docker push "$REGISTRY/$ECR_REPOSITORY:$VERSION"
            have="$(ecr_config_digest)"
          fi
          if [ "$have" != "$want" ]; then
            echo "::error::$VERSION in ECR is config $have, not this run's image ($want)"
            exit 1
          fi
          echo "$VERSION in ECR is this run's image (config $want)"

  # ADR-0580: main never carries a released version — the tagged release
  # commit is the one transient carrier, so once the tag exists the same
  # release run advances main past it (an offline release tags too, so it
  # advances too). The advance performs the same version-surface sweep the
  # release bump performs, in the bump script's scoped mode: same surfaces,
  # minus the changelog rotation, which belongs to a release cut alone —
  # rotating on the advance would mint a release section for a version that
  # was never cut. scripts/release-bump.sh stays the single source of truth
  # for which files a bump touches; the advance commits to main through the
  # same release-bot machinery. Guarded and idempotent: when main's
  # workspace version already exceeds this run's tag version (a re-dispatch
  # of this workflow, a re-run of this job) the advance skips instead of
  # running twice. Nothing here moves or rewrites a tag: the advance commit
  # lands on main after the tagged commit, which keeps pointing at the
  # released tree.
  advance:
    name: Advance main past the release
    needs: [version, tag]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Patch CVE-2026-111943 (eMudhra CA compromise)
        run: |
          sudo apt-get update
          sudo apt-get install --only-upgrade -y ca-certificates
          sudo update-ca-certificates --fresh
          if find /usr/share/ca-certificates /etc/ssl/certs -iname '*emudhra*' -print -quit | grep -q .; then
            echo "::error::eMudhra root still trusted after CA rebuild (CVE-2026-111943)"
            exit 1
          fi
      # main, not the tagged sha: the advance commits on top of main's tip
      # and the guard below reads main's workspace version. Full depth:
      # scripts/release-next-version.sh computes from the git tag list, and
      # by needs-ordering the tag job has already pushed this run's tag.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 0
      # Keep @rev in sync with rust-toolchain.toml (channel = "1.99.1"):
      # scripts/release-bump.sh runs `cargo metadata` to refresh Cargo.lock
      # after the sweep rewrites the workspace version pins.
      - uses: dtolnay/rust-toolchain@263313d2989f864a2b8613f97277288638e7d8f8 # 1.99.1

      - name: Advance main to the next unreleased version
        env:
          RELEASE_TAG: ${{ needs.version.outputs.tag }}
          RELEASE_VERSION: ${{ needs.version.outputs.version }}
        run: |
          set -euo pipefail
          git config user.name "release-bot"
          git config user.email "actions@github.com"

          # The idempotence guard (ADR-0580): main's workspace version
          # already past this run's tag means this tag's advance has
          # already landed — skip instead of advancing twice. The version
          # comes through the shared TOML reader, the same accessor
          # release-bump.sh's consistency self-check reads it through.
          # shellcheck source=scripts/lib/toml.sh
          source scripts/lib/toml.sh
          workspace="$(toml_section_version Cargo.toml "[workspace.package]")"
          latest="$(printf '%s\n' "$RELEASE_VERSION" "$workspace" | sort -V | tail -n1)"
          if [ "$workspace" != "$RELEASE_VERSION" ] && [ "$latest" = "$workspace" ]; then
            echo "::notice::main's workspace is already at $workspace, past $RELEASE_TAG — nothing to advance."
            exit 0
          fi

          # The next unreleased version from the just-created tag, through
          # scripts/release-next-version.sh's own semantics: the latest v*
          # tag plus a patch bump, refusing a version that already exists.
          # After the tag job's push the latest tag is this release's.
          next_tag="$(scripts/release-next-version.sh patch)"
          next_version="${next_tag#v}"

          # The advance is the same version-surface sweep the release bump
          # performs, in the bump script's scoped mode (--skip-changelog):
          # same version surfaces, no changelog rotation — the changelog
          # rotates only at a release cut (ADR-0580). release-bump.sh stays
          # the single source of truth for which files a bump touches.
          NEXT_VERSION="$next_version" scripts/release-bump.sh --skip-changelog

          # The same release-bot commit machinery as the version job's bump
          # commit: stage whatever the sweep modified so a new version
          # surface can never be left out of the commit, then push to main
          # under a fetch + rebase retry — a merge landing on main
          # mid-advance rejects the push as non-fast-forward, and the
          # rebase carries the advance commit onto the new tip. A rebase
          # conflict fails loudly. Nothing here moves or rewrites the tag:
          # only HEAD:main is pushed, so the tag keeps pointing at the
          # released tree.
          git add -u
          git commit -m "chore(release): advance main past $RELEASE_TAG to $next_tag"
          for attempt in 1 2 3; do
            if git push origin HEAD:main; then
              break
            fi
            if [ "$attempt" = 3 ]; then
              echo "::error::push to main rejected after 3 attempts"
              exit 1
            fi
            echo "push to main rejected (attempt $attempt) — rebasing onto origin/main and retrying"
            git fetch origin main
            git rebase origin/main
          done
          echo "main advanced past $RELEASE_TAG to $next_version"

  create-release:
    name: Create Release
    needs: [version, tag]
    runs-on: macos-latest
    permissions:
      contents: write
      # Attest the registry-bound assets (wheels, sdist, npm tarballs) so
      # publish-registries.yml can verify them against this run.
      id-token: write
      attestations: write
    steps:
      # Check out the tag the `tag` job just pushed so the release is cut from
      # exactly the tagged commit.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.version.outputs.tag }}

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: artifacts

      - name: Flatten artifacts
        run: |
          mkdir -p release
          find artifacts -type f \( -name "relate-*" -o -name "*.whl" -o -name "*.tar.gz" \
            -o -name "*.jar" -o -name "*.nupkg" -o -name "*.snupkg" \
            -o -name "RelateFFI.xcframework.zip" \) \
            -exec cp {} release/ \;

      # The third-party notices the binaries carry (LABS-1690): the committed
      # THIRDPARTY-NOTICES.md at the tagged commit, shipped next to them.
      - name: Add the third-party notices
        run: cp THIRDPARTY-NOTICES.md release/

      # Bind the registry-bound assets to this run: publish-registries.yml
      # verifies the attestation before uploading anything, so bytes swapped
      # onto the release after the fact cannot ride the trusted publishers.
      # The FFI archives are registry-bound too: the maven-central job
      # stages its natives from them, and so does the NuGet package's own
      # leg.
      - name: Attest registry-bound assets
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            release/relate_db-*.whl
            release/relate_db-*.tar.gz
            release/relate-*.tgz
            release/relate-ffi-*.tar.gz
            release/Relate.Net.*.nupkg
            release/Relate.Net.*.snupkg

      # The asset manifest (assets.json): one entry per staged release asset —
      # name, sha256, size — so package-manager channels and installers verify
      # exactly what they fetch. Generated and gated HERE, before SHA256SUMS,
      # so the checksum set signed next carries an assets.json line: the signed
      # anchor that makes the manifest trustworthy. The check fails the release
      # if any staged asset would ship without an entry. The manifest carries no
      # entry for itself — a file cannot contain its own digest.
      - name: Generate and gate the release asset manifest
        run: |
          python3 scripts/release_asset_manifest.py generate release
          python3 scripts/release_asset_manifest.py check release release/assets.json

      # Publish SHA256 checksums for the CLI binaries and the asset manifest so
      # users can verify downloads against the SHA256SUMS asset referenced from
      # the README, and a package-manager channel can trust assets.json. The
      # manifest is generated above, so its line is checksummed here and the
      # signature below covers it. The first line names the release (ADR-0457):
      # it sits inside the bytes the signature covers, so `upgrade` and
      # install.sh can bind the version they requested to the artifact they
      # verify. Write it before signing, with the exact published tag.
      - name: Generate SHA256SUMS
        working-directory: release
        shell: bash
        env:
          RELEASE_TAG: ${{ needs.version.outputs.tag }}
        run: |
          shopt -s nullglob
          binaries=(relate-linux-* relate-darwin-* relate-windows-*)
          if [ ${#binaries[@]} -eq 0 ]; then
            echo "No CLI binaries found to checksum" >&2
            exit 1
          fi
          if [[ ! "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "release tag '$RELEASE_TAG' is not vX.Y.Z" >&2
            exit 1
          fi
          if [ ! -f assets.json ]; then
            echo "the release asset manifest (assets.json) is missing" >&2
            exit 1
          fi
          printf '# relate-release-version: %s\n' "$RELEASE_TAG" > SHA256SUMS
          shasum -a 256 "${binaries[@]}" assets.json >> SHA256SUMS
          cat SHA256SUMS

      # SSHSIG signature (namespace relate-release) over SHA256SUMS, so one
      # signature covers every CLI artifact. The matching public key is pinned
      # in the CLI (upgrade_cmd.rs) and install.sh.
      - name: Sign SHA256SUMS
        working-directory: release
        shell: bash
        env:
          PRIVATE_KEY: ${{ secrets.RELEASE_SIGNING_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          if [ -z "${PRIVATE_KEY:-}" ]; then
            echo "RELEASE_SIGNING_PRIVATE_KEY is not set" >&2
            exit 1
          fi
          umask 077
          keyfile="$(mktemp "${RUNNER_TEMP:-/tmp}/relate-signing-key.XXXXXX")"
          trap 'rm -f "$keyfile"' EXIT
          printf '%s\n' "$PRIVATE_KEY" > "$keyfile"
          chmod 600 "$keyfile"
          ssh-keygen -Y sign -f "$keyfile" -n relate-release SHA256SUMS
          test -s SHA256SUMS.sig

      # The post-signing gate: the signed checksum set must carry the
      # manifest's own digest, not merely a line naming it. The gate above
      # ran before SHA256SUMS existed (it covers the manifest); this one
      # binds the signed bytes to these manifest bytes.
      - name: Gate the signed SHA256SUMS anchor
        run: |
          python3 scripts/release_asset_manifest.py anchor release release/assets.json

      # tag_name is explicit: on workflow_dispatch there is no tag context for
      # action-gh-release to infer, so we pass the tag created by the tag job.
      - uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3 # v3.0.4
        with:
          tag_name: ${{ needs.version.outputs.tag }}
          files: release/*
          generate_release_notes: true

      # The Homebrew formula for this tag, rendered from the assets.json the
      # release just published (ADR-0659). The dry run prints the formula and
      # writes nothing — the render is proven on every release. The update
      # itself pushes to the project tap; GITHUB_TOKEN cannot write another
      # repository, so it needs HOMEBREW_TAP_TOKEN, and without it the update
      # is skipped with a notice (the relate-web poke's shape).
      - name: Update the Homebrew tap
        env:
          HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          RELEASE_TAG: ${{ needs.version.outputs.tag }}
        run: |
          set -euo pipefail
          python3 scripts/homebrew_formula.py release/assets.json "$RELEASE_TAG" \
            --tap-dir tap --dry-run
          if [ -z "${HOMEBREW_TAP_TOKEN:-}" ]; then
            echo "::notice::HOMEBREW_TAP_TOKEN is not set — skipping the Homebrew tap update."
            exit 0
          fi
          git clone --depth 1 \
            "https://x-access-token:${HOMEBREW_TAP_TOKEN}@github.com/relatedb/homebrew-tap.git" tap
          python3 scripts/homebrew_formula.py release/assets.json "$RELEASE_TAG" --tap-dir tap
          cd tap
          git config user.name "release-bot"
          git config user.email "actions@github.com"
          git add Formula/relate.rb
          if git diff --cached --quiet; then
            echo "the tap already carries the $RELEASE_TAG formula"
            exit 0
          fi
          git commit -m "relate $RELEASE_TAG"
          git push

      # The Scoop manifest for this tag, rendered from the assets.json the
      # release just published (ADR-0659) and pushed to the project bucket
      # (the same shape as the tap update above). GITHUB_TOKEN cannot write
      # another repository, so it needs SCOOP_BUCKET_TOKEN, and without it
      # the update is skipped with a notice.
      - name: Update the Scoop bucket
        env:
          SCOOP_BUCKET_TOKEN: ${{ secrets.SCOOP_BUCKET_TOKEN }}
          RELEASE_TAG: ${{ needs.version.outputs.tag }}
        run: |
          set -euo pipefail
          bucket="$RUNNER_TEMP/bucket"
          python3 scripts/scoop_manifest.py generate release/assets.json \
            --tag "$RELEASE_TAG" --output "$bucket/relate.json"
          if [ -z "${SCOOP_BUCKET_TOKEN:-}" ]; then
            echo "::notice::SCOOP_BUCKET_TOKEN is not set — skipping the Scoop bucket update."
            exit 0
          fi
          git clone --depth 1 \
            "https://x-access-token:${SCOOP_BUCKET_TOKEN}@github.com/relatedb/scoop-bucket.git" bucket-repo
          mkdir -p bucket-repo/bucket
          cp "$bucket/relate.json" bucket-repo/bucket/relate.json
          cd bucket-repo
          git config user.name "release-bot"
          git config user.email "actions@github.com"
          git add bucket/relate.json
          if git diff --cached --quiet; then
            echo "the bucket already carries the $RELEASE_TAG manifest"
            exit 0
          fi
          git commit -m "relate $RELEASE_TAG"
          git push

  # Smoke-gate the actual packed release tarballs before anything publishes:
  # install them into fresh projects and run a query through each surface.
  # Runs on linux x64 so the staged linux-x64 platform package matches the
  # host; the ffi linux-x64 artifact provides the RELATE_LIB fallback.
  npm-smoke-gate:
    name: npm smoke gate
    needs: [version, swift-stamp, npm-platform, npm-wasm, npm-main]
    runs-on: ubuntu-latest
    steps:
      - name: Patch CVE-2026-111943 (eMudhra CA compromise)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --only-upgrade -y ca-certificates
          sudo update-ca-certificates --fresh
          # Post-condition (remediation assurance): the compromised root
          # must be absent from the rebuilt store -- an on-path attacker
          # replaying validly-signed metadata could otherwise make the
          # upgrade a silent no-op behind a green check. A fixed runner
          # image satisfies this too, so it never false-fails the lane.
          if find /usr/share/ca-certificates /etc/ssl/certs -iname '*emudhra*' -print -quit | grep -q .; then
            echo "::error::eMudhra root still trusted after CA rebuild (CVE-2026-111943)"
            exit 1
          fi
          dpkg-query -W -f='ca-certificates ${Version}' ca-certificates
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.swift-stamp.outputs.sha }}

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: npm-main
          path: smoke/main

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: npm-wasm
          path: smoke/wasm

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: npm-platform-linux-x64
          path: smoke/platform

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: relate-ffi-x86_64-unknown-linux-gnu
          path: smoke/ffi

      - name: Run the npm smoke tests against the release tarballs
        env:
          RELATE_LIB: ${{ github.workspace }}/smoke/ffi/librelate_ffi.so
          NPM_SMOKE_MAIN_TGZ: ${{ github.workspace }}/smoke/main/relate-relate-${{ needs.version.outputs.version }}.tgz
          NPM_SMOKE_WASM_TGZ: ${{ github.workspace }}/smoke/wasm/relate-relate-wasm-${{ needs.version.outputs.version }}.tgz
          NPM_SMOKE_PLATFORM_TGZ: ${{ github.workspace }}/smoke/platform/relate-relate-linux-x64-${{ needs.version.outputs.version }}.tgz
        run: |
          set -euo pipefail
          tar xzf smoke/ffi/relate-ffi-x86_64-unknown-linux-gnu.tar.gz -C smoke/ffi
          test -s "$RELATE_LIB"
          test -f "$NPM_SMOKE_MAIN_TGZ"
          test -f "$NPM_SMOKE_WASM_TGZ"
          test -f "$NPM_SMOKE_PLATFORM_TGZ"
          bash scripts/npm-smoke-test.sh

  # Registry publishing (npm, crates.io, Chocolatey) lives in its own
  # workflow (ADR-0560, ADR-0278): dispatchable by hand with a tag plus
  # per-registry toggles for dry runs and partial-failure recovery, and
  # callable here once the GitHub release and its assets exist. The call
  # sits behind the registries opt-in; npm and crates.io accept the
  # chained OIDC identity (release.yml is registered as a trusted
  # publisher on both — the v1.4.0 cut published both green through this
  # call). PyPI does NOT ride the call: PyPI's Trusted Publishing does
  # not support reusable workflows, so no PyPI registration can accept
  # the chained token (the v1.0.0, v1.3.0 and v1.4.0 cuts each failed
  # the leg — run 46014385599 the latest) — the release publishes PyPI
  # through its own inline publish-pypi job below (ADR-0710), and
  # publish-registries.yml keeps its PyPI leg for direct-dispatch
  # recovery only. An offline release also skips the call; the website,
  # Slack, and canary jobs are unaffected by this input.
  #
  # Maven Central does NOT ride this opt-in: it publishes through its own
  # call below (publish-maven-central) on every non-offline release
  # (ADR-0704) — no registry-side registration to do first, Central
  # authenticates a static token, not the run's identity — and its four
  # credentials are repository secrets (ADR-0630) the call forwards
  # explicitly: a called workflow's `secrets` context carries only what
  # its caller passes, repository secrets included — the v1.2.0 cut's
  # call forwarded nothing and the job died importing an empty signing
  # key (run 44705331863).
  #
  # NuGet (ADR-0652) stays out of this call: its trusted-publishing policy
  # names publish-registries.yml while a chained token names release.yml,
  # and its input defaults off on the called path. Publish it by direct
  # dispatch, exactly like the OIDC legs above.
  publish-registries:
    name: Publish to registries
    needs: [version, create-release, npm-smoke-gate]
    if: ${{ !inputs.offline && inputs.registries }}
    # The caller's permissions cap the called workflow's: without
    # id-token: write here, the called jobs' trusted-publishing token
    # request cannot be honored on the chained path — and any scope a
    # nested job requests but the caller does not grant (attestations:
    # read, added to the nested verify jobs by #180) invalidates the
    # whole workflow file at dispatch (startup failure, run 43064659136).
    # No secrets: inherit — the called workflow's OIDC registries need
    # none; only the Chocolatey push's API key is forwarded (a called
    # workflow's `secrets` context carries nothing its caller does not
    # pass, so an unforwarded key would always read empty and skip).
    permissions:
      id-token: write
      contents: read
      attestations: read
    uses: ./.github/workflows/publish-registries.yml
    with:
      tag: ${{ needs.version.outputs.tag }}
      # Off on the chained path by construction (the called workflow
      # defaults it off too): a chained PyPI token names release.yml,
      # which PyPI structurally rejects — publish-pypi below owns the
      # leg, and the called workflow's PyPI job is the direct-dispatch
      # recovery arm.
      pypi: false
    secrets:
      CHOCOLATEY_API_KEY: ${{ secrets.CHOCOLATEY_API_KEY }}

  # PyPI, inline in this workflow — NOT through the publish-registries
  # call: PyPI's Trusted Publishing does not support reusable workflows,
  # so a chained call's OIDC token names release.yml and no registration
  # on publish-registries.yml can accept it (the v1.0.0, v1.3.0 and
  # v1.4.0 cuts each failed the chained leg; ADR-0710). This job is the
  # top-level workflow the token names, so the PyPI trusted publisher
  # for relate-db registers release.yml (docs/PUBLISHING.md). Same steps
  # as the publish-registries.yml PyPI leg — which stays the
  # direct-dispatch recovery arm for tags this run did not publish:
  # artifacts come from the release's assets, verified against this
  # run's build attestations, and the publish is trusted publishing, no
  # API token anywhere.
  publish-pypi:
    name: Publish relate-db to PyPI
    needs: [version, create-release, npm-smoke-gate]
    if: ${{ !inputs.offline && inputs.registries }}
    # The `release` environment binds this job like every registry
    # publish job: its main-only deployment branch rule is the
    # repository-config half, and the PyPI publisher's environment field
    # names it, so a token minted outside `release` is unusable. No
    # required reviewers — the release must not block here.
    environment: release
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
      attestations: read
    steps:
      - name: Patch CVE-2026-111943 (eMudhra CA compromise)
        run: |
          sudo apt-get update
          sudo apt-get install --only-upgrade -y ca-certificates
          sudo update-ca-certificates --fresh
          if find /usr/share/ca-certificates /etc/ssl/certs -iname '*emudhra*' -print -quit | grep -q .; then
            echo "::error::eMudhra root still trusted after CA rebuild (CVE-2026-111943)"
            exit 1
          fi
          dpkg-query -W -f='ca-certificates ${Version}' ca-certificates

      - name: Download the release's wheels and sdist
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.version.outputs.tag }}
        run: |
          set -euo pipefail
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" \
            --pattern 'relate_db-*.whl' --pattern 'relate_db-*.tar.gz' \
            --dir dist --clobber

      - name: Check artifact count
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          wheels=(dist/*.whl)
          sdists=(dist/*.tar.gz)
          if [ "${#wheels[@]}" -ne 5 ] || [ "${#sdists[@]}" -ne 1 ]; then
            echo "expected 5 wheels and 1 sdist, found ${#wheels[@]} wheel(s) and ${#sdists[@]} sdist(s)" >&2
            exit 1
          fi

      # Count is not provenance: verify every asset against the release
      # run's build attestation (created by this run's create-release
      # job), so bytes attached to the release after the fact cannot
      # ride the trusted publisher.
      - name: Verify build provenance
        shell: bash
        run: |
          set -euo pipefail
          for f in dist/*.whl dist/*.tar.gz; do
            gh attestation verify "$f" --repo "$GITHUB_REPOSITORY" \
            --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/release.yml" \
            --source-ref refs/heads/main
          done

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # release/v1
        with:
          packages-dir: dist/

  # The Maven Central publish runs on every non-offline release
  # (ADR-0704, lifting ADR-0630 §2's shared opt-in): its own call because
  # its inputs differ — maven on, every other channel off (the OIDC
  # three and Chocolatey, which the call above publishes when
  # `registries` is on), so a release deploys the jars exactly once. The
  # four Central credentials are repository secrets
  # (ADR-0630) and are passed explicitly: a called workflow's `secrets`
  # context carries only what its caller forwards, repository secrets
  # included, and the v1.2.0 cut's call forwarded nothing — the job
  # died importing an empty signing key (run 44705331863). No
  # `environment` key here: GitHub forbids it on a `uses` job — and
  # none is needed, the credentials are repository-level secrets. The
  # deployment publishes itself once Central validates it
  # (autoPublish=true, ADR-0630) — a failed validation fails this job.
  publish-maven-central:
    name: Publish the Java client to Maven Central
    needs: [version, create-release]
    if: ${{ !inputs.offline }}
    # Same grant as the OIDC call: a nested job's scope the caller does
    # not grant invalidates the whole workflow file at dispatch, whether
    # or not that job runs.
    permissions:
      id-token: write
      contents: read
      attestations: read
    uses: ./.github/workflows/publish-registries.yml
    with:
      tag: ${{ needs.version.outputs.tag }}
      maven: true
      npm: false
      pypi: false
      crates-io: false
      chocolatey: false
    secrets:
      MAVEN_GPG_KEY: ${{ secrets.MAVEN_GPG_KEY }}
      MAVEN_GPG_PASSPHRASE: ${{ secrets.MAVEN_GPG_PASSPHRASE }}
      MAVEN_CENTRAL_USERNAME: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
      MAVEN_CENTRAL_TOKEN: ${{ secrets.MAVEN_CENTRAL_TOKEN }}

  # Chained explicitly because the `release: published` event fired by
  # action-gh-release (GITHUB_TOKEN) never triggers downstream workflows
  # (ADR-0265) — release-notes.yml must be called as a reusable workflow.
  release-notes:
    name: Generate release notes
    needs: [version, create-release]
    permissions:
      contents: write
    uses: ./.github/workflows/release-notes.yml
    with:
      version: ${{ needs.version.outputs.version }}
      publish: true
      # ADR-0465: the generate run posts nothing inline — it uploads
      # slack-payload.json as an artifact and the release run's final
      # slack-announce job posts it after the whole pipeline is green.
      slack: false
    # Reusable workflows receive no secrets unless asked (the v0.9.2 run
    # failed fast on the empty FIREWORKS_API_KEY check): exactly the ones
    # this path uses — FIREWORKS_API_KEY for the agent run, and the
    # RELEASE_NOTES_MODEL override (ADR-0618 §3) so the chain honors a
    # repository secret the same as a direct dispatch does. The webhook
    # stays unpassed: slack is false on this call (ADR-0465 — the payload
    # is posted by the release run's own slack-announce job, which reads
    # the repository secret itself), the callee declares the secret
    # optional with a logged skip when unset (LABS-133), and the agent
    # run works over prompt-injectable changelog text — no secret rides
    # along that its path does not need.
    secrets:
      FIREWORKS_API_KEY: ${{ secrets.FIREWORKS_API_KEY }}
      RELEASE_NOTES_MODEL: ${{ secrets.RELEASE_NOTES_MODEL }}
  # ADR-0129's update-website chain is gone: the website lives in the
  # separate relate-web repository (ADR-0546), which pulls what it needs —
  # this repo never pushes content into it. The only handoff is the
  # repository_dispatch poke in the publish-releases-json job below.

  # ADR-0250's release-discovery document, post-gh-pages: releases.json is
  # generated from the live release list and attached to this release's
  # assets together with install.sh (the documented install entry point);
  # relate-web's publish workflow pulls both from there — the assets are
  # the transport, https://relatedb.ai/... stays the canonical URL the CLI
  # pins. Gated on `release-notes` so the narrative notes are already
  # prepended to the release body when the generator copies it, and on
  # `create-release` so the asset list is complete. The repository_dispatch
  # poke is best-effort while relate-web is stood up: without the
  # RELATE_WEB_DISPATCH_TOKEN secret, or before the repository exists, it
  # logs a skip and the release stays green.
  publish-releases-json:
    name: Publish releases.json + notify relate-web
    needs: [version, swift-stamp, create-release, release-notes]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    # Shared with the manual backfill (publish-releases-json.yml): both
    # rewrite the same release asset, a conflict neither resolves.
    concurrency:
      group: publish-releases-json
      cancel-in-progress: false
    steps:
      - name: Patch CVE-2026-111943 (eMudhra CA compromise)
        run: |
          sudo apt-get update
          sudo apt-get install --only-upgrade -y ca-certificates
          sudo update-ca-certificates --fresh
          if find /usr/share/ca-certificates /etc/ssl/certs -iname '*emudhra*' -print -quit | grep -q .; then
            echo "::error::eMudhra root still trusted after CA rebuild (CVE-2026-111943)"
            exit 1
          fi
      # The generator at the stamped release commit (the release publishes
      # with the script it shipped with); distribution carries install.sh
      # and install.ps1.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.swift-stamp.outputs.sha }}
          sparse-checkout: |
            .github/scripts
            distribution

      - name: Generate releases.json
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: .github/scripts/publish-releases-json.sh "$RUNNER_TEMP/releases.json"

      - name: Attach releases.json and the installers to the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          gh release upload "${{ needs.version.outputs.tag }}" \
            "$RUNNER_TEMP/releases.json" distribution/install.sh distribution/install.ps1 --clobber

      # One poke per release (ADR-0546): relate-web's publish workflow
      # pulls releases.json, install.sh, install.ps1 and the release assets it needs;
      # this repo never commits into it. 404 = the repository does not
      # exist yet (or the token cannot see it) — a stated skip, not a
      # failure, until relate-web is stood up. Offline releases never
      # poke: the files are on the release for a later backfill.
      - name: Poke relate-web (repository_dispatch)
        if: ${{ !inputs.offline }}
        env:
          DISPATCH_TOKEN: ${{ secrets.RELATE_WEB_DISPATCH_TOKEN }}
          RELEASE_TAG: ${{ needs.version.outputs.tag }}
        run: |
          set -euo pipefail
          if [ -z "${DISPATCH_TOKEN:-}" ]; then
            echo "::notice::RELATE_WEB_DISPATCH_TOKEN is not set — skipping the relate-web poke; run the Publish releases.json workflow once relate-web is ready."
            exit 0
          fi
          status="$(curl -sS -o "$RUNNER_TEMP/dispatch-body" -w '%{http_code}' \
            -X POST \
            -H "Authorization: Bearer $DISPATCH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            https://api.github.com/repos/relatedb/relate-web/dispatches \
            -d "{\"event_type\":\"relate-release\",\"client_payload\":{\"kind\":\"cli\",\"tag\":\"$RELEASE_TAG\"}}")"
          case "$status" in
            204) echo "relate-web notified: kind=cli tag=$RELEASE_TAG" ;;
            404) echo "::notice::relatedb/relate-web is not reachable (not created yet, or the token cannot see it) — skipping the poke." ;;
            *) echo "::error::repository_dispatch to relatedb/relate-web failed with HTTP $status"; cat "$RUNNER_TEMP/dispatch-body"; exit 1 ;;
          esac

  # Canary the user-facing self-update path (ADR-0358): download the
  # previous stable release's linux-amd64 binary, run `relate upgrade`
  # on that isolated copy, and assert it reports this release's version.
  # Needs create-release because the inner upgrade downloads the new
  # release's assets (the probe-then-fallback route, ADR-0358 §3), so
  # the assets must already exist. It used to be chained after the Pages
  # deploy because the inner upgrade reads the live website releases.json
  # (ADR-0250), which must already list the new version as latest; Pages
  # deploys are paused (2026-11-05), so the smoke now checks that
  # currency itself before downloading anything and skips with a stated
  # reason while the live site lags the release list
  # (self-update-smoke.sh, the live-site currency gate).
  # contents: read covers every read the smoke makes: the release list,
  # the previous release's asset, and the inner upgrade's authenticated API
  # asset route (ADR-0358 §3, required while the repository is internal).
  # A previous release below the v0.12.6 floor (the first release carrying
  # the API-fallback route) cannot self-update while the repository is
  # internal; the script skips that case with a stated reason and exits 0.
  # Offline releases skip the canary entirely: it exists to prove the live
  # website path, which an offline release deliberately does not touch.
  self-update-smoke:
    name: Self-update smoke
    needs: [version, swift-stamp, create-release]
    if: ${{ !inputs.offline }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Patch CVE-2026-111943 (eMudhra CA compromise)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --only-upgrade -y ca-certificates
          sudo update-ca-certificates --fresh
          # Post-condition (remediation assurance): the compromised root
          # must be absent from the rebuilt store -- an on-path attacker
          # replaying validly-signed metadata could otherwise make the
          # upgrade a silent no-op behind a green check. A fixed runner
          # image satisfies this too, so it never false-fails the lane.
          if find /usr/share/ca-certificates /etc/ssl/certs -iname '*emudhra*' -print -quit | grep -q .; then
            echo "::error::eMudhra root still trusted after CA rebuild (CVE-2026-111943)"
            exit 1
          fi
          dpkg-query -W -f='ca-certificates ${Version}' ca-certificates
      # The smoke script at the stamped release commit (the release
      # verifies the script it shipped with), plus scripts/lib: the script
      # unconditionally sources the shared TOML reader for the
      # EXPECTED_VERSION default.
      - name: Checkout the smoke script (sparse)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.swift-stamp.outputs.sha }}
          sparse-checkout: |
            .github/scripts
            scripts/lib
      # ASSET pins the linux-amd64 release asset -- what the ubuntu-latest
      # x86_64 host maps to by default -- so the canary's target is part of
      # the wiring; PREV_TAG stays unset and resolves live to the newest
      # stable CORE tag (vX.Y.Z -- extension-channel releases are never
      # candidates) that is not the expected version.
      - name: Run the self-update smoke
        env:
          GITHUB_TOKEN: ${{ github.token }}
          EXPECTED_VERSION: ${{ needs.version.outputs.version }}
          ASSET: relate-linux-amd64
        run: bash .github/scripts/self-update-smoke.sh

  # The Windows installer end to end against the release just published
  # (ADR-0586): the install.ps1 attached to the release, through
  # `irm | iex`, under Windows PowerShell 5.1 and then PowerShell 7 (the
  # second run replaces the first one's binary). Then the installed
  # relate.exe runs from a process that sees only the persisted PATH, with
  # HOME unset as in stock PowerShell. The metadata seam points at the
  # releases.json attached to the release, so the smoke never waits on the
  # website deploy (relate-web, ADR-0546). The runner image ships the
  # Visual C++ redistributable, so a clean host's missing CRT is the cli
  # job's import check, not this one.
  windows-install-smoke:
    name: Windows install smoke
    needs: [version, publish-releases-json]
    runs-on: windows-latest
    permissions:
      contents: read
    env:
      EXPECTED_VERSION: ${{ needs.version.outputs.version }}
      RELEASE_BASE: https://github.com/${{ github.repository }}/releases/download/${{ needs.version.outputs.tag }}
    steps:
      - name: install.ps1 via irm | iex (Windows PowerShell 5.1)
        shell: powershell
        run: |
          $env:RELATE_RELEASES_JSON_URL = "$env:RELEASE_BASE/releases.json"
          irm "$env:RELEASE_BASE/install.ps1" | iex

      - name: install.ps1 via irm | iex (PowerShell 7, over the first install)
        shell: pwsh
        run: |
          $env:RELATE_RELEASES_JSON_URL = "$env:RELEASE_BASE/releases.json"
          irm "$env:RELEASE_BASE/install.ps1" | iex

      - name: The installed relate.exe from a new shell (HOME unset)
        shell: pwsh
        run: |
          Remove-Item Env:HOME -ErrorAction SilentlyContinue
          $env:Path = [Environment]::GetEnvironmentVariable('Path', 'Machine') + ';' +
            [Environment]::GetEnvironmentVariable('Path', 'User')
          $expected = Join-Path $env:LOCALAPPDATA 'Programs\relate\relate.exe'
          $resolved = (Get-Command relate -CommandType Application | Select-Object -First 1).Path
          if ($resolved -ne $expected) { throw "relate resolves to '$resolved', not $expected" }
          $version = relate --version | Out-String
          if ($LASTEXITCODE -ne 0 -or -not $version.Contains("v$env:EXPECTED_VERSION")) { throw "--version: $version" }
          $out = relate --format csv 'RETURN 1 AS ok' | Out-String
          if ($LASTEXITCODE -ne 0 -or ($out -replace "`r", '') -cne "ok`n1`n") { throw "one-shot query: $out" }
          relate skill install --agent claude-code
          if ($LASTEXITCODE -ne 0) { throw 'skill install failed' }
          $skill = Join-Path $env:USERPROFILE '.claude\skills\relate\SKILL.md'
          if (-not (Test-Path -LiteralPath $skill)) { throw "skill install did not write $skill" }
          $env:RELATE_RELEASES_JSON_URL = "$env:RELEASE_BASE/releases.json"
          relate upgrade --check
          if ($LASTEXITCODE -ne 0) { throw 'upgrade --check failed' }

  # The Windows package channel (ADR-0659 §4). The manifests are generated
  # from the release's own asset manifest: the installer URL is the tagged
  # relate-windows-amd64.exe asset and its sha256 is the published
  # assets.json entry, never a re-derived value. `winget validate` gates the
  # schema before wingetcreate submits the version bump to
  # microsoft/winget-pkgs; a missing WINGET_TOKEN skips the submission with
  # a notice (the channel lives outside this repository), and the
  # winget_dry_run dispatch input stops after validation. Offline releases
  # touch nothing outside GitHub, so they skip the job.
  winget:
    name: winget manifests
    needs: [version, create-release]
    if: ${{ !inputs.offline }}
    # WINGET_TOKEN is environment-scoped like REPO_GPG_KEY above.
    environment: release
    runs-on: windows-latest
    permissions:
      contents: read
    env:
      TAG: ${{ needs.version.outputs.tag }}
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.version.outputs.tag }}

      - name: Download the release asset manifest
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release download $env:TAG --pattern assets.json --dir winget-release

      - name: Generate the winget manifests
        run: >
          python scripts/winget_manifests.py generate
          winget-release/assets.json
          --version $env:VERSION --output winget-manifests

      - name: Validate the manifests with winget
        run: winget validate --manifest winget-manifests

      # The submitter is installed in its own step, pinned to an exact
      # version, so the process that later holds WINGET_TOKEN is a known
      # build: a floating `winget install` inside the token step could run a
      # release published after this one was reviewed.
      - name: Install the pinned wingetcreate
        shell: pwsh
        run: |
          winget install --id Microsoft.WingetCreate --exact --version 1.28.1.0 --silent --accept-package-agreements --accept-source-agreements
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Submit the version bump to microsoft/winget-pkgs
        shell: pwsh
        env:
          WINGET_TOKEN: ${{ secrets.WINGET_TOKEN }}
          DRY_RUN: ${{ inputs.winget_dry_run }}
        run: |
          if ($env:DRY_RUN -eq 'true' -or -not $env:WINGET_TOKEN) {
            if (-not $env:WINGET_TOKEN) { Write-Warning 'WINGET_TOKEN is not set; the winget version bump is not submitted.' }
            python scripts/winget_manifests.py submit winget-manifests --dry-run
            exit 0
          }
          python scripts/winget_manifests.py submit winget-manifests --token $env:WINGET_TOKEN
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

  # ADR-0465: the Slack announcement is the release pipeline's final step.
  # The release-notes run generates the payload early — publish-releases-json
  # and the live site need the prepended notes (ADR-0250) — but
  # posts nothing inline (slack: false): it uploads the payload as the
  # release-notes-slack-payload artifact, and this job posts it only after
  # the whole tail, publish-releases-json and the self-update canary
  # (ADR-0358) included, is green — the payload's message is
  # `relate upgrade`, and the canary is what proves that path. The website
  # lives in relate-web (ADR-0546): the announcement can outrun the live
  # site — releases.json rides the release assets, but `relate upgrade`
  # picks the new version up only after relate-web's publish workflow
  # serves it, and the canary skips (self-update-smoke.sh's currency gate)
  # while the site lags. It re-uses the one Slack-leg policy
  # script (ADR-0125 amendment 2) unchanged: graceful skip when
  # SLACK_WEBHOOK_URL is unset, fail-closed payload validation, and the
  # API-key exfiltration scan. The `release-notes-v<tag>` concurrency group —
  # the same string release-notes.yml serializes its posters on — keeps this
  # POST from overlapping an inline-posting standalone run for the same tag;
  # cancel-in-progress: false because a queued announce must never be
  # cancelled. Offline releases never announce: nothing outside GitHub is
  # touched, so there is nothing to announce yet — a later non-offline
  # release-notes dispatch can post for the same tag.
  slack-announce:
    name: Announce release on Slack
    needs: [version, swift-stamp, release-notes, publish-releases-json, self-update-smoke]
    if: ${{ !inputs.offline }}
    runs-on: ubuntu-latest
    # The announce leg is a CA patch, a sparse checkout, one artifact
    # download and one curl — minutes at most. The bound exists for the
    # group below: a hung job must not hold the repo-global
    # release-notes-v<tag> group (cancel-in-progress: false) away from an
    # inline-posting standalone run for the same tag.
    timeout-minutes: 10
    concurrency:
      group: release-notes-v${{ needs.version.outputs.version }}
      cancel-in-progress: false
    steps:
      - name: Patch CVE-2026-111943 (eMudhra CA compromise)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --only-upgrade -y ca-certificates
          sudo update-ca-certificates --fresh
          # Post-condition (remediation assurance): the compromised root
          # must be absent from the rebuilt store -- an on-path attacker
          # replaying validly-signed metadata could otherwise make the
          # upgrade a silent no-op behind a green check. A fixed runner
          # image satisfies this too, so it never false-fails the lane.
          if find /usr/share/ca-certificates /etc/ssl/certs -iname '*emudhra*' -print -quit | grep -q .; then
            echo "::error::eMudhra root still trusted after CA rebuild (CVE-2026-111943)"
            exit 1
          fi
          dpkg-query -W -f='ca-certificates ${Version}' ca-certificates
      # The Slack policy script at the stamped release commit — the
      # release announces with the script it shipped with (the
      # self-update-smoke precedent). Sparse checkout:
      # release-notes-slack.sh is self-contained.
      - name: Checkout the Slack policy script (sparse)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.swift-stamp.outputs.sha }}
          sparse-checkout: |
            .github/scripts
      # The payload artifact the release-notes run uploaded instead of
      # posting. Restored under target/release-notes so the script is
      # invoked on the exact path release-notes.yml uses.
      - name: Download the generated Slack payload
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-notes-slack-payload
          path: target/release-notes
      - name: Post the announcement to Slack
        env:
          # The announce leg is the active leg by definition: PUBLISH stays
          # true so only a missing SLACK_WEBHOOK_URL can skip the post.
          PUBLISH: 'true'
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          FIREWORKS_API_KEY: ${{ secrets.FIREWORKS_API_KEY }}
        run: .github/scripts/release-notes-slack.sh target/release-notes/slack-payload.json
