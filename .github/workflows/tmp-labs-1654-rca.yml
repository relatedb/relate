name: LABS-1654 q19 profile (scratch)
on:
  pull_request:
    paths: ['.github/workflows/tmp-labs-1654-rca.yml']
env:
  DO_NOT_TRACK: "1"
  RELATE_TELEMETRY: "off"
jobs:
  prof:
    runs-on: linux-4-core-x86
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v7
        with: { path: relate, fetch-depth: 0, persist-credentials: false }
      - uses: actions/checkout@v7
        with:
          repository: relatedb/relate-benchmarks-private
          token: ${{ secrets.BENCHMARKS_READ_TOKEN }}
          path: relate-benchmarks-private
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@1.88.0
      - uses: astral-sh/setup-uv@v6
      - name: Install perf
        run: |
          sudo apt-get update -qq; sudo apt-get install -y linux-tools-common linux-tools-generic linux-tools-azure 2>&1 | tail -1 || true
          sudo sysctl kernel.perf_event_paranoid=-1 kernel.kptr_restrict=0 || true
      - uses: actions/cache/restore@v4
        id: cache
        with:
          path: |
            relate-benchmarks-private/.cache/engines
            relate-benchmarks-private/.cache/bench-env
            relate-benchmarks-private/.cache/pkc/stores
          key: perf1654-v1
      - name: Build after-engine with frame pointers, load if needed
        working-directory: relate-benchmarks-private/benchmarks/pokec
        env:
          RELATE_SRC: ${{ github.workspace }}/relate
          CARGO_PROFILE_RELEASE_DEBUG: line-tables-only
          CARGO_PROFILE_RELEASE_STRIP: none
          RUSTFLAGS: -C force-frame-pointers=yes
        run: |
          echo "cache-hit=${{ steps.cache.outputs.cache-hit }}"
          if [ "${{ steps.cache.outputs.cache-hit }}" != true ]; then ./run.sh fetch; fi
          rm -rf ../../.cache/engines
          ./run.sh env --relate-src "$RELATE_SRC" --relate-rev 657aac43 || true
          ./run.sh load --relate-src "$RELATE_SRC" --relate-rev 657aac43 2>&1 | grep -v -i "token" | tail -3
          ls ../../.cache/engines ../../.cache/pkc/stores
      - name: Queries, explain, profile, perf
        run: |
          B=relate-benchmarks-private
          CLI=$(realpath $(ls $B/.cache/engines/*/relate | head -1))
          STORE=$(realpath $(ls -d $B/.cache/pkc/stores/relate-*-pokec/graph.rl | head -1))
          PERF=$(ls /usr/lib/linux-tools*/perf 2>/dev/null | head -1); [ -n "$PERF" ] || PERF=$(command -v perf); echo "perf=$PERF"
          mkdir -p rca-out
          for n in 19 20 33; do echo "=== q$n text"; cat $B/benchmarks/pokec/queries/q$n.cypher; done > rca-out/queries.txt
          cp "$STORE" "$STORE.exp.rl" 2>/dev/null || cp -r "$STORE" "$STORE.exp.rl"
          for n in 19 20 33; do echo "RETURN 'q$n' AS marker;"; echo "EXPLAIN $(grep -v '^//' $B/benchmarks/pokec/queries/q$n.cypher | tr '\n' ' ');"; done > exp.cypher
          RELATE_MAX_ROWS=0 "$CLI" query -d "$STORE.exp.rl" < exp.cypher > rca-out/explain.txt 2>&1 || true
          rm -rf "$STORE.exp.rl"
          prof() { # tag, script-file
            rm -rf "$STORE.perf.rl"; cp -r "$STORE" "$STORE.perf.rl"
            RELATE_MAX_ROWS=0 sudo -E $PERF record -F 199 --call-graph fp -o rca-out/p-$1.data -- timeout -s KILL 300 "$CLI" query --mode jsonl -d "$STORE.perf.rl" < $2 > rca-out/o-$1.txt 2> rca-out/e-$1.txt || true
            sudo $PERF report -i rca-out/p-$1.data --stdio --no-children -g none --percent-limit 1 2>/dev/null | grep -v '^#' | grep -v '^$' | head -30 > rca-out/self-$1.txt
            sudo $PERF report -i rca-out/p-$1.data --stdio --children -g none --percent-limit 3 2>/dev/null | grep -v '^#' | grep -v '^$' | head -50 > rca-out/children-$1.txt
            sudo rm -f rca-out/p-$1.data; rm -rf "$STORE.perf.rl"
          }
          echo "RETURN 1 AS x;" > base.cypher
          prof base base.cypher
          for n in 19 20 33; do (echo ".timer on"; grep -v '^//' $B/benchmarks/pokec/queries/q$n.cypher) > q$n.cypher; prof q$n q$n.cypher; done
          for n in 19 33; do
            rm -rf "$STORE.pf.rl"; cp -r "$STORE" "$STORE.pf.rl"
            (echo "PROFILE $(grep -v '^//' $B/benchmarks/pokec/queries/q$n.cypher | tr '\n' ' ')") > pf$n.cypher
            RELATE_MAX_ROWS=0 timeout -s KILL 300 "$CLI" query -d "$STORE.pf.rl" < pf$n.cypher > rca-out/profile-q$n.txt 2>&1 || true
            rm -rf "$STORE.pf.rl"
          done
      - name: Report
        if: always()
        run: |
          cd rca-out 2>/dev/null || exit 0
          for f in queries.txt explain.txt; do echo "##### $f"; head -c 6000 $f; done
          for t in base q19 q20 q33; do echo "##### SELF $t"; cat self-$t.txt; echo "##### CHILDREN $t"; cat children-$t.txt; done
          for n in 19 33; do echo "##### PROFILE q$n"; head -c 5000 profile-q$n.txt; done
          for t in q19 q20 q33; do echo "##### out-lines $t"; tail -c 600 o-$t.txt; tail -c 300 e-$t.txt; done
