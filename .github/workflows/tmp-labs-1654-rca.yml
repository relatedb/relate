name: LABS-1654 q19 profile (scratch)
on:
  pull_request:
    paths: ['.github/workflows/tmp-labs-1654-rca.yml', '.rca/**']
env:
  DO_NOT_TRACK: "1"
  RELATE_TELEMETRY: "off"
jobs:
  prof:
    runs-on: linux-4-core-x86
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v7
        with: { path: relate, fetch-depth: 0, persist-credentials: false }
      - uses: actions/checkout@v7
        with:
          repository: relatedb/relate-benchmarks-private
          token: ${{ secrets.BENCHMARKS_READ_TOKEN }}
          path: relate-benchmarks-private
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@1.88.0
      - uses: astral-sh/setup-uv@v6
      - name: Install perf
        run: |
          sudo apt-get update -qq; sudo apt-get install -y linux-tools-common linux-tools-generic linux-tools-azure 2>&1 | tail -1 || true
          sudo sysctl kernel.perf_event_paranoid=-1 kernel.kptr_restrict=0 || true
      - uses: actions/cache@v4
        id: cache
        with:
          path: |
            relate-benchmarks-private/.cache/engines
            relate-benchmarks-private/.cache/bench-env
            relate-benchmarks-private/.cache/pkc/stores
          key: perf1654-v2
      - name: Fetch, build both engines, load
        working-directory: relate-benchmarks-private/benchmarks/pokec
        env:
          RELATE_SRC: ${{ github.workspace }}/relate
        run: |
          echo "cache-hit=${{ steps.cache.outputs.cache-hit }}"
          if [ "${{ steps.cache.outputs.cache-hit }}" != true ]; then ./run.sh fetch; fi
          ./run.sh env --relate-src "$RELATE_SRC" --relate-rev 39a9b627 || true
          ./run.sh env --relate-src "$RELATE_SRC" --relate-rev 657aac43 || true
          ./run.sh load --relate-src "$RELATE_SRC" --relate-rev 657aac43 2>&1 | grep -v -i "token" | tail -3
          ls ../../.cache/engines ../../.cache/pkc/stores
      - name: Env bisect
        run: |
          B=relate-benchmarks-private
          ls $B/.cache/engines
          STORE=$(realpath $(ls -d $B/.cache/pkc/stores/relate-*-pokec/graph.rl | head -1))
          Q=$(realpath $B/benchmarks/pokec/queries)
          (echo ".timer on"; grep -v '^//' $Q/q19.cypher) > q19.cypher
          run() { # label, engine-dir, prefix...
            lab=$1; e=$2; shift 2
            CLI=$(realpath $e/relate)
            rm -rf "$STORE.w.rl"; cp -r "$STORE" "$STORE.w.rl"
            echo "=== $(basename $e) $lab"
            ( "$@" /usr/bin/time -f "WALL %e s" "$CLI" query --mode jsonl -d "$STORE.w.rl" < q19.cypher | grep -E "^Time" ) 2>&1 | tail -3
            rm -rf "$STORE.w.rl"
          }
          for e in $B/.cache/engines/*/; do
            case $(basename $e) in *g39a9b62*|*g657aac4*) ;; *) continue;; esac
            run unset-maxrows $e env -u RELATE_MAX_ROWS
            run maxrows0 $e env RELATE_MAX_ROWS=0
            run sudo-plain $e sudo
            run sudo-timeout $e sudo timeout -s KILL 300
          done
