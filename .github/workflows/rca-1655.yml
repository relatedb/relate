name: LABS-1655 pokec before/after (scratch)
on:
  pull_request:
    paths: ['.github/workflows/rca-1655.yml', '.rca/**']
env:
  DO_NOT_TRACK: "1"
  RELATE_TELEMETRY: "off"
permissions:
  contents: read
jobs:
  rca:
    runs-on: linux-4-core-x86
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v7
        with: { path: relate, fetch-depth: 0, persist-credentials: false }
      - uses: actions/checkout@v7
        with:
          repository: relatedb/relate-benchmarks-private
          token: ${{ secrets.BENCHMARKS_READ_TOKEN }}
          path: relate-benchmarks-private
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@1.88.0
      - uses: astral-sh/setup-uv@v6
      - uses: actions/cache@v4
        id: cache
        with:
          path: |
            relate-benchmarks-private/.cache/engines
            relate-benchmarks-private/.cache/bench-env
            relate-benchmarks-private/.cache/pkc/stores
          key: rca1655-v3-${{ github.event.pull_request.head.sha }}
          restore-keys: |
            rca1655-v3-
            rca1655-v1-
      - name: Ensure engine and store (cache normally hits)
        working-directory: relate-benchmarks-private/benchmarks/pokec
        env:
          RELATE_SRC: ${{ github.workspace }}/relate
        run: |
          ls -d ../../.cache/engines/*/ ../../.cache/pkc/stores/*/ || true
          if ! ls ../../.cache/engines/1.0.2-gf6589cb/relate >/dev/null 2>&1 || ! ls -d ../../.cache/pkc/stores/relate-*-pokec/graph.rl >/dev/null 2>&1; then
            ./run.sh fetch || true
            ./run.sh env --relate-src "$RELATE_SRC" --relate-rev f6589cbd75208a92a4755ccf91c083c27369badf || true
            ./run.sh load --relate-src "$RELATE_SRC" --relate-rev f6589cbd75208a92a4755ccf91c083c27369badf 2>&1 | grep -v -i token | tail -3
          fi
      - name: Time q28 and q27 in-process (no perf, no sudo)
        run: |
          B=relate-benchmarks-private
          CLI=$(realpath $B/.cache/engines/1.0.2-gf6589cb/relate)
          STORE=$(realpath $(ls -d $B/.cache/pkc/stores/relate-*-pokec/graph.rl | head -1))
          mkdir -p rca-out
          for n in 28 27 28; do
            rm -rf "$STORE.t.rl"; cp "$STORE" "$STORE.t.rl"
            { echo ".timer on"; grep -v '^//' $B/benchmarks/pokec/queries/q$n.cypher; } > q.cypher
            echo "=== q$n (comment lines stripped)"; cat q.cypher | head -8
            RELATE_MAX_ROWS=0 /usr/bin/time -v timeout -s KILL 400 "$CLI" query --mode jsonl -d "$STORE.t.rl" < q.cypher > rca-out/t$n.out 2> rca-out/t$n.err || echo "rc=$?"
            grep -E "Elapsed|User time|System time|Maximum resident|Exit status" rca-out/t$n.err
            grep -iE "elapsed_ms|execute_ms|timer|planCache" rca-out/t$n.err rca-out/t$n.out | head -6
            head -c 400 rca-out/t$n.out; echo
            rm -rf "$STORE.t.rl"
          done
      - name: Baseline RETURN 1
        run: |
          B=relate-benchmarks-private
          CLI=$(realpath $B/.cache/engines/1.0.2-gf6589cb/relate)
          STORE=$(realpath $(ls -d $B/.cache/pkc/stores/relate-*-pokec/graph.rl | head -1))
          cp "$STORE" "$STORE.b.rl"
          printf '.timer on\nRETURN 1 AS x;\n' | RELATE_MAX_ROWS=0 /usr/bin/time -v "$CLI" query --mode jsonl -d "$STORE.b.rl" 2>&1 | grep -E "Elapsed|User time|System time|Maximum resident|elapsed_ms"
