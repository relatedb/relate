name: LABS-1655 pokec before/after (scratch)
on:
  pull_request:
    paths: ['.github/workflows/rca-1655.yml', '.rca/**']
env:
  DO_NOT_TRACK: "1"
  RELATE_TELEMETRY: "off"
permissions:
  contents: read
jobs:
  rca:
    runs-on: linux-4-core-x86
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v7
        with: { path: relate, fetch-depth: 0, persist-credentials: false }
      - uses: actions/checkout@v7
        with:
          repository: relatedb/relate-benchmarks-private
          token: ${{ secrets.BENCHMARKS_READ_TOKEN }}
          path: relate-benchmarks-private
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@1.88.0
      - uses: astral-sh/setup-uv@v6
      - uses: actions/cache@v4
        id: cache
        with:
          path: |
            relate-benchmarks-private/.cache/engines
            relate-benchmarks-private/.cache/bench-env
            relate-benchmarks-private/.cache/pkc/stores
          key: rca1655-v1-${{ github.event.pull_request.head.sha }}
          restore-keys: rca1655-v1-
      - name: Fetch, build before engine, load store
        working-directory: relate-benchmarks-private/benchmarks/pokec
        env:
          RELATE_SRC: ${{ github.workspace }}/relate
          BEFORE_REV: 39a9b627c63fd3b2cfdec0c1e0428f98e01fbc17
        run: |
          ./run.sh fetch || true
          ./run.sh env --relate-src "$RELATE_SRC" --relate-rev "$BEFORE_REV" || true
          ./run.sh load --relate-src "$RELATE_SRC" --relate-rev "$BEFORE_REV" 2>&1 | grep -v -i "token" | tail -5
          ls ../../.cache/engines/*/relate | xargs realpath > ../../../engines-before.txt
          cat ../../../engines-before.txt
      - name: Build after engine
        working-directory: relate-benchmarks-private/benchmarks/pokec
        env:
          RELATE_SRC: ${{ github.workspace }}/relate
          AFTER_REV: ${{ github.event.pull_request.head.sha }}
        run: |
          ./run.sh env --relate-src "$RELATE_SRC" --relate-rev "$AFTER_REV" 2>&1 | tail -3 || true
          ls ../../.cache/engines/*/relate | xargs realpath > ../../../engines-after.txt
          cat ../../../engines-after.txt
      - name: Measure
        env:
          RCA_TIMEOUT: '330'
          RCA_PLAN: '{"before":[16,17,18,23,24,25,26,27,29,32,34,19,20,33,28],"after":[16,17,18,23,24,25,26,27,28,29,32,34,19,20,33]}'
        run: |
          B=relate-benchmarks-private
          NEWENG=$(comm -13 <(sort engines-before.txt) <(sort engines-after.txt) | head -1)
          OLDENG=$(head -1 engines-before.txt)
          echo "before=$OLDENG after=$NEWENG"
          test -n "$NEWENG"
          STORE=$(ls -d $B/.cache/pkc/stores/relate-*-pokec/graph.rl | head -1)
          python3 -I relate/.rca/measure.py "$(realpath $OLDENG)" "$(realpath $NEWENG)" "$(realpath $STORE)" "$(realpath $B/benchmarks/pokec/queries)" "$(realpath rca-out)" 2>&1 | tail -60
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rca-1655
          path: |
            rca-out/results.json
          retention-days: 7
