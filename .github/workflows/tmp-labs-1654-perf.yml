name: LABS-1654 perf before/after (scratch)
on:
  pull_request:
    paths: ['.github/workflows/tmp-labs-1654-perf.yml', '.rca/**']
env:
  DO_NOT_TRACK: "1"
  RELATE_TELEMETRY: "off"
jobs:
  perf:
    runs-on: linux-4-core-x86
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v7
        with: { path: relate, fetch-depth: 0, persist-credentials: false }
      - uses: actions/checkout@v7
        with:
          repository: relatedb/relate-benchmarks-private
          token: ${{ secrets.BENCHMARKS_READ_TOKEN }}
          path: relate-benchmarks-private
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@1.88.0
      - uses: astral-sh/setup-uv@v6
      - uses: actions/cache@v4
        id: cache
        with:
          path: |
            relate-benchmarks-private/.cache/engines
            relate-benchmarks-private/.cache/bench-env
            relate-benchmarks-private/.cache/pkc/stores
          key: perf1654-v1
      - name: Fetch, build both engines, load
        working-directory: relate-benchmarks-private/benchmarks/pokec
        env:
          RELATE_SRC: ${{ github.workspace }}/relate
        run: |
          if [ "${{ steps.cache.outputs.cache-hit }}" != true ]; then ./run.sh fetch; fi
          ./run.sh env --relate-src "$RELATE_SRC" --relate-rev 39a9b627 || true
          ./run.sh env --relate-src "$RELATE_SRC" --relate-rev 657aac43 || true
          ./run.sh load --relate-src "$RELATE_SRC" --relate-rev 657aac43 2>&1 | grep -v -i "token" | tail -5
          ls ../../.cache/engines
      - name: Measure before and after
        env:
          RCA_QIDS: '16,17,18,19,20,33,34'
          RCA_TIMEOUT: '200'
        run: |
          B=relate-benchmarks-private
          STORE=$(realpath $(ls -d $B/.cache/pkc/stores/relate-*-pokec/graph.rl | head -1))
          for rev in 39a9b627 657aac43; do
            CLI=$(realpath $(ls $B/.cache/engines/*$rev*/relate | head -1))
            echo "rev=$rev cli=$CLI"
            python3 -I relate/.rca/measure.py "$CLI" "$STORE" "$(realpath $B/benchmarks/pokec/queries)" "$(realpath rca-out)/$rev" 2>&1 | tail -12
          done
      - name: Summary
        if: always()
        run: |
          python3 -I - <<'PY'
          import json,glob
          for f in sorted(glob.glob('rca-out/*/results.json')):
              r=json.load(open(f)); print(f)
              for k,v in r.items():
                  print(' ',k, v['wall_s'], 'TIMEOUT' if v['timeout'] else 'ok', 'hwm_mib', v['hwm_mib'], 'rc', v['rc'], 'lines', v['out_lines'])
          PY
