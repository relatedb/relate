name: Windows Authenticode signing
description: >-
  Sign a built Windows executable with an Authenticode signature carrying an
  RFC 3161 timestamp, then verify it on the runner. The signature is produced
  remotely by DigiCert Software Trust Manager through DigiCert's official
  signing action, pinned by commit SHA: in simple-signing mode the action
  authenticates a DigiCert ONE API user from the API key, client certificate
  and client-certificate password passed as step env (a composite action
  cannot read repository secrets directly) and signs with a keypair held in
  DigiCert's key management, selected by its alias — no code-signing
  certificate material exists on the runner. The runner-side verification
  then pins the exact signing certificate by comparing the signature's
  signer thumbprint with the fingerprint held as a repository variable.
  Implements ADR-0594. Before signing, a preflight `smctl healthcheck`
  step — smctl from the vendor action's CDN location but verified
  against a SHA-256 pinned in this action (moved only by an explicit
  bump), its report classified by
  `scripts/check-smctl-healthcheck.sh` — proves both authentication
  factors, so a credentials failure surfaces as a diagnosis naming the
  secret to fix instead of DigiCert's bare sign-time 403. While the API
  key is unset the action skips with a warning and leaves the binary
  untouched (ADR-0594); once it is set the leg fails closed.

inputs:
  binary:
    description: Path to the already-built Windows executable to sign
    required: true

runs:
  # Composite steps each run in their own shell, so the steps share state
  # through $GITHUB_ENV: the validation step exports WINDOWS_SIGN_SKIP,
  # which gates the sign step's condition and is read back by the verify
  # step.
  using: composite
  steps:
    - name: Validate signing credentials
      shell: bash
      # Skip-open, then fail closed (ADR-0594): with the DigiCert API key
      # unset the leg ships the binary as built behind a prominent warning;
      # with it set, every companion credential must be present too — a
      # half-configured leg must fail, never ship an unsigned binary from a
      # green run. WINDOWS_SIGN_SKIP is written explicitly on every path,
      # so no job-wide inherited value can skip a credentialed leg or
      # un-skip the steps that follow.
      run: |
        set -euo pipefail
        if [ -z "${SM_API_KEY:-}" ]; then
          echo "::warning::SM_API_KEY is not set - skipping Windows Authenticode signing; the binary ships as built (ADR-0594)."
          echo "WINDOWS_SIGN_SKIP=1" >> "$GITHUB_ENV"
          exit 0
        fi
        missing=()
        for var in SM_API_KEY SM_HOST SM_CLIENT_CERT_FILE SM_CLIENT_CERT_PASSWORD WINDOWS_SIGN_KEYPAIR_ALIAS WINDOWS_SIGN_CERT_FINGERPRINT; do
          if [ -z "${!var:-}" ]; then
            missing+=("$var")
          fi
        done
        if [ "${#missing[@]}" -gt 0 ]; then
          echo "SM_API_KEY is set but ${missing[*]} are not; refusing to ship an unsigned Windows binary (ADR-0594)." >&2
          exit 1
        fi
        # Credentials complete: clear any inherited skip flag so a
        # job-wide WINDOWS_SIGN_SKIP=1 cannot silently skip signing.
        echo "WINDOWS_SIGN_SKIP=0" >> "$GITHUB_ENV"

    - name: Preflight the DigiCert credentials (smctl healthcheck)
      # `smctl sign` answers a 1FA-authenticated session — API key without
      # an accepted client certificate — with a bare 403 ("User is not
      # multi-factor authenticated. Missing Client Authentication
      # Certificate.") that names neither the failing credential nor the
      # remedy; the first credentialed release run died on exactly that.
      # DigiCert's own CI guidance is to run `smctl healthcheck` first:
      # the same SM_* authentication, but a report that says which factor
      # failed. smctl comes from the same CDN the pinned vendor action
      # installs it from, but this step is hand-rolled — not inside a
      # SHA-pinned action — so ADR-0594's same-origin-sidecar acceptance
      # does not carry over: the binary is verified against a digest
      # pinned in this repo, moved only by an explicit bump (RELEASING.md,
      # "Windows signing"), the same rule as the action SHA pins. The
      # classifier (scripts/check-smctl-healthcheck.sh) turns the report
      # into the repo-side remedy — which secret to fix — so a
      # credentials failure is a diagnosis on the leg, not a raw 403.
      if: ${{ env.WINDOWS_SIGN_SKIP != '1' }}
      shell: bash
      run: |
        set -euo pipefail
        sm_dir="$RUNNER_TEMP/smctl-preflight"
        mkdir -p "$sm_dir"
        # The repo pin, not the CDN's own sidecar: /stm/latest/ is a
        # floating name, and the digest below is what makes it safe. It
        # moves only by an explicit bump, like the action SHA pins.
        smctl_sha256=811f5e5e6cc4b13d0956d4b6ad902eb6567135fd7d11cee08c1f3adabfa8efa7
        curl --proto '=https' --proto-redir '=https' --tlsv1.2 --retry 10 --retry-connrefused \
          --location --silent --show-error --fail \
          --output "$sm_dir/smctl.exe" \
          https://pki-downloads.digicert.com/stm/latest/smctl.exe
        # Git-Bash's sha256sum can emit MSYS-mangled output (a leading
        # backslash before the hash), so take the first 64 hex characters
        # of the stream — always the digest, whatever prefixes or path
        # mangling surround it.
        actual=$(sha256sum "$sm_dir/smctl.exe" | tr -cd '0-9a-f' | cut -c1-64)
        if [ "$smctl_sha256" != "$actual" ]; then
          echo "::error::smctl digest mismatch: repo pin says $smctl_sha256, CDN served $actual — bump the pin deliberately (RELEASING.md, Windows signing)"
          exit 1
        fi
        # The healthcheck authenticates through both factors; a 1FA
        # report may exit non-zero, so the classifier reads the report,
        # not the exit code.
        "$sm_dir/smctl.exe" healthcheck > "$sm_dir/healthcheck.txt" 2>&1 || true
        bash scripts/check-smctl-healthcheck.sh "$sm_dir/healthcheck.txt"

    - name: Clean up the preflight scratch (always)
      # The healthcheck report names the certificate path and (masked)
      # credential values; it never outlives the leg. The decoded .p12
      # stays the caller's to clean (ADR-0594) — this action's own
      # scratch is its own.
      if: always() && env.WINDOWS_SIGN_SKIP != '1'
      shell: bash
      run: rm -rf "$RUNNER_TEMP/smctl-preflight"

    - name: Sign the binary
      # DigiCert's official signing action (ADR-0594), pinned by full commit
      # SHA with the release it names in the version comment — never a
      # floating @vN tag, the same supply-chain rule every third-party
      # action in the release workflows follows. The pin moves solely by
      # an explicit SHA bump (RELEASING.md). Simple-signing mode installs
      # and runs nothing but DigiCert's smctl client, which signs remotely
      # through DigiCert's key management — no third-party signing tool,
      # no KSP library, no Windows certificate-store sync — with the
      # timestamp input enabled (RFC 3161, ADR-0594) and
      # zero-exit-code-on-failure left off, so any signing failure,
      # including the user not being authorized as a signer on the
      # keypair, fails this step. The vendor action selects the keypair
      # by its alias alone, which is why the runner-side thumbprint
      # verification below — not the sign step — pins the exact signing
      # certificate.
      uses: digicert/code-signing-software-trust-action@fae23a455ba4bde62b64fd7cb2f81ade788f5a95 # v1.2.1
      if: ${{ env.WINDOWS_SIGN_SKIP != '1' }}
      with:
        simple-signing-mode: true
        input: ${{ inputs.binary }}
        keypair-alias: ${{ env.WINDOWS_SIGN_KEYPAIR_ALIAS }}
        digest-alg: SHA256
        timestamp: true
        zero-exit-code-on-failure: false
      env:
        # The SM_* contract smctl reads (DigiCert's documented CI pattern),
        # re-exported from the caller's step env so the credential flow into
        # the vendor action is explicit. Never trace credentials: they live
        # in the environment only, never on the command line (ADR-0594).
        SM_HOST: ${{ env.SM_HOST }}
        SM_API_KEY: ${{ env.SM_API_KEY }}
        SM_CLIENT_CERT_FILE: ${{ env.SM_CLIENT_CERT_FILE }}
        SM_CLIENT_CERT_PASSWORD: ${{ env.SM_CLIENT_CERT_PASSWORD }}

    - name: Verify the signature
      shell: pwsh
      env:
        BINARY: ${{ inputs.binary }}
      # The authoritative gate (ADR-0594): a signature that is not Valid,
      # carries no RFC 3161 timestamp, or was not made by the pinned
      # certificate fails the leg before the upload — an unverified binary
      # must never leave the runner as green.
      run: |
        if ($env:WINDOWS_SIGN_SKIP -eq '1') { exit 0 }
        $ErrorActionPreference = 'Stop'
        $signature = Get-AuthenticodeSignature -FilePath $env:BINARY
        if ($signature.Status -ne [System.Management.Automation.SignatureStatus]::Valid) {
          Write-Error "Authenticode verification failed: status '$($signature.Status)' ($($signature.StatusMessage))."
          exit 1
        }
        if ($null -eq $signature.TimeStamperCertificate) {
          Write-Error "Authenticode signature is Valid but carries no RFC 3161 timestamp."
          exit 1
        }
        # Both sides normalized to uppercase hex without spaces: Windows
        # formats a certificate thumbprint that way, while the fingerprint
        # copied from DigiCert ONE may arrive in the issuer's formatting.
        # The vendor action signs with whatever certificate the keypair
        # alias resolves to, so this comparison is what proves the binary
        # was signed by exactly the pinned certificate (ADR-0594).
        $expected = ($env:WINDOWS_SIGN_CERT_FINGERPRINT -replace ' ', '').ToUpperInvariant()
        $actual = ($signature.SignerCertificate.Thumbprint -replace ' ', '').ToUpperInvariant()
        if ($actual -ne $expected) {
          Write-Error "Authenticode signature is Valid but its signer certificate thumbprint is $actual, not the pinned WINDOWS_SIGN_CERT_FINGERPRINT $expected (ADR-0594)."
          exit 1
        }
        Write-Output 'Authenticode signature verified on the runner: status Valid, RFC 3161 timestamp present, signer thumbprint matches the pinned fingerprint.'
