name: npm publish
description: >-
  Publish npm tarballs from a local directory to the registry with
  provenance via trusted publishing (OIDC). Implements the publish half of
  ADR-0278: the calling job must grant `id-token: write` and carry no
  NODE_AUTH_TOKEN. Shared by publish-registries.yml's npm jobs so the
  setup/count-check/publish body exists exactly once; the caller downloads
  the tarballs (from the GitHub release's assets) into `dir` first.

inputs:
  dir:
    description: Directory holding the .tgz tarballs to publish
    required: true
  expected-count:
    description: >-
      Exact number of .tgz tarballs the include/exclude filter must
      select; the publish fails closed on any other count
    required: true
  include:
    description: >-
      Extended-regex a tarball's basename must match to be selected;
      empty selects everything
    required: false
    default: ''
  exclude:
    description: >-
      Extended-regex a tarball's basename must NOT match to be selected;
      empty excludes nothing
    required: false
    default: ''
  dry-run:
    description: Run npm publish with --dry-run (validate, publish nothing)
    required: false
    default: 'false'

runs:
  using: composite
  steps:
    - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
      with:
        node-version: '22'

    # npm >= 11.5.1 is required for OIDC trusted publishing (ADR-0278). Pin
    # the major instead of tracking `latest` so a future npm release cannot
    # change publish behavior mid-pipeline.
    - name: Upgrade npm for trusted publishing
      shell: bash
      run: npm install -g npm@11

    - name: npm publish
      shell: bash
      env:
        DIR: ${{ inputs.dir }}
        EXPECTED_COUNT: ${{ inputs.expected-count }}
        INCLUDE: ${{ inputs.include }}
        EXCLUDE: ${{ inputs.exclude }}
        DRY_RUN: ${{ inputs.dry-run }}
        REPO_VISIBILITY: ${{ github.event.repository.visibility }}
      run: |
        set -euo pipefail
        shopt -s nullglob
        tarballs=()
        for tgz in "$DIR"/*.tgz; do
          base="$(basename "$tgz")"
          if [ -n "$INCLUDE" ] && ! [[ "$base" =~ $INCLUDE ]]; then
            continue
          fi
          if [ -n "$EXCLUDE" ] && [[ "$base" =~ $EXCLUDE ]]; then
            continue
          fi
          tarballs+=("$tgz")
        done
        if [ "${#tarballs[@]}" -ne "$EXPECTED_COUNT" ]; then
          echo "expected $EXPECTED_COUNT npm tarball(s) in $DIR (include='$INCLUDE' exclude='$EXCLUDE'), found ${#tarballs[@]}" >&2
          printf '%s\n' "${tarballs[@]}" >&2
          exit 1
        fi
        args=(--access public)
        # npm rejects provenance-backed publishes from non-public source
        # repositories (422 "Unsupported GitHub Actions source repository
        # visibility"; run 43022331128): attach the sigstore bundle only
        # when the repository is public — it resumes automatically when
        # the repo flips. Empty visibility fails safe (no provenance,
        # never a 422). The assets' own build-provenance attestation
        # (release.yml's, verified before this action runs) is unaffected.
        if [ "$REPO_VISIBILITY" = "public" ]; then
          args+=(--provenance)
        fi
        if [ "$DRY_RUN" = "true" ]; then
          args+=(--dry-run)
        fi
        for tgz in "${tarballs[@]}"; do
          # The ./ prefix is load-bearing: npm 11's spec parser reads a
          # bare `dir/file.tgz` (one slash) as a GitHub user/repo
          # shorthand and tries git ls-remote on it; ./ pins the spec to
          # a local file. The release's npm smoke gate never hit this
          # because its dir makes every glob already start with ./.
          #
          # A re-dispatch after an interrupted run must be able to finish
          # the loop: a tarball whose version already landed in an
          # earlier attempt is done, not a failure — skip it on the
          # registry's own republish rejection instead of failing the
          # job (the same arm the crates.io loop carries). The pattern
          # must stay narrow: an auth 403 shares the error code but not
          # the message, and it must still fail closed.
          if out="$(npm publish "./$tgz" "${args[@]}" 2>&1)"; then
            printf '%s\n' "$out"
          elif printf '%s\n' "$out" | grep -qiE 'cannot publish over|EPUBLISHCONFLICT'; then
            echo "$(basename "$tgz"): version already on the registry — skipping"
          else
            printf '%s\n' "$out" >&2
            echo "npm publish $(basename "$tgz") failed" >&2
            exit 1
          fi
        done
