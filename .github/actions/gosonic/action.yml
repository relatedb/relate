name: Run a Sonic stage
description: >-
  Download the gosonic binary built by the sonic-init job and run one stage
  or suite from .sonic/ci.yml. The calling job must need sonic-init and must
  already have checked out Relate. rust-cache restores the same shared
  keys the pre-Sonic lanes used, then the stage's cargo volume is seeded
  from that restore and copied back before rust-cache saves.

inputs:
  stage:
    description: Stage or suite name in .sonic/ci.yml
    required: true
  matrix:
    description: Optional gosonic --matrix value, for example shard=engine
    required: false
    default: ""
  jobs:
    description: How many stages to run at once (gosonic --jobs)
    required: false
    default: "1"
  rust-cache:
    description: >-
      Restore and save Swatinem/rust-cache around the stage. Requires
      cache-target, the cargo-target volume subdirectory the stage writes.
      Where a bind works (CI), the volumes ARE the host trees and the stage
      writes through; elsewhere the trees are copied across (sonic-cache-sync).
    required: false
    default: "false"
  cache-target:
    description: >-
      Subdirectory of the cargo-target volume (the stage CARGO_TARGET_DIR
      under /cargo-target). Example: test-engine, corpus, bolt-lib-1.
    required: false
    default: ""
  cache-shared-key:
    description: rust-cache shared-key. Empty uses the plain per-job key.
    required: false
    default: ""
  cache-save-if-cold-only:
    description: Save the shared key only on a cold miss.
    required: false
    default: "false"
  cache-workspace-crates:
    description: Cache workspace crate artifacts, not only third-party deps.
    required: false
    default: "false"
  sccache:
    description: Passed through to setup-rust-ci. Part of the cache env hash.
    required: false
    default: "true"
  free-disk:
    description: Passed through to setup-rust-ci.
    required: false
    default: "true"
  free-disk-aggressive:
    description: Passed through to setup-rust-ci.
    required: false
    default: "false"
  mold:
    description: Passed through to setup-rust-ci. Part of the cache env hash.
    required: false
    default: "true"

runs:
  using: composite
  steps:
    # Before the Sonic run so the restore lands on the host, and so the
    # rust-cache post step (the save) runs after the copy-back below.
    # Mold and sccache are passed through because both are hashed into the
    # cache key; the Sonic image already links with mold.
    - uses: ./.github/actions/setup-rust-ci
      if: inputs.rust-cache == 'true'
      with:
        sccache: ${{ inputs.sccache }}
        free-disk: ${{ inputs.free-disk }}
        free-disk-aggressive: ${{ inputs.free-disk-aggressive }}
        mold: ${{ inputs.mold }}
        cache-shared-key: ${{ inputs.cache-shared-key }}
        cache-save-if-cold-only: ${{ inputs.cache-save-if-cold-only }}
        cache-workspace-crates: ${{ inputs.cache-workspace-crates }}

    - uses: actions/download-artifact@v7
      with:
        name: gosonic
        path: ${{ runner.temp }}/gosonic-bin

    - name: Seed Sonic cargo volumes from rust-cache
      if: inputs.rust-cache == 'true' && success()
      shell: bash
      run: bash scripts/sonic-cache-sync.sh seed "${{ inputs.cache-target }}"

    - name: Run Sonic stage
      shell: bash
      env:
        # Stages that download a GitHub release list this name under
        # secrets (.sonic/ci.yml). The public releases/download URL is
        # anonymous even with a header, so the scripts use the API.
        GITHUB_TOKEN: ${{ github.token }}
      run: |
        install -m 0755 "${{ runner.temp }}/gosonic-bin/gosonic" /usr/local/bin/gosonic
        args=(ci run --jobs "${{ inputs.jobs }}")
        if [[ -n "${{ inputs.matrix }}" ]]; then
          args+=(--matrix "${{ inputs.matrix }}")
        fi
        args+=("${{ inputs.stage }}")
        bash scripts/gosonic-run.sh "${args[@]}"

    - name: Copy Sonic cargo volumes back to rust-cache
      if: inputs.rust-cache == 'true' && success()
      shell: bash
      run: bash scripts/sonic-cache-sync.sh save "${{ inputs.cache-target }}"
