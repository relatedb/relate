[package]
name = "relate-executor"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "In-memory graph and Cypher physical executor"
license.workspace = true
repository.workspace = true

[features]
# Research-only speed-of-light kernels (graph/sol.rs) and their
# re-exports: quarantined behind this non-default feature (ADR-0476) —
# off in every bundle and the WASM build, absent from every default
# build of the engine. The QPP-frontier half of the original quarantine
# retired with its prototype (ADR-0478): the production frontier-NFA
# kernel in `exec/kernels/` replaced `graph/qpp.rs`.
research = []
# Test-only observation seams a dependent crate's integration tests read
# across the crate boundary (LABS-1112's whole-graph index-rebuild count;
# `cfg(test)` items do not exist for a dependent's tests). Off in every
# bundle; a dependent enables it from its `[dev-dependencies]`, the
# `vfs_walk` precedent in relate-test-support.
test-hooks = []

[dependencies]
# The PROFILE clock must read on wasm32 too, not trap (std Instant panics).
web-time = { workspace = true }
relate-engine-api = { workspace = true }
relate-error = { workspace = true }
relate-model = { workspace = true }
relate-parser = { workspace = true }
chrono = { workspace = true }
relate-core = { workspace = true }
relate-front = { workspace = true }
relate-ir = { workspace = true }
# ADR-0509 §4: the IR's name fields carry SmallName; reads bridge via with_str.
relate-names = { workspace = true }
relate-ontology = { workspace = true }
relate-planner = { workspace = true }
relate-catalog = { workspace = true }
indexmap = { workspace = true }
rand = { workspace = true }
regex = { workspace = true }
unicode-normalization = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
dashmap = { workspace = true }
rustc-hash = { workspace = true }
xxhash-rust = { workspace = true }
# ADR-0549: the POINT index's R*-tree backend.
rstar = { workspace = true }

[dev-dependencies]
relate-test-support = { workspace = true, features = ["nested_eval"] }
tempfile = { workspace = true }
# Property-testing harness for the commit-uniqueness admission semantics
# (ADR-0268 pin, extended to this crate by ADR-0439). Dev-only: never compiled
# into the library or the released artifact. Same version pin as
# `relate-storage`, and its rand requirement unifies with the workspace's
# rand (ADR-0360).
proptest = { workspace = true }
