[package]
name = "relate-parser"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Cypher lexer, parser, and AST for the Relate graph database"

[dependencies]
relate-model = { workspace = true }
# ADR-0509 §4: the AST's name fields carry SmallName (stage 1); one edge on
# the dependency-free leaf, R1-legal.
relate-names = { workspace = true }

[dev-dependencies]
relate-test-support = { workspace = true }
# Drift guard for the generated Unicode tables (ADR-0182). Dev-only: the
# canonical SHA-256 replaces the hand-rolled test helper and is never compiled
# into the shipped engine (precedent: relate-storage's tempfile/proptest,
# ADR-0268).
sha2 = { workspace = true }
