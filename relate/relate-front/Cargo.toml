[package]
name = "relate-front"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "Relate parser front-end lowered to planner IR"
license.workspace = true
repository.workspace = true

[dependencies]
relate-error = { workspace = true }
# ADR-0509 §4: the front's lowering carries SmallName AST→IR by copy (stage
# 3); one edge on the dependency-free leaf, R1-legal.
relate-names = { workspace = true }
relate-model = { workspace = true }
relate-parser = { workspace = true }
relate-core = { workspace = true }
relate-ir = { workspace = true }
# LABS-1120: the PARSE stage's fine sub-split stamps the same monotonic
# clock the engine's phase timing uses (`web_time::Instant`) — native
# `std::time::Instant`, the Performance clock on wasm32.
web-time = { workspace = true }

[dev-dependencies]
relate-test-support = { workspace = true }
