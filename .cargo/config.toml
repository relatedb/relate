# wasm32 has a 1 MiB default stack. The relate planner and executor
# recurse deep enough that non-trivial queries (e.g. MATCH (n) RETURN n)
# stack-overflow, which wasm surfaces as "memory access out of bounds".
# Native uses a 64 MiB worker stack (see relate/relate/src/lib.rs);
# 16 MiB is a comfortable browser-friendly middle ground.
[target.wasm32-unknown-unknown]
rustflags = ["-C", "link-arg=-zstack-size=16777216"]

# Windows MSVC: link the C runtime statically (ADR-0587). Without it every
# artifact imports VCRUNTIME140.dll and the UCRT, so the CLI .exe and the FFI
# .dll fail to start on a clean Windows, Windows Sandbox or Server Core host
# that lacks the Visual C++ redistributable. Workspace-wide on purpose: the
# CLI, the FFI DLL and the Python / Node native modules all build through
# here, and none of them passes CRT objects (FILE*, CRT heap pointers) across
# its boundary. An env RUSTFLAGS replaces this table, so no Windows build may
# set one; the release workflow checks the CLI's imports.
[target.x86_64-pc-windows-msvc]
rustflags = ["-C", "target-feature=+crt-static"]

[target.aarch64-pc-windows-msvc]
rustflags = ["-C", "target-feature=+crt-static"]

[alias]
xtask = "run -p xtask --"
