# wasm32 has a 1 MiB default stack. The relate planner and executor
# recurse deep enough that non-trivial queries (e.g. MATCH (n) RETURN n)
# stack-overflow, which wasm surfaces as "memory access out of bounds".
# Native uses a 64 MiB worker stack (see relate/relate/src/lib.rs);
# 16 MiB is a comfortable browser-friendly middle ground.
[target.wasm32-unknown-unknown]
rustflags = ["-C", "link-arg=-zstack-size=16777216"]

# Linux x86-64: pin the target CPU at the x86-64 baseline — identical to
# rustc's default, stated positively. The release lane's
# --pinned-toolchain vouch (scripts/check-linux-isa.sh) accepts a
# note-less binary on the strength of this pin: an ELF "x86 ISA needed"
# note cannot prove what rustc compiled for, because rustc emits that
# note at no target-cpu. The pin lives in-tree, reviewed beside the
# vouch, where no workflow env can silently drop it. Like the Windows
# entries below, an env RUSTFLAGS replaces this table — so no build of
# this target that feeds the ISA gate may set one; the mold preamble
# (ADR-0255, CARGO_TARGET_X86_64_UNKNOWN_LINUX_GNU_RUSTFLAGS) runs only
# on dev/test lanes and never in the release container lane.
[target.x86_64-unknown-linux-gnu]
rustflags = ["-C", "target-cpu=x86-64"]

# Windows MSVC: link the C runtime statically (ADR-0587). Without it every
# artifact imports VCRUNTIME140.dll and the UCRT, so the CLI .exe and the FFI
# .dll fail to start on a clean Windows, Windows Sandbox or Server Core host
# that lacks the Visual C++ redistributable. Workspace-wide on purpose: the
# CLI, the FFI DLL and the Python / Node native modules all build through
# here, and none of them passes CRT objects (FILE*, CRT heap pointers) across
# its boundary. An env RUSTFLAGS replaces this table, so no Windows build may
# set one; the release workflow checks the CLI's imports.
[target.x86_64-pc-windows-msvc]
rustflags = ["-C", "target-feature=+crt-static"]

[target.aarch64-pc-windows-msvc]
rustflags = ["-C", "target-feature=+crt-static"]

[alias]
xtask = "run -p xtask --"
