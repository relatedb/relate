[package]
name = "relate-ffi"
version.workspace = true
edition = "2021"
license.workspace = true

[lib]
crate-type = ["staticlib", "cdylib", "rlib"]

[features]
default = []
# Measurement-only pass-throughs for the experimental snapshot codecs.
rkyv-codec = ["relate/rkyv-codec"]
fjall-codec = ["relate/fjall-codec"]

[dependencies]
chrono = { workspace = true }
relate = { workspace = true, features = ["parquet"] }
relate-model = { workspace = true }
relate-core = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
