[package]
name = "relate-ffi"
version.workspace = true
edition = "2021"
publish = false
license.workspace = true

[lib]
crate-type = ["staticlib", "cdylib", "rlib"]

[features]
default = []
# Measurement-only pass-through for the experimental snapshot codec.
rkyv-codec = ["relate/rkyv-codec"]

[dev-dependencies]
# The one workspace home of the process-wide preview-opt-in test fixture
# (ADR-0593); no features — the preview module is un-gated.
relate-test-support = { workspace = true }

[dependencies]
chrono = { workspace = true }
relate = { workspace = true, features = ["parquet"] }
relate-model = { workspace = true }
relate-core = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
